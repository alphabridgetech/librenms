- name: Reboot Device via SSH
  hosts: all
  gather_facts: no

  tasks:

    - name: Copy Python reboot script
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/reboot_device_exec.py"
        mode: '0755'
        content: |
          import paramiko
          import time
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False
              )

              shell = ssh.invoke_shell()
              time.sleep(1)

              # Enter enable mode
              shell.send("enable\n")
              time.sleep(1)
              shell.send(PASSWORD + "\n")
              time.sleep(1)

              # Reboot command (your exact command)
              shell.send("reboot\n")
              time.sleep(1)

              # Confirm reboot
              shell.send("y\n")
              time.sleep(1)

              print("SUCCESS: DEVICE_REBOOTING")

              ssh.close()

          except Exception as e:
              print("ERROR:", e)

    - name: Run reboot script
      ansible.builtin.command: >
        /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
        /opt/librenms/librenms-ansible-inventory-plugin/tmp/reboot_device_exec.py
      register: output
      changed_when: true

    - name: Output result
      ansible.builtin.debug:
        var: output.stdout
