---
- name: Configure VLAN 300 on AlphaBridge via Telnet
  hosts: alphabridge_devices
  gather_facts: no
  become: true
  become_method: sudo
  tasks:
    - name: Ensure temp directory exists
      ansible.builtin.file:
        path: /opt/librenms/librenms-ansible-inventory-plugin/tmp
        state: directory
        mode: '0755'

    - name: Create Telnet script
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_config.py"
        mode: '0755'
        content: |
          import telnetlib
          import time

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          COMMANDS = [
              "enable",
              "config",
              "vlan 300",
              "interface gigaEthernet 0/1",
              "exit",
              "exit",
              "write memory"
          ]

          try:
              tn = telnetlib.Telnet(HOST, timeout=10)

              tn.read_until(b"Username:")
              tn.write(USER.encode('ascii') + b"\n")

              tn.read_until(b"Password:")
              tn.write(PASSWORD.encode('ascii') + b"\n")

              tn.read_until(b">")
              tn.write(b"enable\n")

              tn.read_until(b"#")

              for command in COMMANDS:
                  tn.write(command.encode('ascii') + b"\n")
                  time.sleep(1)  # Allow command to execute

              output = tn.read_very_eager().decode('ascii')
              tn.write(b"exit\n")
              tn.close()

              with open("/opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_config_output.txt", "w") as f:
                  f.write(output)

          except Exception as e:
              with open("/opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_config_output.txt", "w") as f:
                  f.write("Error: " + str(e))

    - name: Execute VLAN Configuration Script
      ansible.builtin.command: python3 /opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_config.py
      changed_when: false

    - name: Read VLAN Configuration Output
      ansible.builtin.slurp:
        src: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_config_output.txt"
      register: vlan_output

    - name: Show VLAN Configuration Output
      ansible.builtin.debug:
        msg: "{{ vlan_output['content'] | b64decode }}"
