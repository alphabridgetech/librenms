all:
  children:
    alphabridge_devices:
      hosts:
        bridge1:
          ansible_host: "{{ ansible_host }}"  # Device IP
          ansible_user: "{{ ansible_user }}"  # Telnet username
          ansible_password: "{{ ansible_password }}"  # Telnet password
          ansible_connection: local
          cmd: "{{ cmd }}"  # Dynamic command
      become: yes
