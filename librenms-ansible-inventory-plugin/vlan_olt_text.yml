---
- name: Configure VLAN on Alphabridge OLT
  hosts: alphabridge_devices
  gather_facts: no
  become: false
  tasks:

    - name: Copy Telnet Script for VLAN
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_script.py"
        mode: '0755'
        content: |
          {% raw %}
          import telnetlib
          import time

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          try:
              tn = telnetlib.Telnet(HOST, timeout=10)

              tn.read_until(b"Username:", timeout=5)
              tn.write(USER.encode('ascii') + b"\n")

              tn.read_until(b"Password:", timeout=5)
              tn.write(PASSWORD.encode('ascii') + b"\n")

              tn.read_until(b">", timeout=5)
              tn.write(b"enable\n")
              tn.read_until(b"#", timeout=5)

              tn.write(b"display vlan\n")
              time.sleep(2)
              output = tn.read_very_eager().decode('ascii')

              with open("/opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_output.txt", "w") as f:
                  f.write(output)

              tn.write(b"exit\n")
              tn.close()

          except Exception as e:
              with open("/opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_error.txt", "w") as f:
                  f.write("Error: " + str(e))
          {% endraw %}

    - name: Execute Telnet script
      ansible.builtin.command: python3 /opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_script.py
      register: output
      changed_when: false

    - name: Load VLAN output file
      ansible.builtin.slurp:
        src: /opt/librenms/librenms-ansible-inventory-plugin/tmp/vlan_output.txt
      register: vlan_output
      ignore_errors: yes

    - name: Show VLAN Output
      ansible.builtin.debug:
        msg: "{{ vlan_output.content | b64decode }}"
