# Example inventory. In production generate this from the LibreNMS DB:
#   vendor   <- devices.os      (switchv3alphabridge -> alphabridge)
#   series   <- devices.os      (switchv3alphabridge -> v3)
#   model    <- devices.hardware
#   firmware <- devices.version
all:
  children:
    alphabridge_devices:
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: alphabridge
        ansible_network_cli_ssh_type: paramiko
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ ansible_password }}"
      hosts:
        192.168.200.241:
          ansible_user: admin
          ansible_password: admin
          vendor: alphabridge
          series: v1
          model: as210t
        192.168.200.248:
          ansible_user: admin
          ansible_password: admin
          vendor: alphabridge
          series: v3
          model: as212xts
          firmware: "2.1.4"
