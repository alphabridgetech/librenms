# Use via: ANSIBLE_CONFIG=<this file> ansible-playbook ...
# (the parent folder is world-writable, so Ansible ignores an ansible.cfg
# found only through the current directory).
[defaults]
inventory = inventory/hosts.yml
library = library
terminal_plugins = plugins/terminal
cliconf_plugins = plugins/cliconf
filter_plugins = plugins/filter
host_key_checking = False
forks = 20
stdout_callback = ansible.builtin.default

[persistent_connection]
connect_timeout = 30
command_timeout = 60
