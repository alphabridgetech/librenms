[defaults]
host_key_checking = False

# Every playbook in this plugin runs its tasks via delegate_to: localhost
# and reaches the actual device through an embedded Python/paramiko SSH
# script using the device's own credentials - not Ansible's own remote
# connection or privilege escalation. become=True here only breaks local
# tasks (e.g. "Create output directory") whenever ansible-playbook is run
# with this directory as the working directory (so this ansible.cfg is
# picked up), since sudo isn't installed and nothing actually needs it.
[privilege_escalation]
become=False
