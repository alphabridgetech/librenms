---
- name: Run Dynamic Config on AlphaBridge via SSH
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/ssh_config.py"
    output_file: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/ssh_output.txt"

  tasks:

    - name: Create SSH config script
      copy:
        dest: "{{ script_path }}"
        mode: '0755'
        content: |
          import paramiko
          import time
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          COMMANDS = {{ cli_commands | to_json }}
          OUTPUT_FILE = "{{ output_file }}"

          output = ""

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(2)

              if shell.recv_ready():
                  output += shell.recv(65535).decode(errors="ignore")

              cmds = ["enable", "config"] + COMMANDS + ["exit", "exit", "write"]

              for cmd in cmds:
                  shell.send(cmd + "\n")
                  time.sleep(1)

                  while shell.recv_ready():
                      response = shell.recv(65535).decode(errors="ignore")
                      output += response

                      error_patterns = [
                          "Unknown command",
                          "Invalid input",
                          "Incomplete command",
                          "Ambiguous command",
                          "Invalid command"
                      ]

                      for pattern in error_patterns:
                          if pattern in response:
                              raise Exception(
                                  f"Device Error on command '{cmd}': {pattern}"
                              )

              shell.send("exit\n")
              time.sleep(1)

              ssh.close()

              with open(OUTPUT_FILE, "w") as f:
                  f.write(output)

              print(output)

          except Exception as e:
              error_msg = "ERROR: " + str(e)

              with open(OUTPUT_FILE, "w") as f:
                  f.write(error_msg)

              print(error_msg)
              sys.exit(1)

      delegate_to: localhost

    - name: Execute SSH script
      command: python3 {{ script_path }}
      register: result
      changed_when: false
      delegate_to: localhost

    - name: Show result
      debug:
        var: result.stdout