---
- name: Show Voice VLAN (MAC-based) configuration via SSH
  hosts: all
  gather_facts: no

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/showvoicevlanexec.py"
    python_bin: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Copy Python Voice VLAN SHOW script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import os
          import sys
          import re

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host }}_voicevlanshow.yml"

          ansi_re = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')


          def read_until_prompt(shell, prompt_regex, timeout=10):
              buf = ""
              end_time = time.time() + timeout
              while time.time() < end_time:
                  if shell.recv_ready():
                      buf += shell.recv(65535).decode(errors="ignore")
                      if re.search(prompt_regex, buf):
                          return buf
                      end_time = time.time() + 0.5
                  else:
                      time.sleep(0.1)
              return buf


          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(0.5)

              initial = read_until_prompt(shell, r'[#>]\s*$', timeout=3)
              m = re.search(r'([A-Za-z0-9\-\._]+[#>])\s*$', initial.strip())
              prompt = re.escape(m.group(1)) if m else r'[#>]\s*$'

              shell.send("enable\n")
              time.sleep(0.3)
              shell.send(PASSWORD + "\n")
              time.sleep(0.3)
              read_until_prompt(shell, prompt, timeout=2)

              shell.send("terminal length 0\n")
              time.sleep(0.2)
              read_until_prompt(shell, prompt, timeout=1)

              shell.send("show running-config non-interface | include voice-vlan\n")
              time.sleep(0.3)

              output = ""
              deadline = time.time() + 20
              while time.time() < deadline:
                  if shell.recv_ready():
                      chunk = shell.recv(65535).decode(errors="ignore")
                      output += chunk
                      if "--More--" in chunk:
                          shell.send(" ")
                          deadline = time.time() + 20
                          continue
                      if re.search(prompt, output):
                          break
                  else:
                      time.sleep(0.2)

              ssh.close()

              output = ansi_re.sub("", output).replace("--More--", "")

              voice_macs = []

              for line in output.splitlines():
                  line = line.strip()
                  # Example:
                  # voice-vlan mac-address 0800.27ea.e2f5 mask ffff.ffff.ffff
                  m = re.search(
                      r"voice-vlan\s+mac-address\s+([0-9a-fA-F\.]+)\s+mask\s+([0-9a-fA-F\.]+)",
                      line
                  )
                  if m:
                      voice_macs.append({
                          "mac": m.group(1),
                          "mask": m.group(2)
                      })

              os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)

              with open(OUTPUT_FILE, "w") as f:
                  f.write(f"ip: {HOST}\n")
                  f.write("mac_addresses:\n")
                  for item in voice_macs:
                      f.write(f"    - mac: \"{item['mac']}\"\n")
                      f.write(f"      mask: \"{item['mask']}\"\n")

              print("SUCCESS")

          except Exception as e:
              print("ERROR")
              print(str(e))
              sys.exit(1)

    - name: Run Voice VLAN SHOW script
      ansible.builtin.command:
        cmd: "{{ python_bin }} {{ script_path }}"
      register: voice_vlan_output
      changed_when: false
      failed_when: "'ERROR' in voice_vlan_output.stdout"

    - name: Display Voice VLAN output
      ansible.builtin.debug:
        msg: "{{ voice_vlan_output.stdout }}"
