# =============================================================================
# Playbook Name : Get Loopback Detection Interface List
# =============================================================================
#
# Description:
# Reads `show running-config`, discovers physical switch interfaces, and
# returns the Loopback Detection fields displayed in the GUI:
# Port, Loopback Detection, Control, Existence Loopback, Detection VLAN,
# Frames Monitor, Forbid Loopback Detection Packets, and destination MAC.
#
# Output:
#   output/<switch_ip>_loopback_detection_interface_list_get.yml
# =============================================================================

- name: Get Loopback Detection interface list
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    # Resolve paths from this checkout, including the Jenkins workspace.
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  pre_tasks:
    - name: Ensure script and output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

  tasks:
    # ==========================================
    # CREATE PYTHON SSH SCRIPT
    # ==========================================

    - name: Create Python SSH script for Loopback Detection interface get
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/loopback_detection_interface_list_get_exec.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import json
          import paramiko
          import re
          import time

          HOST = {{ ansible_host | to_json }}
          PORT = int({{ ansible_port | default(22) | to_json }})
          USER = {{ ansible_user | to_json }}
          PASSWORD = {{ ansible_password | to_json }}

          ANSI_RE = re.compile(r'\x1b(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*\Z')
          PAGER_RE = re.compile(
              r'--+\s*more\s*--+|----\s*more\s*----|'
              r'press\s+(?:any\s+key|space)\s+to\s+continue',
              re.IGNORECASE
          )
          CLI_ERROR_RE = re.compile(
              r'(?im)^\s*%\s*(?:invalid|error|incomplete|ambiguous|'
              r'unknown|unrecognized)\b|'
              r'\b(?:invalid input|unknown command|incomplete command|'
              r'command rejected|fail with ret\s*-?\d+)\b'
          )
          # 10G: g0/1, tg0/1 (GigaEthernet0/1 ...); 100G: tg0/0/1, cg0/0/1
          INTERFACE_RE = re.compile(
              r'^\s*interface\s+(CGigaEthernet|TGigaEthernet|GigaEthernet|cg|tg|g)(\d+(?:/\d+)+)\s*$',
              re.IGNORECASE
          )

          def read_until_prompt(shell, stage, timeout=60):
              """Read CLI output until the switch prompt returns."""
              output = ""
              deadline = time.monotonic() + timeout
              pager_count = 0
              while time.monotonic() < deadline:
                  if shell.recv_ready():
                      output += shell.recv(65535).decode(errors="ignore")
                      clean = ANSI_RE.sub("", output).replace("\r", "")
                      current_pager_count = len(PAGER_RE.findall(clean))
                      if current_pager_count > pager_count:
                          shell.send(" ")
                          pager_count = current_pager_count
                      if PROMPT_RE.search(clean.rstrip()):
                          return clean
                  else:
                      time.sleep(0.1)
              raise TimeoutError(f"Timed out waiting for switch prompt during {stage}")


          def run_command(shell, command, stage, timeout=60):
              """Run one CLI command and reject recognizable switch errors."""
              shell.send(command + "\n")
              output = read_until_prompt(shell, stage, timeout)
              if CLI_ERROR_RE.search(output):
                  raise RuntimeError(f"Switch rejected {command!r}: {output.strip()}")
              return output


          def normalize_port(prefix, slot_port):
              """Format the CLI interface name like the GUI Port column."""
              prefix = prefix.lower()
              if prefix == "t gigaethernet":
                  prefix = "tg"
              elif prefix == "tgigaethernet":
                  prefix = "tg"
              elif prefix == "cgigaethernet":
                  prefix = "cg"
              elif prefix == "gigaethernet":
                  prefix = "g"
              return f"{prefix}{slot_port}".lower()


          def parse_interface_block(interface_name, port, lines):
              """Parse one physical interface into GUI column values."""
              commands = [line.strip().lower() for line in lines]

              def has_command(command):
                  return command in commands

              def has_no_command(command):
                  return f"no {command}" in commands

              existence_command = "loopback-detection existence"
              frames_command = "loopback-detection frames-monitor"
              forbid_command = "loopback-detection forbid-packet"
              enabled_command = "loopback-detection enable"

              existence = has_command(existence_command) and not has_no_command(existence_command)
              # Some firmware omits the interface enable line from running-config
              # while retaining the related existence setting. Use that setting
              # as the GUI enable indicator when no explicit enable line exists.
              loopback_enabled = (
                  (has_command(enabled_command) and not has_no_command(enabled_command))
                  or (not has_no_command(enabled_command) and existence)
              )

              control = ""
              detection_vlan = ""
              dest_mac = ""
              for command in commands:
                  match = re.fullmatch(r"loopback-detection\s+control\s+(\S+)", command)
                  if match:
                      control = match.group(1)
                      continue
                  match = re.fullmatch(r"loopback-detection\s+vlan-control\s+(\d+)", command)
                  if match:
                      detection_vlan = match.group(1)
                      continue
                  match = re.fullmatch(r"loopback-detection\s+dest-mac\s+(\S+)", command)
                  if match:
                      dest_mac = match.group(1)

              return {
                  "port": port,
                  "loopback_detection": "Enable" if loopback_enabled else "Disable",
                  "control": control,
                  "existence_loopback": "Enable" if existence else "Disable",
                  "detection_vlan": detection_vlan,
                  "frames_monitor": "Enable" if (
                      has_command(frames_command) and not has_no_command(frames_command)
                  ) else "Disable",
                  "forbid_loopback_detection_packets": "Enable" if (
                      has_command(forbid_command) and not has_no_command(forbid_command)
                  ) else "Disable",
                  "dest_mac": dest_mac
              }


          def parse_loopback_detection_interfaces(running_config):
              """Discover physical ports and parse their interface settings."""
              clean = ANSI_RE.sub("", running_config).replace("\r", "")
              # Remove 100G pager leftovers (" --more-- " and the backspaces
              # that erase it), which otherwise end up in front of the next
              # "interface ..." line at every page break.
              clean = re.sub(r'[ \t]*--+\s*more\s*--+[ \t]*', '', clean, flags=re.IGNORECASE)
              clean = re.sub(r'\x08+[ \t]*\x08*', '', clean)
              if not any(
                  line.strip().lower() == "current configuration:"
                  for line in clean.splitlines()
              ):
                  raise ValueError(
                      "SHOW output did not contain 'Current configuration:'"
                  )

              interfaces = []
              current_interface = None
              current_port = None
              current_lines = []

              def save_current():
                  if current_interface is not None:
                      interfaces.append(parse_interface_block(
                          current_interface, current_port, current_lines
                      ))

              for line in clean.splitlines():
                  if line.strip().lower() == "current configuration:":
                      continue
                  if line.startswith("interface ") or line.strip().lower().startswith("interface "):
                      save_current()
                      match = INTERFACE_RE.match(line)
                      if match:
                          prefix, slot_port = match.groups()
                          current_interface = f"{prefix}{slot_port}"
                          current_port = normalize_port(prefix, slot_port)
                          current_lines = []
                      else:
                          current_interface = None
                          current_port = None
                          current_lines = []
                      continue
                  if current_interface is not None:
                      if line.strip() == "!":
                          save_current()
                          current_interface = None
                          current_port = None
                          current_lines = []
                      else:
                          current_lines.append(line)

              save_current()
              if not interfaces:
                  raise ValueError("No physical Ethernet interfaces were found in SHOW output")
              return interfaces


          shell = None
          ssh = None
          stage = "SSH connection"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST,
                  port=PORT,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=20,
                  auth_timeout=20,
                  banner_timeout=20
              )

              shell = ssh.invoke_shell()
              read_until_prompt(shell, "initial SSH prompt", timeout=10)

              stage = "enable mode"
              run_command(shell, "enable", stage, timeout=10)

              stage = "disable paging"
              run_command(shell, "terminal length 0", stage, timeout=10)

              stage = "show running-config"
              running_config = run_command(
                  shell, "show running-config", stage, timeout=90
              )

              stage = "parse Loopback Detection interface configuration"
              interfaces = parse_loopback_detection_interfaces(running_config)

              print(json.dumps({
                  "ip": HOST,
                  "interfaces": interfaces,
                  "status": "success"
              }, indent=4))

          except Exception as exc:
              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "stage": stage,
                  "error": str(exc)
              }, indent=4))

          finally:
              if shell is not None:
                  shell.close()
              if ssh is not None:
                  ssh.close()
      no_log: true

    # ==========================================
    # EXECUTE PYTHON SCRIPT
    # ==========================================

    - name: Execute Loopback Detection interface get script
      ansible.builtin.command:
        argv:
          - "{{ project_root }}/bin/python3"
          - "{{ tmp_dir }}/loopback_detection_interface_list_get_exec.py"
      register: loopback_detection_interface_raw
      changed_when: false
      failed_when: false

    # ==========================================
    # CONVERT JSON RESULT
    # ==========================================

    - name: Convert Loopback Detection interface result to JSON
      ansible.builtin.set_fact:
        loopback_detection_interface_result: "{{ loopback_detection_interface_raw.stdout | from_json }}"

    # ==========================================
    # DISPLAY RESULT
    # ==========================================

    - name: Display Loopback Detection interface result
      ansible.builtin.debug:
        var: loopback_detection_interface_result

    # ==========================================
    # SAVE RESULT
    # ==========================================

    - name: Save Loopback Detection interface result
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_loopback_detection_interface_list_get.yml"
        content: |
          {{ loopback_detection_interface_result | to_nice_yaml }}

    # ==========================================
    # FAIL IF COMMAND FAILED
    # ==========================================

    - name: Fail if Loopback Detection interface get failed
      ansible.builtin.fail:
        msg: "{{ loopback_detection_interface_result.error }}"
      when: loopback_detection_interface_result.status == "failed"

    # ==========================================
    # FINAL MESSAGE
    # ==========================================

    - name: Display result file
      ansible.builtin.debug:
        msg: >
          Loopback Detection interface configuration retrieved from
          {{ ansible_host }}. Result saved to
          output/{{ ansible_host }}_loopback_detection_interface_list_get.yml
