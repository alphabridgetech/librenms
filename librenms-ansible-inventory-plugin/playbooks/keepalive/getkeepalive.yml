
---
# ============================================================================
# File        : getkeepalive.yml
# Feature     : Keepalive - GET
#
# Purpose:
#   Retrieve keepalive configuration for dynamically discovered
#   GigaEthernet interfaces.
#
# Process:
#   1. Discover interfaces using show interface.
#   2. Retrieve keepalive configuration for each discovered interface.
#   3. Save the results to the output directory.
#
# Output:
#   /home/gayatri/ansible/ABOSS/output/<device-ip>_keepalive.yml
#
# Ansible Command:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/keepalive/getkeepalive.yml
# ============================================================================

- name: Get Keepalive Configuration
  hosts: all
  gather_facts: no
  connection: local

  vars:

    # ------------------------------------------------------------------------
    # Default directories
    #
    # These can be overridden from the command line:
    #
    # -e '{"output_dir": "...", "tmp_dir": "..."}'
    # ------------------------------------------------------------------------

    output_dir: "{{ playbook_dir }}/../../output"

    tmp_dir: "{{ playbook_dir }}/../../tmp"

  tasks:

    # ========================================================================
    # CREATE OUTPUT DIRECTORY
    # ========================================================================

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # ========================================================================
    # CREATE TEMP DIRECTORY
    # ========================================================================

    - name: Create temporary script directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # ========================================================================
    # CREATE PYTHON SCRIPT
    # ========================================================================

    - name: Create Keepalive GET script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/get_keepalive.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import json
          import re
          import sys

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          USER = "{{ ansible_user | default('admin') }}"
          PASS = "{{ ansible_password | default('admin') }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_keepalive.yml"

          # ================================================================
          # CLEAN OUTPUT
          # ================================================================

          def clean_output(data):

              data = re.sub(
                  r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])',
                  '',
                  data
              )

              return data.replace('\r', '')

          # ================================================================
          # READ SHELL OUTPUT
          # ================================================================

          def read_output(shell, timeout=8):

              buffer = ""
              end_time = time.time() + timeout
              last_data = time.time()

              while time.time() < end_time:

                  if shell.recv_ready():

                      data = shell.recv(65535).decode(
                          errors="ignore"
                      )

                      buffer += data
                      last_data = time.time()

                      if "--More--" in data:
                          shell.send(" ")

                  else:

                      if buffer and time.time() - last_data > 1:
                          break

                      time.sleep(0.1)

              return clean_output(buffer)

          # ================================================================
          # SEND COMMAND
          # ================================================================

          def cmd(shell, command):

              while shell.recv_ready():
                  shell.recv(65535)

              shell.send(command + "\n")

              return read_output(shell)

          # ================================================================
          # CHECK CLI ERROR
          # ================================================================

          def check_error(output):

              patterns = [
                  r"Unknown command",
                  r"Invalid command",
                  r"invalid input",
                  r"Incomplete command",
                  r"% ?Error",
                  r"% ?Invalid"
              ]

              return any(
                  re.search(pattern, output, re.IGNORECASE)
                  for pattern in patterns
              )

          # ================================================================
          # DISCOVER INTERFACES
          # ================================================================

          def discover_interfaces(output):

              interfaces = set()

              for line in output.splitlines():

                  match = re.search(
                      r'\b(GigaEthernet\s*\d+/\d+)\b',
                      line,
                      re.IGNORECASE
                  )

                  if match:

                      interface = re.sub(
                          r'\s+',
                          '',
                          match.group(1)
                      )

                      interfaces.add(interface)

              return sorted(
                  interfaces,
                  key=lambda name: tuple(
                      int(number)
                      for number in re.findall(r'\d+', name)
                  )
              )

          # ================================================================
          # PARSE KEEPALIVE CONFIGURATION
          # ================================================================

          def parse_keepalive(output, interface):

              match = re.search(
                  r'^\s*keepalive\s+(\d+)\b',
                  output,
                  re.IGNORECASE | re.MULTILINE
              )

              if match:

                  return {
                      "interface": interface,
                      "status": "Enable",
                      "period": int(match.group(1))
                  }

              return {
                  "interface": interface,
                  "status": "Disable",
                  "period": 0
              }

          # ================================================================
          # SSH
          # ================================================================

          ssh = paramiko.SSHClient()

          ssh.set_missing_host_key_policy(
              paramiko.AutoAddPolicy()
          )

          try:

              # ------------------------------------------------------------
              # CONNECT
              # ------------------------------------------------------------

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASS,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()

              time.sleep(1)

              while shell.recv_ready():
                  shell.recv(65535)

              # ------------------------------------------------------------
              # ENABLE
              # ------------------------------------------------------------

              output = cmd(shell, "enable")

              # ------------------------------------------------------------
              # DISCOVER INTERFACES
              # ------------------------------------------------------------

              interface_output = cmd(
                  shell,
                  "show interface"
              )

              if check_error(interface_output):

                  raise Exception(
                      "Failed to discover interfaces: "
                      + interface_output
                  )

              interfaces = discover_interfaces(
                  interface_output
              )

              if not interfaces:

                  raise Exception(
                      "No GigaEthernet interfaces found in "
                      "'show interface' output. Check the command "
                      "output and interface format."
                  )

              # ------------------------------------------------------------
              # GET KEEPALIVE CONFIGURATION
              # ------------------------------------------------------------

              results = []

              for interface in interfaces:

                  interface_number = interface.replace(
                      "GigaEthernet",
                      ""
                  )

                  command = (
                      "show running-config interface "
                      "GigaEthernet " + interface_number
                  )

                  output = cmd(shell, command)

                  if check_error(output):

                      raise Exception(
                          "Failed to get configuration for "
                          + interface + ": " + output
                      )

                  results.append(
                      parse_keepalive(
                          output,
                          interface
                      )
                  )

              # ------------------------------------------------------------
              # SAVE OUTPUT
              # ------------------------------------------------------------

              result_data = {
                  "device_ip": HOST,
                  "feature": "Keepalive",
                  "status": "success",
                  "interface_count": len(interfaces),
                  "interfaces": results
              }

              with open(OUTPUT_FILE, "w") as file:

                  json.dump(
                      result_data,
                      file,
                      indent=4
                  )

                  file.write("\n")

              print(
                  json.dumps(
                      result_data,
                      indent=4
                  )
              )

              sys.exit(0)

          except Exception as e:

              result_data = {
                  "device_ip": HOST,
                  "feature": "Keepalive",
                  "status": "failure",
                  "error": str(e)
              }

              print(
                  json.dumps(
                      result_data,
                      indent=4
                  )
              )

              sys.exit(1)

          finally:

              try:
                  ssh.close()
              except Exception:
                  pass

    # ========================================================================
    # EXECUTE SCRIPT
    # ========================================================================

    - name: Execute Keepalive GET
      ansible.builtin.command:
        cmd: "python3 {{ tmp_dir }}/get_keepalive.py"
      register: keepalive_get
      changed_when: false
      delegate_to: localhost

    # ========================================================================
    # FAIL IF GET FAILED
    # ========================================================================

    - name: Fail if Keepalive GET failed
      ansible.builtin.fail:
        msg: "{{ keepalive_get.stdout | default(keepalive_get.stderr) }}"
      when: keepalive_get.rc != 0

    # ========================================================================
    # DISPLAY RESULT
    # ========================================================================

    - name: Display Keepalive GET result
      ansible.builtin.debug:
        msg:
          device_ip: "{{ ansible_host | default(inventory_hostname) }}"
          status: "success"
          output_file: "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_keepalive.yml"
          result: "{{ keepalive_get.stdout | from_json }}"

