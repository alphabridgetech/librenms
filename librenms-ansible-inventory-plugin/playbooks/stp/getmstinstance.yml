---
# ============================================================
# ABOSS - MST Region / MST Instance Information GET
# ============================================================
#
# File:
#   playbooks/stp/getmstinstance.yml
#
# Purpose:
#   Get complete MST Region information:
#     - MST Region Name
#     - MST Revision
#     - MST Instance IDs
#     - VLAN IDs mapped to each MST Instance
#
# CLI command:
#   show spanning-tree mstp region
#
# Output:
#   /opt/librenms/librenms-ansible-inventory-plugin/output/<device-ip>_mstinstance.yml
#
# ============================================================

- name: MST Region / MST Instance Information - GET
  hosts: alphabridge_devices
  gather_facts: no

  vars:

    # ========================================================
    # Output directories
    # ========================================================

    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    tmp_dir: "/opt/librenms/librenms-ansible-inventory-plugin/tmp"


  tasks:

    # ========================================================
    # 1. Create output directory
    # ========================================================

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost


    # ========================================================
    # 2. Create temporary directory
    # ========================================================

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost


    # ========================================================
    # 3. Check SSH connectivity
    # ========================================================

    - name: Check SSH before MST Region GET
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 10
      delegate_to: localhost


    # ========================================================
    # 4. Get MST Region information
    # ========================================================

    - name: Get MST Region information
      ansible.builtin.shell: |
        python3 - <<'PY'

        import paramiko
        import time
        import re
        import yaml


        # ====================================================
        # Device information
        # ====================================================

        HOST = "{{ ansible_host }}"
        PORT = 22

        USER = "{{ ansible_user }}"
        PASSWORD = "{{ ansible_password }}"

        CONNECT_TIMEOUT = 15

        OUTPUT_FILE = (
            "{{ output_dir }}/"
            "{{ ansible_host }}_mstinstance.yml"
        )


        # ====================================================
        # SSH connection
        # ====================================================

        def connect_device():

            client = paramiko.SSHClient()

            client.set_missing_host_key_policy(
                paramiko.AutoAddPolicy()
            )

            client.connect(
                hostname=HOST,
                port=PORT,
                username=USER,
                password=PASSWORD,
                timeout=CONNECT_TIMEOUT,
                banner_timeout=CONNECT_TIMEOUT,
                auth_timeout=CONNECT_TIMEOUT,
                look_for_keys=False,
                allow_agent=False
            )

            return client


        # ====================================================
        # Send command and handle pagination
        # ====================================================

        def send_command(shell, command, timeout=30):

            shell.send(command + "\n")

            output = ""

            start_time = time.time()

            while True:

                if shell.recv_ready():

                    data = shell.recv(
                        65535
                    ).decode(
                        "utf-8",
                        errors="ignore"
                    )

                    output += data


                    # ----------------------------------------
                    # Handle pagination
                    # ----------------------------------------

                    if (
                        "--More--" in data
                        or "--More-- " in data
                        or "More--" in data
                    ):

                        shell.send(" ")

                        time.sleep(0.5)

                        continue


                    # ----------------------------------------
                    # Detect switch prompt
                    # ----------------------------------------

                    if re.search(
                        r'(Switch(?:_config)?[#>])\s*$',
                        output,
                        re.MULTILINE
                    ):

                        time.sleep(0.5)

                        while shell.recv_ready():

                            output += shell.recv(
                                65535
                            ).decode(
                                "utf-8",
                                errors="ignore"
                            )

                        break

                else:

                    if (
                        time.time() - start_time
                        > timeout
                    ):

                        break

                    time.sleep(0.2)


            return output


        # ====================================================
        # Clean output
        # ====================================================

        def clean_output(output):

            output = output.replace(
                "\r\n",
                "\n"
            )

            output = output.replace(
                "\r",
                "\n"
            )

            output = output.replace(
                "--More--",
                ""
            )

            # Remove ANSI escape sequences
            output = re.sub(
                r'\x1b\[[0-9;?]*[A-Za-z]',
                '',
                output
            )

            return output


        # ====================================================
        # Parse MST Region Name
        # ====================================================

        def parse_region_name(output):

            match = re.search(
                r'Name:\s*\[\s*([^\]]+?)\s*\]',
                output,
                re.IGNORECASE
            )

            if match:

                return match.group(1).strip()

            return None


        # ====================================================
        # Parse MST Revision
        # ====================================================

        def parse_revision(output):

            match = re.search(
                r'Revision:\s*\[\s*(\d+)\s*\]',
                output,
                re.IGNORECASE
            )

            if match:

                return int(
                    match.group(1)
                )

            return None


        # ====================================================
        # Parse MST Instance Table
        # ====================================================

        def parse_mst_instances(output):

            instances = []

            in_table = False

            for line in output.splitlines():

                line = line.strip()


                if not line:

                    continue


                # --------------------------------------------
                # Start of MST Config Table
                # --------------------------------------------

                if re.search(
                    r'^MST\s+Config\s+Table:',
                    line,
                    re.IGNORECASE
                ):

                    in_table = True

                    continue


                if not in_table:

                    continue


                # --------------------------------------------
                # Skip table header
                # --------------------------------------------

                if re.match(
                    r'^Instance\s+VLAN\s+IDs$',
                    line,
                    re.IGNORECASE
                ):

                    continue


                # --------------------------------------------
                # Skip separator
                # --------------------------------------------

                if re.match(
                    r'^-+$',
                    line
                ):

                    continue


                # --------------------------------------------
                # Parse instance row
                #
                # Example:
                #
                # 0     1-3,5-9,11-4094
                # 1     10
                # 3     4
                # --------------------------------------------

                match = re.match(
                    r'^(\d+)\s+(.+?)\s*$',
                    line
                )

                if not match:

                    continue


                instance_id = int(
                    match.group(1)
                )

                vlan_ids = (
                    match.group(2).strip()
                )


                instances.append({

                    "instance_id": instance_id,

                    "vlan_ids": vlan_ids

                })


            return instances


        # ====================================================
        # Result structure
        # ====================================================

        result = {

            "status": "FAILED",

            "device_ip": HOST,

            "mst_region": {

                "name": None,

                "revision": None

            },

            "mst_instance_info": []

        }


        client = None


        try:

            # =================================================
            # Connect
            # =================================================

            client = connect_device()

            shell = client.invoke_shell()

            time.sleep(1)


            # =================================================
            # Clear initial banner
            # =================================================

            while shell.recv_ready():

                shell.recv(
                    65535
                )


            # =================================================
            # Enable mode
            # =================================================

            send_command(
                shell,
                "enable"
            )


            # =================================================
            # Enter configuration mode
            # =================================================

            send_command(
                shell,
                "config"
            )


            # =================================================
            # Get complete MST Region information
            # =================================================

            output = send_command(
                shell,
                "show spanning-tree mstp region",
                timeout=30
            )


            # =================================================
            # Clean output
            # =================================================

            output = clean_output(
                output
            )


            # =================================================
            # Parse Region Name
            # =================================================

            region_name = parse_region_name(
                output
            )


            # =================================================
            # Parse Revision
            # =================================================

            revision = parse_revision(
                output
            )


            # =================================================
            # Parse MST Instance Information
            # =================================================

            mst_instances = parse_mst_instances(
                output
            )


            # =================================================
            # Store complete data
            # =================================================

            result["mst_region"]["name"] = (
                region_name
            )

            result["mst_region"]["revision"] = (
                revision
            )

            result["mst_instance_info"] = (
                mst_instances
            )


            # =================================================
            # Success
            # =================================================

            result["status"] = "SUCCESS"


        except Exception as exc:

            result["status"] = "FAILED"

            result["error"] = str(exc)


        finally:

            # =================================================
            # Close connection
            # =================================================

            if client:

                client.close()


            # =================================================
            # Write YAML
            # =================================================

            with open(
                OUTPUT_FILE,
                "w"
            ) as output_file:

                yaml.safe_dump(
                    result,
                    output_file,
                    sort_keys=False,
                    default_flow_style=False
                )


        PY
      args:
        executable: /bin/bash

      register: mst_region_get

      delegate_to: localhost

      changed_when: false


    # ========================================================
    # 5. Display complete result
    # ========================================================

    - name: Display MST Region and Instance information
      ansible.builtin.debug:
        msg: "{{ lookup('file', output_dir + '/' + ansible_host + '_mstinstance.yml') }}"
      delegate_to: localhost
