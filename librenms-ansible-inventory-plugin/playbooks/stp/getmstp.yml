---
# ============================================================
# ABOSS - MSTP Configuration GET
# ============================================================
#
# File:
#   playbooks/stp/getmstp.yml
#
# Purpose:
#   Get MSTP Root ID information and MSTP interface state.
#
# CLI command:
#   show spanning-tree
#
# Output:
#   /opt/librenms/librenms-ansible-inventory-plugin/output/<device-ip>_mstp.yml
#
# ============================================================

- name: MSTP Configuration - GET
  hosts: alphabridge_devices
  gather_facts: no

  vars:

    # ========================================================
    # Output directories
    # ========================================================

    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:

    # ========================================================
    # 1. Create output directory
    # ========================================================

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost


    # ========================================================
    # 2. Create temporary directory
    # ========================================================

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost


    # ========================================================
    # 3. Check SSH connectivity
    # ========================================================

    - name: Check SSH before MSTP GET
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 10
      delegate_to: localhost


    # ========================================================
    # 4. Get MSTP information
    # ========================================================

    - name: Get MSTP configuration
      ansible.builtin.shell: |
        python3 - <<'PY'

        import paramiko
        import time
        import re
        import yaml


        # ====================================================
        # Device information
        # ====================================================

        HOST = "{{ ansible_host }}"
        PORT = 22

        USER = "{{ ansible_user }}"
        PASSWORD = "{{ ansible_password }}"

        CONNECT_TIMEOUT = 15

        OUTPUT_FILE = (
            "{{ output_dir }}/"
            "{{ ansible_host }}_mstp.yml"
        )


        # ====================================================
        # SSH connection
        # ====================================================

        def connect_device():

            client = paramiko.SSHClient()

            client.set_missing_host_key_policy(
                paramiko.AutoAddPolicy()
            )

            client.connect(
                hostname=HOST,
                port=PORT,
                username=USER,
                password=PASSWORD,
                timeout=CONNECT_TIMEOUT,
                banner_timeout=CONNECT_TIMEOUT,
                auth_timeout=CONNECT_TIMEOUT,
                look_for_keys=False,
                allow_agent=False
            )

            return client


        # ====================================================
        # Send command
        #
        # IMPORTANT:
        # Do NOT depend on the switch prompt.
        #
        # Different switches may use prompts such as:
        #
        #   as210t>
        #   as210t#
        #   as210t_config#
        #   Switch>
        #   Switch#
        #   Switch_config#
        #
        # Command completion is determined by the absence
        # of new data instead of matching a prompt.
        # ====================================================

        def send_command(shell, command, timeout=30):

            shell.send(command + "\n")

            output = ""

            start_time = time.time()

            last_data_time = time.time()

            while True:

                if shell.recv_ready():

                    data = shell.recv(
                        65535
                    ).decode(
                        "utf-8",
                        errors="ignore"
                    )

                    if data:

                        output += data

                        last_data_time = time.time()

                        # ------------------------------------
                        # Handle pagination
                        # ------------------------------------

                        if (
                            "--More--" in data
                            or "More--" in data
                        ):

                            shell.send(" ")

                            time.sleep(0.3)

                else:

                    # ----------------------------------------
                    # No new data received.
                    #
                    # Wait until the channel has been quiet
                    # before considering the command complete.
                    # ----------------------------------------

                    if (
                        time.time() - last_data_time
                        >= 1.5
                    ):

                        break

                    # ----------------------------------------
                    # Overall timeout
                    # ----------------------------------------

                    if (
                        time.time() - start_time
                        >= timeout
                    ):

                        break

                    time.sleep(0.1)

            return output


        # ====================================================
        # Clean output
        # ====================================================

        def clean_output(output):

            output = output.replace(
                "\r\n",
                "\n"
            )

            output = output.replace(
                "\r",
                "\n"
            )

            # Remove pagination markers

            output = re.sub(
                r'--More--\s*',
                '',
                output,
                flags=re.IGNORECASE
            )

            # Remove ANSI escape sequences

            output = re.sub(
                r'\x1b\[[0-9;?]*[A-Za-z]',
                '',
                output
            )

            return output


        # ====================================================
        # Parse integer value
        # ====================================================

        def parse_int(pattern, text):

            match = re.search(
                pattern,
                text,
                re.IGNORECASE
            )

            if match:

                try:

                    return int(
                        match.group(1)
                    )

                except ValueError:

                    return None

            return None


        # ====================================================
        # Result structure
        # ====================================================

        result = {

            "status": "FAILED",

            "device_ip": HOST,

            "feature": "mstp",

            "root_id": {},

            "interfaces": []

        }


        client = None


        try:

            # =================================================
            # Connect
            # =================================================

            client = connect_device()

            shell = client.invoke_shell()

            time.sleep(1)


            # =================================================
            # Clear initial banner
            # =================================================

            while shell.recv_ready():

                shell.recv(
                    65535
                )


            # =================================================
            # Enter enable mode
            #
            # We do not depend on the prompt here.
            # =================================================

            send_command(
                shell,
                "enable",
                timeout=5
            )


            # =================================================
            # Get MSTP information
            #
            # Do NOT use:
            #
            #   terminal length 0
            #
            # Pagination is handled automatically.
            # =================================================

            output = send_command(
                shell,
                "show spanning-tree",
                timeout=30
            )


            # =================================================
            # Clean command output
            # =================================================

            output = clean_output(
                output
            )


            # =================================================
            # Root ID
            # =================================================

            root_id = {}


            # -------------------------------------------------
            # MST Instance
            #
            # Example:
            #
            # MST00
            # -------------------------------------------------

            match = re.search(
                r'^\s*(MST\d+)\s*$',
                output,
                re.MULTILINE |
                re.IGNORECASE
            )

            if match:

                root_id["instance"] = (
                    match.group(1).strip()
                )


            # -------------------------------------------------
            # Root ID block
            #
            # Example:
            #
            # MST00
            #   Root ID    Priority    53248
            #              Address     C86B.BCA0.D0F3
            #              This bridge is the root
            #              Hello Time 2 sec
            #              Max Age 20 sec
            #              Forward Delay 15 sec
            # -------------------------------------------------

            root_match = re.search(
                r'Root\s+ID.*?'
                r'(?:Forward\s+Delay\s+\d+\s+sec|'
                r'(?=^\s*(?:Bridge\s+ID|MST\d+)\b))',
                output,
                re.MULTILINE |
                re.IGNORECASE |
                re.DOTALL
            )

            if root_match:

                root_block = root_match.group(0)

            else:

                root_block = output


            # -------------------------------------------------
            # Root Priority
            # -------------------------------------------------

            priority = parse_int(
                r'Root\s+ID\s+Priority\s+(\d+)',
                root_block
            )

            if priority is not None:

                root_id["priority"] = priority


            # -------------------------------------------------
            # Root Address
            # -------------------------------------------------

            match = re.search(
                r'Address\s+([0-9A-Fa-f.]+)',
                root_block,
                re.IGNORECASE
            )

            if match:

                root_id["address"] = (
                    match.group(1).strip()
                )


            # -------------------------------------------------
            # Root bridge status
            # -------------------------------------------------

            root_id["this_bridge_is_root"] = bool(
                re.search(
                    r'This\s+bridge\s+is\s+the\s+root',
                    root_block,
                    re.IGNORECASE
                )
            )


            # -------------------------------------------------
            # Root Port
            # -------------------------------------------------

            match = re.search(
                r'Root\s+Port\s+([^\s]+)',
                root_block,
                re.IGNORECASE
            )

            if match:

                root_id["root_port"] = (
                    match.group(1).strip()
                )


            # -------------------------------------------------
            # Root Cost
            # -------------------------------------------------

            root_cost = parse_int(
                r'Root\s+Cost\s+(\d+)',
                root_block
            )

            if root_cost is not None:

                root_id["root_cost"] = root_cost


            # -------------------------------------------------
            # Hello Time
            # -------------------------------------------------

            hello_time = parse_int(
                r'Hello\s+Time\s+(\d+)\s+sec',
                root_block
            )

            if hello_time is not None:

                root_id["hello_time"] = hello_time


            # -------------------------------------------------
            # Max Age
            # -------------------------------------------------

            max_age = parse_int(
                r'Max\s+Age\s+(\d+)\s+sec',
                root_block
            )

            if max_age is not None:

                root_id["max_age"] = max_age


            # -------------------------------------------------
            # Forward Delay
            # -------------------------------------------------

            forward_delay = parse_int(
                r'Forward\s+Delay\s+(\d+)\s+sec',
                root_block
            )

            if forward_delay is not None:

                root_id["forward_delay"] = forward_delay


            # =================================================
            # MSTP Interface Table
            # =================================================

            interfaces = []


            # -------------------------------------------------
            # Parse interface rows
            #
            # Supported examples:
            #
            # g0/2 Desg FWD 200000 128.2 Edge
            #
            # GigaEthernet0/2 Desg FWD 200000 128.2 Edge
            #
            # TGigaEthernet0/1 Root FWD 20000 128.1 P2P
            #
            # Port-aggregator1 Desg FWD 20000 128.1 P2P
            # -------------------------------------------------

            for line in output.splitlines():

                line = line.strip()

                if not line:

                    continue


                # ------------------------------------------------
                # Skip headers
                # ------------------------------------------------

                if re.match(
                    r'^Interface\s+Role\s+Sts',
                    line,
                    re.IGNORECASE
                ):

                    continue


                # ------------------------------------------------
                # Skip separators
                # ------------------------------------------------

                if re.match(
                    r'^[-=]+$',
                    line
                ):

                    continue


                # ------------------------------------------------
                # Interface row
                # ------------------------------------------------

                match = re.match(
                    r'^'
                    r'((?:GigaEthernet|TGigaEthernet|'
                    r'Port-aggregator|g|tg|p)'
                    r'(?:[A-Za-z0-9._/-]*))'
                    r'\s+'
                    r'(\S+)'
                    r'\s+'
                    r'(\S+)'
                    r'\s+'
                    r'(\d+)'
                    r'\s+'
                    r'(\S+)'
                    r'(?:\s+'
                    r'(.+?))?'
                    r'\s*$',
                    line,
                    re.IGNORECASE
                )


                if not match:

                    continue


                port = match.group(1)

                role = match.group(2)

                state = match.group(3)

                cost = match.group(4)

                pri_nbr = match.group(5)

                port_type = (
                    match.group(6).strip()
                    if match.group(6)
                    else ""
                )


                # ------------------------------------------------
                # Prevent accidental parsing of unrelated lines
                # ------------------------------------------------

                if role.lower() in [
                    "root",
                    "desg",
                    "designated",
                    "alternate",
                    "backup",
                    "master"
                ]:

                    interfaces.append({

                        "port": port,

                        "role": role,

                        "state": state,

                        "cost": int(cost),

                        "pri_nbr": pri_nbr,

                        "type": port_type

                    })


            # =================================================
            # Store parsed data
            # =================================================

            result["root_id"] = root_id

            result["interfaces"] = interfaces


            # =================================================
            # Success
            # =================================================

            result["status"] = "SUCCESS"


        except Exception as exc:

            result["status"] = "FAILED"

            result["error"] = str(exc)


        finally:

            # =================================================
            # Close SSH connection
            # =================================================

            if client:

                client.close()


            # =================================================
            # Write YAML result
            # =================================================

            with open(
                OUTPUT_FILE,
                "w"
            ) as output_file:

                yaml.safe_dump(
                    result,
                    output_file,
                    sort_keys=False,
                    default_flow_style=False
                )


        PY

      args:
        executable: /bin/bash

      register: mstp_get

      delegate_to: localhost

      changed_when: false


    # ========================================================
    # 5. Display result
    # ========================================================

    - name: Display MSTP configuration
      ansible.builtin.debug:
        msg: "{{ lookup('file', output_dir + '/' + ansible_host + '_mstp.yml') }}"
      delegate_to: localhost
