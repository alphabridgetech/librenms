- name: Delete Voice VLAN MAC entry via SSH
  hosts: all
  gather_facts: no

  tasks:

    - name: Copy Voice VLAN delete Python script
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/voicevlan_delete_exec.py"
        mode: '0755'
        content: |
          import paramiko
          import time
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          MAC  = "{{ mac }}"
          MASK = "{{ mask }}"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False
              )

              shell = ssh.invoke_shell()
              time.sleep(1)

              shell.send("enable\n")
              time.sleep(1)
              shell.send(PASSWORD + "\n")
              time.sleep(1)

              shell.send("config\n")
              time.sleep(1)

              cmd = f"no voice-vlan mac-address {MAC} mask {MASK}"
              shell.send(cmd + "\n")
              time.sleep(1)
              print(f"EXECUTED: {cmd}")

              shell.send("exit\n")
              time.sleep(1)

              shell.send("write all\n")
              time.sleep(2)

              print("SUCCESS")

              ssh.close()

          except Exception as e:
              print("ERROR:", e)

    - name: Run Voice VLAN delete script
      ansible.builtin.command: >
        /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
        /opt/librenms/librenms-ansible-inventory-plugin/tmp/voicevlan_delete_exec.py
      register: output
      changed_when: true

    - name: Debug output
      ansible.builtin.debug:
        var: output.stdout
