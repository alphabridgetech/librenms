---
- name: Upload file to device via TFTP
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/tftpupload_exec.py"
    venv_python: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Create TFTP upload Python script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          TFTP_SERVER = "{{ tftp_server }}"
          FILENAME = "{{ filename }}"
          DESTINATION_PATH = "{{ destination_path }}"

          def read_all(shell, delay=1):
              time.sleep(delay)
              output = ""
              while shell.recv_ready():
                  output += shell.recv(65535).decode(errors="ignore")
              return output

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  port=22,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              read_all(shell, 2)

              shell.send("enable\n")
              read_all(shell, 1)
              shell.send(PASSWORD + "\n")
              read_all(shell, 2)

              # Correct device-specific TFTP command
              shell.send(f"copy tftp:{FILENAME} flash: {TFTP_SERVER}\n")
              output = read_all(shell, 3)

              if "Destination file name" in output:
                  shell.send(DESTINATION_PATH + "\n")
                  output += read_all(shell, 3)

              if "successfully receive" in output.lower():
                  print("SUCCESS")
              else:
                  print(output)

              ssh.close()

          except Exception as e:
              print("ERROR:", e)

    - name: Execute TFTP upload script
      ansible.builtin.command:
        cmd: "{{ venv_python }} {{ script_path }}"
      register: tftp_output
      changed_when: true

    - name: Show TFTP upload result
      ansible.builtin.debug:
        var: tftp_output.stdout
