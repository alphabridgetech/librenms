---
- name: Upload file to device via TFTP
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/tftpupload_exec.py"
    venv_python: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Create TFTP upload Python script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          TFTP_SERVER = "{{ tftp_server }}"
          SOURCE_FILE = "{{ filename }}"
          DEST_FILE = "{{ destination_file }}"

          def read(shell):
              out = ""
              while shell.recv_ready():
                  out += shell.recv(65535).decode(errors="ignore")
              return out

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(2)
              output = read(shell)

              # ENTER ENABLE MODE ONLY IF REQUIRED
              if output.strip().endswith(">"):
                  shell.send("enable\n")
                  time.sleep(1)
                  shell.send(PASSWORD + "\n")
                  time.sleep(2)
                  output += read(shell)

              if not output.strip().endswith("#"):
                  print("FAILED: not in enable mode")
                  print(output)
                  sys.exit(1)

              # COPY FROM TFTP TO FLASH
              shell.send(f"copy tftp:{SOURCE_FILE} flash: {TFTP_SERVER}\n")
              time.sleep(2)
              output = read(shell)

              if "Destination file name" in output:
                  shell.send(DEST_FILE + "\n")

              # READ FULL TRANSFER (long-running)
              end_time = time.time() + 180
              while time.time() < end_time:
                  time.sleep(1)
                  chunk = read(shell)
                  if chunk:
                      output += chunk

                  if "successfully receive" in output.lower():
                      print(output)
                      print("SUCCESS")
                      sys.exit(0)

                  if "error" in output.lower():
                      print(output)
                      sys.exit(1)

              print("FAILED: timeout waiting for TFTP upload")
              print(output)
              sys.exit(1)

          except Exception as e:
              print("ERROR:", e)
              sys.exit(1)

    - name: Execute TFTP upload script
      ansible.builtin.command:
        cmd: "{{ venv_python }} {{ script_path }}"
      register: tftp_output
      changed_when: true
      failed_when: tftp_output.rc != 0

    - name: Show TFTP upload result
      ansible.builtin.debug:
        var: tftp_output.stdout
