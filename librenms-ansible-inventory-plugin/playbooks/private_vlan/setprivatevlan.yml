# ============================================================================
# File        : setprivatevlan.yml
# Feature     : Private VLAN Configuration
# Device      : ABTPL AS210T Ethernet Switch
#
# Operations:
#   1. Add
#   2. Delete
#
# Output:
#   output/<switch-ip>_privatevlan.yml
#
# Output contains ONLY:
#   SUCCESS
#   or
#   FAILED
# ============================================================================

- name: Configure Private VLAN
  hosts: alphabridge_devices
  gather_facts: no

  tasks:

  # --------------------------------------------------------------------------
  # Validate Operation
  # --------------------------------------------------------------------------
  - name: Validate operation
    assert:
      that:
        - operation is defined
        - operation | lower in ['add', 'delete']
      fail_msg: "operation must be add or delete"

  # --------------------------------------------------------------------------
  # Validate VLAN ID
  # --------------------------------------------------------------------------
  - name: Validate VLAN ID
    assert:
      that:
        - vlan_id is defined
        - vlan_id | int >= 1
        - vlan_id | int <= 4094
      fail_msg: "VLAN ID must be between 1 and 4094"

  # --------------------------------------------------------------------------
  # Validate VLAN Type
  # --------------------------------------------------------------------------
  - name: Validate VLAN Type
    assert:
      that:
        - vlan_type is defined
        - vlan_type | lower in ['primary', 'community', 'isolated']
      fail_msg: "VLAN type must be primary, community or isolated"
    when: operation | lower == 'add'

  # --------------------------------------------------------------------------
  # Validate Port Mode
  # --------------------------------------------------------------------------
  - name: Validate Private VLAN Port Mode
    assert:
      that:
        - private_vlan_port_mode is defined
        - private_vlan_port_mode | lower in ['regular', 'host', 'promiscuous']
      fail_msg: "Port mode must be regular, host or promiscuous"
    when:
      - operation | lower == 'add'
      - port is defined
      - port | length > 0

  # --------------------------------------------------------------------------
  # Validate Primary VLAN
  # --------------------------------------------------------------------------
  - name: Validate Primary VLAN
    assert:
      that:
        - primary_vlan is defined
        - primary_vlan | int >= 1
        - primary_vlan | int <= 4094
      fail_msg: "Primary VLAN must be between 1 and 4094"
    when:
      - operation | lower == 'add'
      - private_vlan_port_mode | default('') | lower in ['host', 'promiscuous']

  # --------------------------------------------------------------------------
  # Validate Secondary VLAN
  # --------------------------------------------------------------------------
  - name: Validate Secondary VLAN
    assert:
      that:
        - secondary_vlan is defined
        - secondary_vlan | int >= 1
        - secondary_vlan | int <= 4094
      fail_msg: "Secondary VLAN must be between 1 and 4094"
    when:
      - operation | lower == 'add'
      - private_vlan_port_mode | default('') | lower in ['host', 'promiscuous']

  # --------------------------------------------------------------------------
  # Create Python Configuration Script
  # --------------------------------------------------------------------------
  - name: Create Private VLAN Python Script
    copy:
      dest: /opt/librenms/librenms-ansible-inventory-plugin/tmp/set_privatevlan.py
      mode: "0755"
      content: |
        #!/usr/bin/env python3

        import paramiko
        import time
        import re
        import sys

        HOST = "{{ ansible_host }}"
        USER = "{{ ansible_user }}"
        PASS = "{{ ansible_password }}"

        OP = "{{ operation | lower }}"
        VLAN = "{{ vlan_id }}"
        TYPE = "{{ vlan_type | default('primary') | lower }}"
        ASSOC = "{{ associated_primary_vlan | default('') }}"

        PORT = "{{ port | default('') }}"
        MODE = "{{ private_vlan_port_mode | default('') | lower }}"

        PORT_VLAN = "{{ port_vlan | default('') }}"
        PRIMARY = "{{ primary_vlan | default('') }}"
        SECONDARY = "{{ secondary_vlan | default('') }}"

        OUTTAG = "{{ outgoing_segment_tag | default('No') | lower }}"
        TAGPVID = "{{ tag_pvid | default('') }}"
        TAGPRI = "{{ tag_priority | default('') }}"


        def read_output(shell, timeout=8):
            output = ""
            end_time = time.time() + timeout

            while time.time() < end_time:

                if shell.recv_ready():

                    data = shell.recv(65535).decode(
                        errors="ignore"
                    )

                    output += data

                    if re.search(
                        r'Switch(?:_config(?:_vlan\d+|_g0/\d+)?)?[#>]\s*$',
                        output
                    ):
                        return output

                    end_time = time.time() + 1

                else:
                    time.sleep(0.1)

            return output


        def send_command(shell, command, wait=0.5):

            shell.send(command + "\n")

            time.sleep(wait)

            return read_output(shell)


        def command_failed(output):

            error_strings = [
                "fail with ret -1",
                "invalid input",
                "incomplete command",
                "unknown command",
                "error"
            ]

            output_lower = output.lower()

            return any(
                error in output_lower
                for error in error_strings
            )


        ssh = paramiko.SSHClient()

        ssh.set_missing_host_key_policy(
            paramiko.AutoAddPolicy()
        )

        success = True

        try:

            # ----------------------------------------------------------------
            # SSH Connection
            # ----------------------------------------------------------------
            ssh.connect(
                HOST,
                username=USER,
                password=PASS,
                look_for_keys=False,
                allow_agent=False,
                timeout=10
            )

            shell = ssh.invoke_shell()

            time.sleep(1)

            initial_output = read_output(shell)

            # ----------------------------------------------------------------
            # Enable Mode
            # ----------------------------------------------------------------
            if "Switch>" in initial_output:

                shell.send("enable\n")

                time.sleep(0.5)

                enable_output = read_output(shell)

                if "assword" in enable_output:

                    shell.send(PASS + "\n")

                    time.sleep(0.5)

                    read_output(shell)

            # ----------------------------------------------------------------
            # Configuration Mode
            # ----------------------------------------------------------------
            config_output = send_command(
                shell,
                "config"
            )

            if command_failed(config_output):
                success = False

            # =================================================================
            # ADD
            # =================================================================
            if OP == "add":

                # -------------------------------------------------------------
                # VLAN
                # -------------------------------------------------------------
                output = send_command(
                    shell,
                    f"vlan {VLAN}"
                )

                if command_failed(output):
                    success = False

                # -------------------------------------------------------------
                # VLAN TYPE
                # -------------------------------------------------------------
                if TYPE == "primary":

                    output = send_command(
                        shell,
                        "private-vlan primary"
                    )

                    if command_failed(output):
                        success = False

                elif TYPE == "community":

                    output = send_command(
                        shell,
                        f"private-vlan community {ASSOC}"
                    )

                    if command_failed(output):
                        success = False

                elif TYPE == "isolated":

                    output = send_command(
                        shell,
                        f"private-vlan isolated {ASSOC}"
                    )

                    if command_failed(output):
                        success = False

                # Leave VLAN configuration
                send_command(
                    shell,
                    "exit"
                )

                # -------------------------------------------------------------
                # INTERFACE CONFIGURATION
                # -------------------------------------------------------------
                if PORT:

                    output = send_command(
                        shell,
                        f"interface {PORT}"
                    )

                    if command_failed(output):
                        success = False

                    # ---------------------------------------------------------
                    # Clear previous Private VLAN configuration
                    # ---------------------------------------------------------
                    send_command(
                        shell,
                        "no switchport private-vlan host-association"
                    )

                    send_command(
                        shell,
                        "no switchport private-vlan mapping"
                    )

                    send_command(
                        shell,
                        "no switchport mode"
                    )

                    # ---------------------------------------------------------
                    # PVID
                    # ---------------------------------------------------------
                    if PORT_VLAN:

                        output = send_command(
                            shell,
                            f"switchport pvid {PORT_VLAN}"
                        )

                        if command_failed(output):
                            success = False

                    # ---------------------------------------------------------
                    # HOST MODE
                    # ---------------------------------------------------------
                    if MODE == "host":

                        output = send_command(
                            shell,
                            "switchport mode private-vlan host"
                        )

                        if command_failed(output):
                            success = False

                        output = send_command(
                            shell,
                            f"switchport private-vlan host-association {PRIMARY} {SECONDARY}"
                        )

                        if command_failed(output):
                            success = False

                    # ---------------------------------------------------------
                    # PROMISCUOUS MODE
                    # ---------------------------------------------------------
                    elif MODE == "promiscuous":

                        output = send_command(
                            shell,
                            "switchport mode private-vlan promiscuous"
                        )

                        if command_failed(output):
                            success = False

                        output = send_command(
                            shell,
                            f"switchport private-vlan mapping {PRIMARY} {SECONDARY}"
                        )

                        if command_failed(output):
                            success = False

                    # ---------------------------------------------------------
                    # OUTGOING SEGMENT TAG
                    # ---------------------------------------------------------
                    if OUTTAG == "yes":

                        output = send_command(
                            shell,
                            "no switchport private-vlan untagged"
                        )

                        if command_failed(output):
                            success = False

                    else:

                        output = send_command(
                            shell,
                            "switchport private-vlan untagged"
                        )

                        if command_failed(output):
                            success = False

                    # ---------------------------------------------------------
                    # TAG PVID
                    # ---------------------------------------------------------
                    if TAGPVID:

                        output = send_command(
                            shell,
                            f"switchport private-vlan tag-pvid {TAGPVID}"
                        )

                        if command_failed(output):
                            success = False

                    # ---------------------------------------------------------
                    # TAG PRIORITY
                    # ---------------------------------------------------------
                    if TAGPRI:

                        output = send_command(
                            shell,
                            f"switchport private-vlan tag-pri {TAGPRI}"
                        )

                        if command_failed(output):
                            success = False

                    # Leave interface configuration
                    send_command(
                        shell,
                        "exit"
                    )

            # =================================================================
            # DELETE
            # =================================================================
            elif OP == "delete":

                # -------------------------------------------------------------
                # Interface cleanup
                # -------------------------------------------------------------
                if PORT:

                    output = send_command(
                        shell,
                        f"interface {PORT}"
                    )

                    if command_failed(output):
                        success = False

                    send_command(
                        shell,
                        "no switchport private-vlan host-association"
                    )

                    send_command(
                        shell,
                        "no switchport private-vlan mapping"
                    )

                    send_command(
                        shell,
                        "no switchport private-vlan tag-pvid"
                    )

                    send_command(
                        shell,
                        "no switchport private-vlan tag-pri"
                    )

                    send_command(
                        shell,
                        "no switchport private-vlan untagged"
                    )

                    send_command(
                        shell,
                        "no switchport mode"
                    )

                    send_command(
                        shell,
                        "exit"
                    )

                # -------------------------------------------------------------
                # Delete VLAN
                # -------------------------------------------------------------
                output = send_command(
                    shell,
                    f"no vlan {VLAN}"
                )

                if command_failed(output):
                    success = False

            # ----------------------------------------------------------------
            # Leave configuration mode
            # ----------------------------------------------------------------
            send_command(
                shell,
                "exit"
            )

            ssh.close()

            # ----------------------------------------------------------------
            # Return only exit status
            # ----------------------------------------------------------------
            if success:

                sys.exit(0)

            else:

                sys.exit(1)

        except Exception:

            try:
                ssh.close()
            except Exception:
                pass

            sys.exit(1)


  # --------------------------------------------------------------------------
  # Run Python Script
  # --------------------------------------------------------------------------
  - name: Run Private VLAN Configuration
    command: >
      /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
      /opt/librenms/librenms-ansible-inventory-plugin/tmp/set_privatevlan.py
    register: pvlan
    changed_when: true
    failed_when: false


  # --------------------------------------------------------------------------
  # Save ONLY SUCCESS / FAILED
  # --------------------------------------------------------------------------
  - name: Save Private VLAN Status
    delegate_to: localhost
    copy:
      dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_privatevlan.yml"
      content: "{{ 'SUCCESS' if pvlan.rc == 0 else 'FAILED' }}\n"


  # --------------------------------------------------------------------------
  # Display ONLY SUCCESS / FAILED
  # --------------------------------------------------------------------------
  - name: Display Private VLAN Status
    debug:
      msg: "{{ 'SUCCESS' if pvlan.rc == 0 else 'FAILED' }}"


  # --------------------------------------------------------------------------
  # Fail Playbook if Configuration Failed
  # --------------------------------------------------------------------------
  - name: Fail if Private VLAN configuration failed
    fail:
      msg: "Private VLAN configuration FAILED."
    when: pvlan.rc != 0
