# ============================================================================
# File        : getprivatevlanport.yml
# Feature     : Private VLAN Port List
# Device      : ABTPL AS210T Ethernet Switch
#
# Purpose:
#   Get Private VLAN configuration for all physical switch interfaces.
#
# Interfaces:
#   GigaEthernet:
#       g0/1 - g0/8
#
#   TenGigabitEthernet:
#       tg0/1 - tg0/4
#
# Output:
#   /opt/librenms/librenms-ansible-inventory-plugin/output/<switch-ip>_privatevlanport.yml
#
# ============================================================================
# CLI COMMANDS USED
# ============================================================================
#
# From normal EXEC mode:
#
#   production> enable
#   production# config
#   production_config#
#
# For every interface:
#
#   production_config# show running-config interface GigaEthernet0/1
#
# or:
#
#   production_config# show running-config interface TenGigabitEthernet0/1
#
# ============================================================================
# EXPECTED GUI MAPPING
# ============================================================================
#
#   GigaEthernet0/1  -> g0/1
#   GigaEthernet0/2  -> g0/2
#   GigaEthernet0/3  -> g0/3
#   GigaEthernet0/4  -> g0/4
#   GigaEthernet0/5  -> g0/5
#   GigaEthernet0/6  -> g0/6
#   GigaEthernet0/7  -> g0/7
#   GigaEthernet0/8  -> g0/8
#
#   TenGigabitEthernet0/1 -> tg0/1
#   TenGigabitEthernet0/2 -> tg0/2
#   TenGigabitEthernet0/3 -> tg0/3
#   TenGigabitEthernet0/4 -> tg0/4
#
# ============================================================================

- name: Get Private VLAN Port List
  hosts: alphabridge_devices
  gather_facts: no

  tasks:

    # =========================================================================
    # Create Python GET script
    # =========================================================================

    - name: Create Private VLAN Port Get Script
      copy:
        dest: /opt/librenms/librenms-ansible-inventory-plugin/tmp/get_privatevlanport.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import sys


          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASS = "{{ ansible_password }}"


          # ==================================================================
          # REAL PHYSICAL INTERFACES OF THE SWITCH
          # ==================================================================
          #
          # Do NOT use g0/9, g0/10 etc.
          #
          # The switch has:
          #
          #   g0/1  - g0/8
          #   tg0/1 - tg0/4
          #
          # ==================================================================

          PORTS = [
              ("g0/1", "GigaEthernet0/1"),
              ("g0/2", "GigaEthernet0/2"),
              ("g0/3", "GigaEthernet0/3"),
              ("g0/4", "GigaEthernet0/4"),
              ("g0/5", "GigaEthernet0/5"),
              ("g0/6", "GigaEthernet0/6"),
              ("g0/7", "GigaEthernet0/7"),
              ("g0/8", "GigaEthernet0/8"),

              ("tg0/1", "TenGigabitEthernet0/1"),
              ("tg0/2", "TenGigabitEthernet0/2"),
              ("tg0/3", "TenGigabitEthernet0/3"),
              ("tg0/4", "TenGigabitEthernet0/4")
          ]


          # ==================================================================
          # READ SWITCH OUTPUT
          # ==================================================================

          def read_output(shell, timeout=5):

              output = ""

              end_time = time.time() + timeout

              while time.time() < end_time:

                  if shell.recv_ready():

                      data = shell.recv(65535).decode(
                          errors="ignore"
                      )

                      output += data

                      end_time = time.time() + 1

                  else:

                      time.sleep(0.1)

              return output


          # ==================================================================
          # SEND CLI COMMAND
          # ==================================================================

          def send_command(shell, command, wait=0.5):

              shell.send(command + "\n")

              time.sleep(wait)

              return read_output(shell)


          # ==================================================================
          # CLEAN CLI OUTPUT
          # ==================================================================

          def clean_output(output):

              output = output.replace("\r", "")

              lines = output.split("\n")

              cleaned = []

              for line in lines:

                  line = line.rstrip()

                  if not line.strip():
                      continue

                  cleaned.append(line)

              return cleaned


          # ==================================================================
          # GET VALUE USING REGEX
          # ==================================================================

          def get_value(lines, patterns):

              for line in lines:

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          line,
                          re.IGNORECASE
                      )

                      if match:

                          return match.group(1)

              return ""


          # ==================================================================
          # PARSE INTERFACE CONFIGURATION
          # ==================================================================

          def parse_interface(raw_output):

              lines = clean_output(raw_output)

              text = "\n".join(lines)

              # --------------------------------------------------------------
              # DEFAULT GUI VALUES
              # --------------------------------------------------------------

              vlan = "1"

              mode = "Regular Port"

              primary = ""

              secondary = ""

              outgoing_tag = "No"

              tag_pvid = "1"

              tag_priority = "0"


              # --------------------------------------------------------------
              # PVID / VLAN
              # --------------------------------------------------------------

              value = get_value(
                  lines,
                  [
                      r"switchport\s+pvid\s+(\d+)",
                      r"switchport\s+vlan\s+(\d+)",
                      r"pvid\s+(\d+)"
                  ]
              )

              if value:

                  vlan = value


              # --------------------------------------------------------------
              # PRIVATE VLAN HOST MODE
              # --------------------------------------------------------------

              if re.search(
                  r"switchport\s+mode\s+private-vlan\s+host\b",
                  text,
                  re.IGNORECASE
              ):

                  mode = "Host Port"


              # --------------------------------------------------------------
              # PRIVATE VLAN PROMISCUOUS MODE
              # --------------------------------------------------------------

              elif re.search(
                  r"switchport\s+mode\s+private-vlan\s+promiscuous\b",
                  text,
                  re.IGNORECASE
              ):

                  mode = "Promiscuous Port"


              # --------------------------------------------------------------
              # OTHERWISE REGULAR PORT
              # --------------------------------------------------------------

              else:

                  mode = "Regular Port"


              # --------------------------------------------------------------
              # HOST ASSOCIATION
              # --------------------------------------------------------------

              match = re.search(
                  r"switchport\s+private-vlan\s+host-association\s+(\d+)\s+(\d+)",
                  text,
                  re.IGNORECASE
              )

              if match:

                  primary = match.group(1)

                  secondary = match.group(2)


              # --------------------------------------------------------------
              # PROMISCUOUS MAPPING
              # --------------------------------------------------------------

              if not primary:

                  match = re.search(
                      r"switchport\s+private-vlan\s+mapping\s+(\d+)\s+(\d+)",
                      text,
                      re.IGNORECASE
                  )

                  if match:

                      primary = match.group(1)

                      secondary = match.group(2)


              # --------------------------------------------------------------
              # REGULAR PORT DOES NOT HAVE PVLAN IDs
              # --------------------------------------------------------------

              if mode == "Regular Port":

                  primary = ""

                  secondary = ""


              # --------------------------------------------------------------
              # OUTCOMING SEGMENT WITH TAG
              # --------------------------------------------------------------
              #
              # no switchport private-vlan untagged
              #       -> Yes
              #
              # switchport private-vlan untagged
              #       -> No
              #
              # --------------------------------------------------------------

              if re.search(
                  r"no\s+switchport\s+private-vlan\s+untagged",
                  text,
                  re.IGNORECASE
              ):

                  outgoing_tag = "Yes"

              elif re.search(
                  r"switchport\s+private-vlan\s+untagged",
                  text,
                  re.IGNORECASE
              ):

                  outgoing_tag = "No"


              # --------------------------------------------------------------
              # TAG PVID
              # --------------------------------------------------------------

              value = get_value(
                  lines,
                  [
                      r"switchport\s+private-vlan\s+tag-pvid\s+(\d+)"
                  ]
              )

              if value:

                  tag_pvid = value


              # --------------------------------------------------------------
              # TAG PRIORITY
              # --------------------------------------------------------------

              value = get_value(
                  lines,
                  [
                      r"switchport\s+private-vlan\s+tag-pri\s+(\d+)"
                  ]
              )

              if value:

                  tag_priority = value


              return (
                  vlan,
                  mode,
                  primary,
                  secondary,
                  outgoing_tag,
                  tag_pvid,
                  tag_priority
              )


          # ==================================================================
          # SSH CONNECTION
          # ==================================================================

          ssh = paramiko.SSHClient()

          ssh.set_missing_host_key_policy(
              paramiko.AutoAddPolicy()
          )


          try:

              # --------------------------------------------------------------
              # CONNECT TO SWITCH
              # --------------------------------------------------------------

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASS,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )


              shell = ssh.invoke_shell()

              time.sleep(1)

              initial_output = read_output(shell)


              # ==============================================================
              # DETERMINE CURRENT CLI MODE
              # ==============================================================

              # --------------------------------------------------------------
              # production>
              #       -> EXEC MODE
              # --------------------------------------------------------------

              if re.search(
                  r'production>\s*$',
                  initial_output.strip()
              ):

                  output = send_command(
                      shell,
                      "enable"
                  )


              # --------------------------------------------------------------
              # production#
              #       -> PRIVILEGED MODE
              # --------------------------------------------------------------

              elif re.search(
                  r'production#\s*$',
                  initial_output.strip()
              ):

                  pass


              # --------------------------------------------------------------
              # production_config#
              #       -> CONFIG MODE
              # --------------------------------------------------------------

              elif re.search(
                  r'production_config(?:_[A-Za-z0-9/.-]+)?#\s*$',
                  initial_output.strip()
              ):

                  pass


              # --------------------------------------------------------------
              # UNKNOWN PROMPT
              # --------------------------------------------------------------

              else:

                  # Try enable anyway.
                  send_command(
                      shell,
                      "enable"
                  )


              # ==============================================================
              # ENTER CONFIG MODE
              # ==============================================================

              current_output = read_output(shell)

              if re.search(
                  r'production_config(?:_[A-Za-z0-9/.-]+)?#\s*$',
                  current_output.strip()
              ):

                  pass

              elif re.search(
                  r'production#\s*$',
                  current_output.strip()
              ):

                  send_command(
                      shell,
                      "config"
                  )

              elif re.search(
                  r'production>\s*$',
                  current_output.strip()
              ):

                  send_command(
                      shell,
                      "enable"
                  )

                  send_command(
                      shell,
                      "config"
                  )


              # ==============================================================
              # COLLECT EVERY REAL PHYSICAL PORT
              # ==============================================================

              rows = []


              for display_port, cli_port in PORTS:

                  # ----------------------------------------------------------
                  # Query actual interface
                  # ----------------------------------------------------------

                  output = send_command(
                      shell,
                      f"show running-config interface {cli_port}"
                  )


                  # ----------------------------------------------------------
                  # Parse actual configuration
                  # ----------------------------------------------------------

                  (
                      vlan,
                      mode,
                      primary,
                      secondary,
                      outgoing_tag,
                      tag_pvid,
                      tag_priority
                  ) = parse_interface(output)


                  # ----------------------------------------------------------
                  # Store actual display name
                  # ----------------------------------------------------------

                  rows.append(
                      (
                          display_port,
                          vlan,
                          mode,
                          primary,
                          secondary,
                          outgoing_tag,
                          tag_pvid,
                          tag_priority
                      )
                  )


              # ==============================================================
              # CLOSE SSH
              # ==============================================================

              ssh.close()


              # ==============================================================
              # PRINT YAML
              # ==============================================================

              print("ip: " + HOST)

              print("")

              print("private_vlan_port:")


              for row in rows:

                  port = row[0]

                  vlan = row[1]

                  mode = row[2]

                  primary = row[3]

                  secondary = row[4]

                  outgoing_tag = row[5]

                  tag_pvid = row[6]

                  tag_priority = row[7]


                  print(
                      "    - port: " + port
                  )


                  print(
                      "      vlan: " + vlan
                  )


                  print(
                      "      private_vlan_port_mode: " + mode
                  )


                  print(
                      '      primary_vlan: "' +
                      primary +
                      '"'
                  )


                  print(
                      '      secondary_vlan: "' +
                      secondary +
                      '"'
                  )


                  print(
                      "      outcoming_segment_with_tag: " +
                      outgoing_tag
                  )


                  print(
                      "      tag_pvid: " +
                      tag_pvid
                  )


                  print(
                      "      tag_priority: " +
                      tag_priority
                  )


              sys.exit(0)


          except Exception as e:

              print(
                  "ERROR: " + str(e)
              )

              try:

                  ssh.close()

              except Exception:

                  pass

              sys.exit(1)


    # =========================================================================
    # Run GET Script
    # =========================================================================

    - name: Get Private VLAN Port Information
      command: >
        /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
        /opt/librenms/librenms-ansible-inventory-plugin/tmp/get_privatevlanport.py
      register: private_vlan_port
      changed_when: false
      failed_when: false


    # =========================================================================
    # Save Clean YAML Output
    # =========================================================================

    - name: Save Private VLAN Port List
      delegate_to: localhost
      copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_privatevlanport.yml"
        content: "{{ private_vlan_port.stdout | trim }}\n"


    # =========================================================================
    # Display YAML Output
    # =========================================================================

    - name: Display Private VLAN Port List
      debug:
        msg: "{{ private_vlan_port.stdout | trim }}"


    # =========================================================================
    # Fail if GET operation failed
    # =========================================================================

    - name: Fail if Private VLAN Port GET failed
      fail:
        msg: "Failed to get Private VLAN Port information."
      when: private_vlan_port.rc != 0
