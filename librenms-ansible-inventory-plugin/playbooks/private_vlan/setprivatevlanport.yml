---
# =============================================================================
# Private VLAN Port Configuration
# =============================================================================
#
# Purpose:
#   Configure Private VLAN settings on a switch interface and save the result.
#
# Supported Modes:
#   regular, host, promiscuous
#
# =============================================================================

- name: Private VLAN Port Configuration
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    output_file: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_privatevlanport.yml"
    script_file: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/set_privatevlanport.py"
    python_interpreter: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python"

  tasks:

    # -------------------------------------------------------------------------
    # Validate mandatory parameters
    # -------------------------------------------------------------------------

    - name: Validate port
      ansible.builtin.assert:
        that:
          - port is defined
          - port | length > 0
        fail_msg: "port is required"

    - name: Validate VLAN
      ansible.builtin.assert:
        that:
          - port_vlan is defined
          - port_vlan | int >= 1
          - port_vlan | int <= 4094
        fail_msg: "port_vlan must be between 1 and 4094"

    - name: Validate Private VLAN port mode
      ansible.builtin.assert:
        that:
          - private_vlan_port_mode is defined
          - private_vlan_port_mode | lower in ['regular', 'host', 'promiscuous']
        fail_msg: "private_vlan_port_mode must be regular, host or promiscuous"

    - name: Validate Primary and Secondary VLAN for PVLAN modes
      ansible.builtin.assert:
        that:
          - primary_vlan is defined
          - secondary_vlan is defined
          - primary_vlan | int >= 1
          - primary_vlan | int <= 4094
          - secondary_vlan | int >= 1
          - secondary_vlan | int <= 4094
        fail_msg: "primary_vlan and secondary_vlan are required for host/promiscuous mode"
      when: private_vlan_port_mode | lower in ['host', 'promiscuous']

    # -------------------------------------------------------------------------
    # Verify Python interpreter and Paramiko
    # -------------------------------------------------------------------------

    - name: Check Python interpreter and Paramiko
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter }}"
          - -c
          - "import paramiko; print(paramiko.__version__)"
      register: paramiko_check
      changed_when: false
      failed_when: false

    - name: Fail when Python or Paramiko is unavailable
      ansible.builtin.fail:
        msg: >-
          Python interpreter or Paramiko is unavailable.
          Interpreter: {{ python_interpreter }}.
          Error: {{ paramiko_check.stderr | default('') }}.
          Verify the virtual environment and install Paramiko in it.
      when: paramiko_check.rc != 0

    # -------------------------------------------------------------------------
    # Create Paramiko configuration script
    # -------------------------------------------------------------------------

    - name: Create Private VLAN configuration script
      ansible.builtin.copy:
        dest: "{{ script_file }}"
        mode: '0755'
        content: |
          import paramiko
          import sys
          import time
          import re

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          PORT = "{{ port }}"
          VLAN = "{{ port_vlan }}"
          MODE = "{{ private_vlan_port_mode | lower }}"

          PRIMARY = "{{ primary_vlan | default('') }}"
          SECONDARY = "{{ secondary_vlan | default('') }}"

          OUTGOING_TAG = "{{ outgoing_segment_tag | default('No') }}"
          TAG_PVID = "{{ tag_pvid | default('') }}"
          TAG_PRIORITY = "{{ tag_priority | default('') }}"

          def read_output(shell, timeout=8):
              output = ""
              end_time = time.time() + timeout

              while time.time() < end_time:
                  if shell.recv_ready():
                      data = shell.recv(65535).decode(errors="ignore")
                      output += data
                      end_time = time.time() + 1
                  else:
                      time.sleep(0.1)

              return output

          last_command = ""
          last_output = ""

          def send_command(shell, command, timeout=5):
              global last_command, last_output
              last_command = command
              shell.send(command + "\n")
              time.sleep(0.5)
              last_output = read_output(shell, timeout)
              return last_output

          def command_failed(output):
              text = output.lower()

              error_strings = [
                  "unknown command",
                  "invalid command",
                  "%error",
                  "error:",
                  "invalid input",
                  "incomplete command"
              ]

              return any(error in text for error in error_strings)

          def get_prompt(output):
              clean = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', output)
              match = re.search(r'(?:^|[\r\n])([^\s#>]+[>#])\s*$', clean)
              return match.group(1) if match else ""

          def is_config_prompt(output):
              prompt = get_prompt(output)
              return prompt.endswith("#") and bool(re.search(
                  r'(?:_config(?:_[A-Za-z0-9/.-]+)?|\(config[^)]*\))#$',
                  prompt
              ))

          def is_privileged_prompt(output):
              return get_prompt(output).endswith("#") and not is_config_prompt(output)

          def is_exec_prompt(output):
              return get_prompt(output).endswith(">")

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          shell = None
          success = True
          failure_reason = ""

          try:
              client.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = client.invoke_shell()
              time.sleep(1)

              initial_output = read_output(shell)

              # ================================================================
              # ENTER CORRECT CONFIGURATION MODE
              # ================================================================

              last_output = initial_output
              current_output = initial_output

              if is_exec_prompt(current_output):
                  current_output = send_command(shell, "enable")
                  if re.search(r'password\s*:\s*$', current_output, re.IGNORECASE):
                      shell.send(PASSWORD + "\n")
                      time.sleep(0.5)
                      current_output = read_output(shell)
                      last_output = current_output

                  if command_failed(current_output) or not is_privileged_prompt(current_output):
                      success = False
                      failure_reason = "Failed to enter enable mode."

              if success and is_privileged_prompt(current_output):
                  current_output = send_command(shell, "config")
                  if command_failed(current_output) or not is_config_prompt(current_output):
                      success = False
                      failure_reason = "Failed to enter configuration mode."

              if success and not is_config_prompt(current_output):
                  success = False
                  failure_reason = "Unable to determine switch CLI configuration mode."

              # ================================================================
              # ENTER INTERFACE CONFIGURATION
              # ================================================================

              if success:
                  output = send_command(shell, "interface " + PORT)

                  if command_failed(output):
                      success = False
                      failure_reason = "Failed to enter interface configuration."

              # ================================================================
              # REGULAR MODE
              # ================================================================

              if success and MODE == "regular":

                  for command in [
                      "no switchport private-vlan host-association",
                      "no switchport private-vlan mapping",
                      "no switchport private-vlan tag-pvid",
                      "no switchport private-vlan tag-pri",
                      "no switchport private-vlan untagged"
                  ]:
                      output = send_command(shell, command)
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed command: " + command
                          break

                  if success:
                      output = send_command(shell, "switchport pvid " + VLAN)
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed to configure regular VLAN/PVID."

              # ================================================================
              # HOST MODE
              # ================================================================

              if success and MODE == "host":

                  output = send_command(shell, "no switchport private-vlan mapping")
                  if command_failed(output):
                      success = False
                      failure_reason = "Failed to remove previous promiscuous mapping."

                  if success:
                      output = send_command(shell, "switchport mode private-vlan host")
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed to configure Private VLAN host mode."

                  if success:
                      output = send_command(
                          shell,
                          "switchport private-vlan host-association " + PRIMARY + " " + SECONDARY
                      )
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed to configure host association."

                  if success:
                      output = send_command(shell, "switchport pvid " + VLAN)
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed to configure PVID."

              # ================================================================
              # PROMISCUOUS MODE
              # ================================================================

              if success and MODE == "promiscuous":

                  output = send_command(shell, "no switchport private-vlan host-association")
                  if command_failed(output):
                      success = False
                      failure_reason = "Failed to remove previous host association."

                  if success:
                      output = send_command(shell, "switchport mode private-vlan promiscuous")
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed to configure Private VLAN promiscuous mode."

                  if success:
                      output = send_command(
                          shell,
                          "switchport private-vlan mapping " + PRIMARY + " " + SECONDARY
                      )
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed to configure Private VLAN mapping."

                  if success:
                      output = send_command(shell, "switchport pvid " + VLAN)
                      if command_failed(output):
                          success = False
                          failure_reason = "Failed to configure PVID."

              # ================================================================
              # OUTGOING SEGMENT TAG
              # ================================================================

              if success:
                  if OUTGOING_TAG.lower() == "yes":
                      command = "no switchport private-vlan untagged"
                  else:
                      command = "switchport private-vlan untagged"

                  output = send_command(shell, command)
                  if command_failed(output):
                      success = False
                      failure_reason = "Failed to configure outgoing segment tag."

              # ================================================================
              # TAG PVID
              # ================================================================

              if success and TAG_PVID != "":
                  output = send_command(shell, "switchport private-vlan tag-pvid " + TAG_PVID)
                  if command_failed(output):
                      success = False
                      failure_reason = "Failed to configure tag PVID."

              # ================================================================
              # TAG PRIORITY
              # ================================================================

              if success and TAG_PRIORITY != "":
                  output = send_command(shell, "switchport private-vlan tag-pri " + TAG_PRIORITY)
                  if command_failed(output):
                      success = False
                      failure_reason = "Failed to configure tag priority."

              # ================================================================
              # EXIT CONFIGURATION
              # ================================================================

              failed_command = last_command
              failed_output = last_output

              if shell:
                  send_command(shell, "exit")
                  send_command(shell, "exit")

              if success:
                  print("SUCCESS")
                  sys.exit(0)
              else:
                  print("FAILED")
                  print(failure_reason)
                  print("Command: " + (failed_command or "SSH login"))
                  print("Switch response:\n" + failed_output)
                  sys.exit(1)

          except Exception as exc:
              print("FAILED")
              print("Error: " + str(exc))
              sys.exit(1)

          finally:
              if client:
                  client.close()

    # -------------------------------------------------------------------------
    # Execute configuration script
    # -------------------------------------------------------------------------

    - name: Execute Private VLAN Port configuration
      ansible.builtin.command:
        argv:
          - "{{ python_interpreter }}"
          - "{{ script_file }}"
      register: pvlan_result
      changed_when: false
      failed_when: false

    # -------------------------------------------------------------------------
    # Save only SUCCESS / FAILED
    # -------------------------------------------------------------------------

    - name: Save Private VLAN Port result
      ansible.builtin.copy:
        content: "{{ 'SUCCESS' if pvlan_result.rc == 0 and 'SUCCESS' in (pvlan_result.stdout | default('')) else 'FAILED' }}\n"
        dest: "{{ output_file }}"
        mode: '0644'

    # -------------------------------------------------------------------------
    # Display result
    # -------------------------------------------------------------------------

    - name: Display Private VLAN Port result
      ansible.builtin.debug:
        msg:
          - "Private VLAN Port Mode: {{ private_vlan_port_mode }}"
          - "Port: {{ port }}"
          - "VLAN: {{ port_vlan }}"
          - "Result: {{ 'SUCCESS' if pvlan_result.rc == 0 and 'SUCCESS' in (pvlan_result.stdout | default('')) else 'FAILED' }}"
          - "Return code: {{ pvlan_result.rc }}"
          - "STDOUT: {{ pvlan_result.stdout | default('') }}"
          - "STDERR: {{ pvlan_result.stderr | default('') }}"

    # -------------------------------------------------------------------------
    # Fail the Ansible play if configuration failed
    # -------------------------------------------------------------------------

    - name: Mark playbook as failed when configuration fails
      ansible.builtin.fail:
        msg: >-
          Private VLAN Port configuration failed (exit code {{ pvlan_result.rc }}).
          STDOUT: {{ pvlan_result.stdout | default('', true) | trim }}
          STDERR: {{ pvlan_result.stderr | default('', true) | trim }}
      when: pvlan_result.rc != 0 or 'SUCCESS' not in (pvlan_result.stdout | default(''))
