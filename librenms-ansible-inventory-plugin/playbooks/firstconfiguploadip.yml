---
- name: Run Dynamic Config on AlphaBridge via Telnet (FAST)
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/telnet_config.py"
    output_file: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/telnet_output.txt"

  tasks:

    - name: Ensure tmp directory exists
      file:
        path: /opt/librenms/librenms-ansible-inventory-plugin/tmp
        state: directory
        mode: '0755'
      delegate_to: localhost

    - name: Create Fast Telnet config script
      copy:
        dest: "{{ script_path }}"
        mode: '0755'
        content: |
          import telnetlib
          import time
          import json

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          raw_commands = json.loads({{ cli_commands | to_json }})
          COMMANDS = raw_commands if isinstance(raw_commands, list) else raw_commands.split("\n")

          OUTPUT_FILE = "{{ output_file }}"

          def send_cmd(tn, cmd, waitfor=b"#", timeout=5):
              tn.write(cmd.encode('ascii') + b"\n")
              return tn.read_until(waitfor, timeout).decode(errors="ignore")

          try:
              tn = telnetlib.Telnet(HOST, timeout=10)

              tn.read_until(b"Username:")
              tn.write(USER.encode('ascii') + b"\n")

              tn.read_until(b"Password:")
              tn.write(PASSWORD.encode('ascii') + b"\n")

              output = tn.read_until(b">", 5).decode(errors="ignore")

              # ENABLE MODE
              output += send_cmd(tn, "enable")

              # CONFIG MODE
              output += send_cmd(tn, "config")

              # RUN COMMANDS (FAST LOOP)
              for cmd in COMMANDS:
                  if cmd.strip():
                      output += send_cmd(tn, cmd.strip())

              # SAVE CONFIG
              output += send_cmd(tn, "end")
              output += send_cmd(tn, "write all", timeout=10)

              tn.write(b"exit\n")
              tn.close()

              with open(OUTPUT_FILE, "w") as f:
                  f.write(output)

          except Exception as e:
              with open(OUTPUT_FILE, "w") as f:
                  f.write("ERROR: " + str(e))

      delegate_to: localhost

    - name: Execute Telnet script
      command: python3 {{ script_path }}
      register: result
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Fetch output file
      fetch:
        src: "{{ output_file }}"
        dest: "./telnet_output_{{ inventory_hostname }}.txt"
        flat: yes
      delegate_to: localhost

    - name: Show execution result
      debug:
        var: result.stdout
      delegate_to: localhost

    - name: Execute Telnet script
      command: python3 {{ script_path }}
      register: result
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Fetch output file
      fetch:
        src: "{{ output_file }}"
        dest: "./telnet_output_{{ inventory_hostname }}.txt"
        flat: yes
      delegate_to: localhost

    - name: Show execution result
      debug:
        var: result.stdout
      delegate_to: localhost