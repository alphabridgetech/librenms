---
# ============================================================================
# File        : getvlaninterfaceip.yml
# Feature     : Get VLAN Interface IP Attribute
#
# Reads:
#   - VLAN ID
#   - IP Attribute
#   - IP Address
#   - Operate
#
# Source:
#   show ip interface brief
#
# Output:
#   /home/gayatri/ansible/output/<IP>_vlan_interface_ip_attribute.yml
# ============================================================================

- name: Get VLAN Interface IP Attribute
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:

    # ------------------------------------------------------------------------
    # Create directories
    # ------------------------------------------------------------------------
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ output_dir }}"
        - "{{ tmp_dir }}"
      delegate_to: localhost

    # ------------------------------------------------------------------------
    # Create Paramiko GET script
    # ------------------------------------------------------------------------
    - name: Create VLAN Interface GET script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/getvlaninterfaceip.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import sys
          import yaml

          host = "{{ ansible_host }}"
          username = "{{ ansible_user }}"
          password = "{{ ansible_password }}"

          output_file = (
              "{{ output_dir }}/"
              "{{ ansible_host }}_vlan_interface_ip_attribute.yml"
          )

          try:

              # -----------------------------------------------------------
              # SSH connection
              # -----------------------------------------------------------
              client = paramiko.SSHClient()

              client.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              client.connect(
                  hostname=host,
                  username=username,
                  password=password,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=15
              )

              shell = client.invoke_shell()

              time.sleep(1)

              # -----------------------------------------------------------
              # Enable mode
              # -----------------------------------------------------------
              shell.send("enable\n")
              time.sleep(0.5)

              # -----------------------------------------------------------
              # Enter configuration mode
              # -----------------------------------------------------------
              shell.send("config\n")
              time.sleep(0.5)

              # -----------------------------------------------------------
              # Disable paging
              # -----------------------------------------------------------
              shell.send("terminal length 0\n")
              time.sleep(0.5)

              # -----------------------------------------------------------
              # Get VLAN interface information
              # -----------------------------------------------------------
              shell.send("show ip interface brief\n")

              time.sleep(3)

              # -----------------------------------------------------------
              # Read complete output
              # -----------------------------------------------------------
              output = ""

              end_time = time.time() + 10

              while time.time() < end_time:

                  if shell.recv_ready():

                      data = shell.recv(65535).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      output += data

                      # Command completed when config prompt returns
                      if "Switch_config#" in output:
                          break

                  else:
                      time.sleep(0.2)

              client.close()

              # -----------------------------------------------------------
              # Remove CR characters
              # -----------------------------------------------------------
              output = output.replace("\r", "")

              # -----------------------------------------------------------
              # Parse VLAN interfaces
              # -----------------------------------------------------------
              vlan_interfaces = []

              for line in output.splitlines():

                  line = line.strip()

                  match = re.match(
                      r"^VLAN(\d+)\s+(\S+)\s+(\S+)\s+(\S+)\s*$",
                      line,
                      re.IGNORECASE
                  )

                  if not match:
                      continue

                  vlan_id = int(match.group(1))
                  ip_address = match.group(2)
                  method = match.group(3).lower()
                  protocol_status = match.group(4)

                  # -------------------------------------------------------
                  # Convert CLI method to GUI IP Attribute
                  # -------------------------------------------------------
                  if method == "manual":

                      ip_attribute = "Manual configuration"

                  elif method == "dhcp":

                      ip_attribute = "DHCP Auto configuration"

                  else:

                      ip_attribute = method

                  # -------------------------------------------------------
                  # Unassigned IP
                  # -------------------------------------------------------
                  if ip_address.lower() == "unassigned":

                      ip_address = ""

                  vlan_interfaces.append(
                      {
                          "vlan_id": vlan_id,
                          "ip_attribute": ip_attribute,
                          "ip_address": ip_address,
                          "operate": protocol_status
                      }
                  )

              # -----------------------------------------------------------
              # Sort VLANs by VLAN ID
              # -----------------------------------------------------------
              vlan_interfaces.sort(
                  key=lambda item: item["vlan_id"]
              )

              # -----------------------------------------------------------
              # Create YAML result
              # -----------------------------------------------------------
              result = {
                  "status": "SUCCESS",
                  "device_ip": host,
                  "vlan_interface_ip_attribute": vlan_interfaces
              }

              # -----------------------------------------------------------
              # Write YAML output
              # -----------------------------------------------------------
              with open(output_file, "w") as f:

                  yaml.dump(
                      result,
                      f,
                      default_flow_style=False,
                      sort_keys=False
                  )

              print("GET SUCCESS")

          except Exception as e:

              print("ERROR:", str(e))

              with open(output_file, "w") as f:

                  f.write(
                      "status: ERROR\n"
                      "device_ip: " + host + "\n"
                      "vlan_interface_ip_attribute: []\n"
                  )

              sys.exit(1)

    # ------------------------------------------------------------------------
    # Execute GET script
    # ------------------------------------------------------------------------
    - name: Get VLAN Interface IP configuration
      ansible.builtin.command:
        cmd: "python3 {{ tmp_dir }}/getvlaninterfaceip.py"
      delegate_to: localhost
      register: vlan_get_result
      changed_when: false

    # ------------------------------------------------------------------------
    # Display output
    # ------------------------------------------------------------------------
    - name: Show VLAN Interface IP configuration
      ansible.builtin.debug:
        msg: "{{ lookup('file', output_dir + '/' + ansible_host + '_vlan_interface_ip_attribute.yml') }}"
