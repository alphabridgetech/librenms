# ============================================
# File : seterps.yml
# Feature : ERPS SET Configuration
# add
# ansible-playbook -i inventory/192.168.2.245.yml playbooks/ring_protection/seterps.yml -e "operation=add ring_id=23 control_vlan=58 wtr_time=12 guard_time=500 send_time=5 port1=GigaEthernet0/7 port1_role=ring-port port2=GigaEthernet0/4 port2_role=rpl"
#edit
# ansible-playbook -i inventory/192.168.2.245.yml playbooks/ring_protection/seterps.yml -e "operation=edit ring_id=23 control_vlan=58 wtr_time=40 guard_time=500 send_time=5 port1=GigaEthernet0/7 port1_role=ring-port port2=GigaEthernet0/4 port2_role=rpl"
# delete
# ansible-playbook -i inventory/192.168.2.245.yml playbooks/ring_protection/seterps.yml -e "operation=delete ring_id=23"
# ============================================

- name: ERPS SET Configuration
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    script_dir: "/opt/librenms/librenms-ansible-inventory-plugin/tmp"
    script_file: "{{ script_dir }}/set_erps.py"

    erps_operation: "{{ operation | default('add') }}"
    erps_ring_id: "{{ ring_id | default(1) }}"
    erps_control_vlan: "{{ control_vlan | default(1) }}"
    erps_wtr_time: "{{ wtr_time | default(20) }}"
    erps_guard_time: "{{ guard_time | default(500) }}"
    erps_send_time: "{{ send_time | default(5) }}"

    erps_port1: "{{ port1 | default('') }}"
    erps_port1_role: "{{ port1_role | default('ring-port') }}"
    erps_port2: "{{ port2 | default('') }}"
    erps_port2_role: "{{ port2_role | default('rpl') }}"

  tasks:

    # ============================================================
    # VALIDATION
    # ============================================================

    - name: Validate ERPS operation
      ansible.builtin.assert:
        that:
          - erps_operation in ['add', 'edit', 'delete']
        fail_msg: "operation must be add, edit or delete"

    - name: Validate ERPS Ring ID
      ansible.builtin.assert:
        that:
          - erps_ring_id | int >= 1
          - erps_ring_id | int <= 239
        fail_msg: "ring_id must be between 1 and 239"

    - name: Validate Control VLAN
      ansible.builtin.assert:
        that:
          - erps_control_vlan | int >= 1
          - erps_control_vlan | int <= 4094
        fail_msg: "control_vlan must be between 1 and 4094"
      when: erps_operation in ['add', 'edit']

    - name: Validate WTR time
      ansible.builtin.assert:
        that:
          - erps_wtr_time | int >= 0
          - erps_wtr_time | int <= 720
        fail_msg: "wtr_time must be between 0 and 720"
      when: erps_operation in ['add', 'edit']

    - name: Validate Guard time
      ansible.builtin.assert:
        that:
          - erps_guard_time | int >= 0
          - erps_guard_time | int <= 2000
          - (erps_guard_time | int) % 10 == 0
        fail_msg: "guard_time must be between 0 and 2000 and must be a multiple of 10"
      when: erps_operation in ['add', 'edit']

    - name: Validate Send time
      ansible.builtin.assert:
        that:
          - erps_send_time | int >= 1
          - erps_send_time | int <= 10
        fail_msg: "send_time must be between 1 and 10"
      when: erps_operation in ['add', 'edit']

    - name: Validate ERPS ports for ADD
      ansible.builtin.assert:
        that:
          - erps_port1 | length > 0
          - erps_port2 | length > 0
          - erps_port1 != erps_port2
          - erps_port1_role in ['ring-port', 'rpl']
          - erps_port2_role in ['ring-port', 'rpl']
          - >
            (erps_port1_role == 'ring-port' and erps_port2_role == 'rpl')
            or
            (erps_port1_role == 'rpl' and erps_port2_role == 'ring-port')
        fail_msg: "ADD requires two different ports: one ring-port and one rpl"
      when: erps_operation == 'add'

    # ============================================================
    # CREATE TEMP DIRECTORY
    # ============================================================

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ script_dir }}"
        state: directory
        mode: '0755'

    # ============================================================
    # PREPARE PYTHON SCRIPT
    # ============================================================

    - name: Prepare ERPS SET script
      ansible.builtin.copy:
        dest: "{{ script_file }}"
        mode: '0755'
        content: |
          import paramiko
          import time
          import re
          import json
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          OPERATION = "{{ erps_operation }}"
          RING_ID = "{{ erps_ring_id }}"
          CONTROL_VLAN = "{{ erps_control_vlan }}"
          WTR_TIME = "{{ erps_wtr_time }}"
          GUARD_TIME = "{{ erps_guard_time }}"
          SEND_TIME = "{{ erps_send_time }}"

          PORT1 = "{{ erps_port1 }}"
          PORT1_ROLE = "{{ erps_port1_role }}"

          PORT2 = "{{ erps_port2 }}"
          PORT2_ROLE = "{{ erps_port2_role }}"

          ANSI_RE = re.compile(
              r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])'
          )

          def clean(text):
              text = ANSI_RE.sub('', text)
              text = text.replace('\r', '')
              return text

          def read_until_prompt(shell, prompt_regex, timeout=10):
              buf = ""
              end_time = time.time() + timeout

              while time.time() < end_time:

                  if shell.recv_ready():

                      data = shell.recv(65535).decode(errors='ignore')
                      buf += data

                      cleaned = clean(buf)

                      if re.search(prompt_regex, cleaned):
                          return cleaned

                      end_time = time.time() + 0.5

                  else:
                      time.sleep(0.1)

              return clean(buf)

          def send_command(shell, command, prompt_regex, timeout=10):
              shell.send(command + "\n")
              return read_until_prompt(shell, prompt_regex, timeout)

          def check_error(output, command):
              output = clean(output)

              if re.search(
                  r'%Error|Invalid input|Invalid command|failed|error:',
                  output,
                  re.IGNORECASE
              ):
                  raise Exception(
                      f"Command failed: {command}\n{output.strip()}"
                  )

              return output

          ssh = None

          try:

              # ====================================================
              # SSH CONNECTION
              # ====================================================

              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()

              time.sleep(0.5)

              read_until_prompt(
                  shell,
                  r'[#>]\s*$',
                  timeout=5
              )

              send_command(
                  shell,
                  "enable",
                  r'[#>]\s*$',
                  timeout=5
              )

              send_command(
                  shell,
                  "terminal length 0",
                  r'[#>]\s*$',
                  timeout=3
              )

              send_command(
                  shell,
                  "no page",
                  r'[#>]\s*$',
                  timeout=3
              )

              # ====================================================
              # CONFIG MODE
              # ====================================================

              config_output = send_command(
                  shell,
                  "config",
                  r'config[^#]*#\s*$',
                  timeout=5
              )

              config_prompt = r'config[^#]*#\s*$'

              if not re.search(
                  config_prompt,
                  clean(config_output)
              ):
                  raise Exception(
                      "Unable to enter configuration mode"
                  )

              # ====================================================
              # DELETE
              # ====================================================

              if OPERATION == "delete":

                  output = send_command(
                      shell,
                      f"no erps {RING_ID}",
                      config_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"no erps {RING_ID}"
                  )

                  result = {
                      "status": "SUCCESS"
                  }

              # ====================================================
              # ADD
              #
              # ADD creates the ERPS ring and configures:
              #   - control VLAN
              #   - WTR
              #   - guard
              #   - send
              #   - port 1
              #   - port 2
              # ====================================================

              elif OPERATION == "add":

                  ring_output = send_command(
                      shell,
                      f"erps {RING_ID}",
                      r'config[^#]*ring[^#]*#\s*$',
                      timeout=10
                  )

                  ring_prompt = (
                      r'config[^#]*ring[^#]*#\s*$'
                  )

                  if not re.search(
                      ring_prompt,
                      clean(ring_output),
                      re.IGNORECASE
                  ):
                      raise Exception(
                          f"Unable to enter ERPS Ring {RING_ID} configuration"
                      )

                  # Control VLAN
                  output = send_command(
                      shell,
                      f"control-vlan {CONTROL_VLAN}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"control-vlan {CONTROL_VLAN}"
                  )

                  # WTR
                  output = send_command(
                      shell,
                      f"wtr-time {WTR_TIME}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"wtr-time {WTR_TIME}"
                  )

                  # Guard
                  output = send_command(
                      shell,
                      f"guard-time {GUARD_TIME}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"guard-time {GUARD_TIME}"
                  )

                  # Send
                  output = send_command(
                      shell,
                      f"send-time {SEND_TIME}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"send-time {SEND_TIME}"
                  )

                  send_command(
                      shell,
                      "exit",
                      config_prompt,
                      timeout=5
                  )

                  # ------------------------------------------------
                  # PORT 1
                  # ------------------------------------------------

                  output = send_command(
                      shell,
                      f"interface {PORT1}",
                      r'config[^#]*[#>]\s*$',
                      timeout=5
                  )

                  check_error(
                      output,
                      f"interface {PORT1}"
                  )

                  output = send_command(
                      shell,
                      f"erps {RING_ID} {PORT1_ROLE}",
                      r'config[^#]*[#>]\s*$',
                      timeout=10
                  )

                  check_error(
                      output,
                      f"erps {RING_ID} {PORT1_ROLE}"
                  )

                  send_command(
                      shell,
                      "exit",
                      config_prompt,
                      timeout=5
                  )

                  # ------------------------------------------------
                  # PORT 2
                  # ------------------------------------------------

                  output = send_command(
                      shell,
                      f"interface {PORT2}",
                      r'config[^#]*[#>]\s*$',
                      timeout=5
                  )

                  check_error(
                      output,
                      f"interface {PORT2}"
                  )

                  output = send_command(
                      shell,
                      f"erps {RING_ID} {PORT2_ROLE}",
                      r'config[^#]*[#>]\s*$',
                      timeout=10
                  )

                  check_error(
                      output,
                      f"erps {RING_ID} {PORT2_ROLE}"
                  )

                  send_command(
                      shell,
                      "exit",
                      config_prompt,
                      timeout=5
                  )

                  result = {
                      "status": "SUCCESS"
                  }

              # ====================================================
              # EDIT
              #
              # IMPORTANT:
              # EDIT DOES NOT DELETE PORT CONFIGURATION.
              #
              # Existing ports remain unchanged.
              #
              # Only these existing ERPS parameters are modified:
              #   - control-vlan
              #   - wtr-time
              #   - guard-time
              #   - send-time
              #
              # Sequence:
              #   erps disable <ring>
              #   erps <ring>
              #   modify parameters
              #   exit
              #   no erps disable <ring>
              # ====================================================

              elif OPERATION == "edit":

                  # Disable existing ERPS ring
                  output = send_command(
                      shell,
                      f"erps disable {RING_ID}",
                      config_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"erps disable {RING_ID}"
                  )

                  # Enter existing ERPS ring
                  ring_output = send_command(
                      shell,
                      f"erps {RING_ID}",
                      r'config[^#]*ring[^#]*#\s*$',
                      timeout=10
                  )

                  ring_prompt = (
                      r'config[^#]*ring[^#]*#\s*$'
                  )

                  if not re.search(
                      ring_prompt,
                      clean(ring_output),
                      re.IGNORECASE
                  ):
                      raise Exception(
                          f"Unable to enter ERPS Ring {RING_ID} configuration"
                      )

                  # ------------------------------------------------
                  # Modify existing Control VLAN
                  # ------------------------------------------------

                  output = send_command(
                      shell,
                      f"control-vlan {CONTROL_VLAN}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"control-vlan {CONTROL_VLAN}"
                  )

                  # ------------------------------------------------
                  # Modify WTR
                  # ------------------------------------------------

                  output = send_command(
                      shell,
                      f"wtr-time {WTR_TIME}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"wtr-time {WTR_TIME}"
                  )

                  # ------------------------------------------------
                  # Modify Guard
                  # ------------------------------------------------

                  output = send_command(
                      shell,
                      f"guard-time {GUARD_TIME}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"guard-time {GUARD_TIME}"
                  )

                  # ------------------------------------------------
                  # Modify Send Time
                  # ------------------------------------------------

                  output = send_command(
                      shell,
                      f"send-time {SEND_TIME}",
                      ring_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"send-time {SEND_TIME}"
                  )

                  # Exit ERPS ring configuration
                  send_command(
                      shell,
                      "exit",
                      config_prompt,
                      timeout=5
                  )

                  # ------------------------------------------------
                  # Re-enable existing ERPS ring
                  # ------------------------------------------------

                  output = send_command(
                      shell,
                      f"no erps disable {RING_ID}",
                      config_prompt,
                      timeout=10
                  )

                  check_error(
                      output,
                      f"no erps disable {RING_ID}"
                  )

                  result = {
                      "status": "SUCCESS"
                  }

              else:

                  raise Exception(
                      f"Unsupported operation: {OPERATION}"
                  )

              ssh.close()

              print(
                  json.dumps(result)
              )

          except Exception as e:

              try:
                  if ssh:
                      ssh.close()
              except Exception:
                  pass

              print(
                  json.dumps(
                      {
                          "status": "FAILED",
                          "reason": str(e)
                      }
                  )
              )

              sys.exit(1)

    # ============================================================
    # EXECUTE SCRIPT
    # ============================================================

    - name: Execute ERPS SET script
      ansible.builtin.command:
        cmd: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3 {{ script_file }}"
      register: erps_result
      changed_when: false
      failed_when: false

    # ============================================================
    # DISPLAY RESULT
    # ============================================================

    - name: Display ERPS result
      ansible.builtin.debug:
        var: erps_result.stdout

    # ============================================================
    # SAVE FAILURE
    # ============================================================

    - name: Save ERPS failure output
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_erps_{{ erps_operation }}.yml"
        mode: '0644'
        content: |
          status: FAILED
          reason: "{{ (erps_result.stdout | default('Unknown error')) | replace('\n', ' ') }}"
      when:
        - erps_result.rc != 0

    # ============================================================
    # REMOVE OLD FAILURE FILE ON SUCCESS
    # ============================================================

    - name: Remove old ERPS failure output after success
      ansible.builtin.file:
        path: "{{ output_dir }}/{{ ansible_host }}_erps_{{ erps_operation }}.yml"
        state: absent
      when:
        - erps_result.rc == 0

    # ============================================================
    # FAIL PLAY IF COMMAND FAILED
    # ============================================================

    - name: Fail if ERPS configuration failed
      ansible.builtin.fail:
        msg: "{{ erps_result.stdout }}"
      when:
        - erps_result.rc != 0
