---
- name: Network Device - Dynamic Show Version Collection
  hosts: all
  gather_facts: no

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    tmp_script: "/tmp/show_version_{{ inventory_hostname }}.py"

  tasks:

    - name: Ensure output directory exists
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      run_once: true

    - name: Create dynamic show version parsing script
      copy:
        dest: "{{ tmp_script }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import re

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  port=22,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(2)

              if shell.recv_ready():
                  shell.recv(65535)

              shell.send("enable\n")
              time.sleep(1)
              shell.send(PASSWORD + "\n")
              time.sleep(1)

              if shell.recv_ready():
                  shell.recv(65535)

              shell.send("show version\n")
              time.sleep(1)

              output = ""
              while shell.recv_ready():
                  output += shell.recv(65535).decode(errors="ignore")

              ssh.close()

              clean_lines = []

              for line in output.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if line.lower() in ("enable", "show version"):
                      continue

                  if re.match(r"^[A-Za-z0-9\-_\.]+(\(.*\))?[>#]$", line):
                      continue

                  if "unknown command" in line.lower():
                      continue

                  clean_lines.append(line)

              print("\n".join(clean_lines))

          except Exception as e:
              print(f"ERROR: {e}")

    - name: Execute dynamic show version script
      command: python3 "{{ tmp_script }}"
      register: show_version_output
      changed_when: false

    - name: Save output into YAML file
      copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_devicedetails.yml"
        content: |
          ip: "{{ ansible_host }}"
          show_version: | 
            {{ show_version_output.stdout | indent(12) }}
      
