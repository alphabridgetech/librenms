# =============================================================================
# File        : rate_limit/switchv1alphabridge/100g/rate_limit_details.yml
# Feature     : Show port rate limits (100G switches, e.g. AS300/56/XC)
#
# Same output as rate_limit/rate_limit_details.yml (read by
# KunalApiController::getratelimit). Differences on 100G:
#   - ports are tg0/0/N / cg0/0/N (the 10G playbook only keeps
#     GigaEthernet/TGigaEthernet ports)
#   - long output is paged with "--more--" (no "terminal length 0")
#
# CLI:
#   show running-config
#
#   interface tg0/0/1
#    switchport rate-limit 300 ingress              -> Receive 64kbps 300
#    switchport rate-limit bandwidth 60 egress      -> Send Percent 60
#   !
#
# Extra vars: interfaces (optional, comma separated) - only these ports are
#             reported; all tg/cg ports when omitted.
#
# Output:
#   output/<switch_ip>_rate_limit.yml
#
#   ip: <switch_ip>
#   rate_limit_entries:
#     - Port: tg0/0/1
#       Receive Status: Enable
#       Receive Speed Unit: 64kbps
#       Receive Speed: 300
#       Send Status: Disable
#   status: success | failed
# =============================================================================

- name: Show rate limits (100G)
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    plugin_dir: "/opt/librenms/librenms-ansible-inventory-plugin"
    script_path: "{{ plugin_dir }}/tmp/rate_limit_details_100g_{{ ansible_host }}.py"
    output_file: "{{ plugin_dir }}/output/{{ ansible_host }}_rate_limit.yml"

  tasks:

    - name: Create Python SSH script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import os
          import re
          import sys
          import time

          import paramiko
          import yaml

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_file }}"
          WANTED = {p.strip().lower() for p in "{{ interfaces | default('') }}".split(",") if p.strip()}

          ANSI_RE = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*$')
          # " --more-- " is wrapped in colour codes: \x1b[7m --more-- \x1b[m
          MORE_RE = re.compile(r'(?:\x1b\[[0-9;]*m)?\s*-+\s*more\s*-+\s*(?:\x1b\[[0-9;]*m)?\s*$', re.IGNORECASE)
          BACKSPACE_RE = re.compile(r'\x08+[ \t]*\x08*')

          INTERFACE_RE = re.compile(r'^interface\s+((?:tg|cg)\d+/\d+/\d+)\s*$', re.IGNORECASE)
          # switchport rate-limit [bandwidth] <n> ingress|egress
          RATE_RE = re.compile(r'^switchport\s+rate-limit\s+(bandwidth\s+)?(\d+)\s+(ingress|egress)\s*$', re.IGNORECASE)


          def read_until_prompt(shell, timeout=30):
              buf = ""
              end = time.time() + timeout
              while time.time() < end:
                  if shell.recv_ready():
                      buf += shell.recv(65535).decode(errors="ignore")
                      if MORE_RE.search(buf):
                          buf = MORE_RE.sub("\n", buf)
                          shell.send(" ")
                          end = time.time() + timeout
                          continue
                      if PROMPT_RE.search(buf):
                          return BACKSPACE_RE.sub("", buf)
                  else:
                      time.sleep(0.1)
              raise TimeoutError("Timed out waiting for the switch prompt")


          def save(data):
              tmp = OUTPUT_FILE + ".tmp"
              with open(tmp, "w") as f:
                  yaml.safe_dump(data, f, default_flow_style=False, sort_keys=False)
              os.replace(tmp, OUTPUT_FILE)


          def parse(config):
              entries = []
              port, limits = None, {}

              def close_block():
                  if port and (not WANTED or port.lower() in WANTED):
                      entry = {"Port": port}
                      for direction, label in (("ingress", "Receive"), ("egress", "Send")):
                          if direction in limits:
                              unit, speed = limits[direction]
                              entry[f"{label} Status"] = "Enable"
                              entry[f"{label} Speed Unit"] = unit
                              entry[f"{label} Speed"] = speed
                          else:
                              entry[f"{label} Status"] = "Disable"
                      entries.append(entry)

              for raw in config.splitlines():
                  line = raw.strip()
                  match = INTERFACE_RE.match(line)
                  if match:
                      close_block()
                      port, limits = match.group(1).lower(), {}
                      continue
                  if line == "!" or line.lower().startswith("interface "):
                      close_block()
                      port, limits = None, {}
                      continue
                  if port:
                      rate = RATE_RE.match(line)
                      if rate:
                          unit = "Percent" if rate.group(1) else "64kbps"
                          limits[rate.group(3).lower()] = (unit, int(rate.group(2)))
              close_block()
              return entries


          ssh = None
          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(HOST, username=USER, password=PASSWORD,
                          look_for_keys=False, allow_agent=False, timeout=15)
              shell = ssh.invoke_shell()
              read_until_prompt(shell, 10)
              shell.send("enable\n")
              read_until_prompt(shell, 10)

              shell.send("show running-config\n")
              output = ANSI_RE.sub("", read_until_prompt(shell, 60)).replace("\r", "")
              ssh.close()

              if "Current configuration" not in output:
                  raise Exception("Could not read 'show running-config'")

              entries = parse(output)
              save({"ip": HOST, "rate_limit_entries": entries, "status": "success"})
              print(f"Ports: {len(entries)}, limited: {sum(1 for e in entries if 'Enable' in (e['Receive Status'], e['Send Status']))}")

          except Exception as e:
              try:
                  if ssh:
                      ssh.close()
              except Exception:
                  pass
              # Keep the last good table, only report the error
              print("ERROR:", e)
              sys.exit(1)
      delegate_to: localhost

    - name: Run rate limit details script
      ansible.builtin.command:
        cmd: "{{ plugin_dir }}/bin/python3 {{ script_path }}"
      register: run_result
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ run_result.stdout_lines + run_result.stderr_lines }}"

    - name: Fail if show failed
      ansible.builtin.fail:
        msg: "{{ run_result.stdout }}"
      when: run_result.rc != 0
