---
- name: Run "show interface brief" on network device via SSH
  hosts: alphabridge_devices
  gather_facts: no

  tasks:

    - name: Create Python SSH script
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/get_interface_exec.py"
        mode: '0755'
        content: |
          import paramiko
          import re
          import time
          import json
          from datetime import datetime

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          ansi_re = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')


          def read_until_prompt(shell, prompt_regex, timeout=10):
              buf = ""
              end_time = time.time() + timeout
              while time.time() < end_time:
                  if shell.recv_ready():
                      buf += shell.recv(65535).decode(errors="ignore")
                      if re.search(prompt_regex, buf):
                          return buf
                      end_time = time.time() + 0.5
                  else:
                      time.sleep(0.1)
              return buf


          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(0.5)

              initial = read_until_prompt(shell, r'[#>]\s*$', timeout=3)
              m = re.search(r'([A-Za-z0-9\-\._]+[#>])\s*$', initial.strip())
              prompt = re.escape(m.group(1)) if m else r'[#>]\s*$'

              shell.send("enable\n")
              time.sleep(0.3)
              shell.send(PASSWORD + "\n")
              time.sleep(0.3)
              read_until_prompt(shell, prompt, timeout=2)

              shell.send("terminal length 0\n")
              time.sleep(0.2)
              read_until_prompt(shell, prompt, timeout=1)

              shell.send("show interface brief\n")
              time.sleep(0.3)

              output = ""
              deadline = time.time() + 20
              while time.time() < deadline:
                  if shell.recv_ready():
                      chunk = shell.recv(65535).decode(errors="ignore")
                      output += chunk
                      if "--More--" in chunk:
                          shell.send(" ")
                          deadline = time.time() + 20
                          continue
                      if re.search(prompt, output):
                          break
                  else:
                      time.sleep(0.2)

              ssh.close()

              cleaned = ansi_re.sub("", output).replace("--More--", "")

              interfaces = []
              start = False

              for line in cleaned.splitlines():
                  line = line.strip()

                  if line.startswith("Port"):
                      start = True
                      continue

                  if not start or not line:
                      continue

                  parts = line.split()
                  if len(parts) < 2:
                      continue

                  iface = {
                      "name": parts[0],
                      "status": parts[1],
                      "vlan": parts[2] if len(parts) > 2 else None,
                      "duplex": parts[3] if len(parts) > 3 else None,
                      "speed": parts[4] if len(parts) > 4 else None,
                      "type": parts[5] if len(parts) > 5 else None
                  }

                  interfaces.append(iface)

              result = {
                  "status": "success",
                  "ip": HOST,
                  "current_time": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                  "interfaces": interfaces,
                  "count": len(interfaces)
              }

              print(json.dumps(result))

          except Exception as e:
              print(json.dumps({
                  "status": "error",
                  "message": str(e)
              }))

    - name: Run SSH script
      ansible.builtin.command:
        cmd: >
          /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          /opt/librenms/librenms-ansible-inventory-plugin/tmp/get_interface_exec.py
      register: interface_output
      changed_when: false

    - name: Save structured interface output to YAML
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_getinterface.yml"
        content: |
          {{ interface_output.stdout | from_json | to_nice_yaml }}
      when: interface_output.stdout is search('status')

    - name: Display parsed interface data
      ansible.builtin.debug:
        msg: "{{ interface_output.stdout | from_json }}"
