---
- name: Configure PDP Protocol
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    pdp_state: "{{ pdp_state | default('Close') }}"
    holdtime: "{{ holdtime | default('180') }}"
    tx_interval: "{{ tx_interval | default('60') }}"
    version: "{{ version | default('Version1') }}"

  tasks:

    - name: Validate Protocol State
      ansible.builtin.assert:
        that:
          - pdp_state | lower in ['open', 'close']
        fail_msg: "Invalid pdp_state. Use Open or Close."

    - name: Validate HoldTime
      ansible.builtin.assert:
        that:
          - holdtime | int >= 10
          - holdtime | int <= 255
        fail_msg: "HoldTime must be between 10 and 255 seconds."
      when: pdp_state | lower == 'open'

    - name: Validate Transmission Cycle
      ansible.builtin.assert:
        that:
          - tx_interval | int >= 5
          - tx_interval | int <= 254
        fail_msg: "Transmission cycle must be between 5 and 254 seconds."
      when: pdp_state | lower == 'open'

    - name: Validate Protocol Version
      ansible.builtin.assert:
        that:
          - version in ['Version1', 'Version2']
        fail_msg: "Version must be Version1 or Version2."
      when: pdp_state | lower == 'open'

    - name: Create Python SSH script for PDP
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/set_pdp.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          STATE = "{{ pdp_state | lower }}"
          HOLDTIME = "{{ holdtime }}"
          TX_INTERVAL = "{{ tx_interval }}"
          VERSION = "{{ version }}"

          def read_available(shell, wait=1):
              time.sleep(wait)
              output = ""

              while shell.recv_ready():
                  output += shell.recv(65535).decode(errors="ignore")
                  time.sleep(0.1)

              return output

          def get_last_prompt(output):
              for line in reversed(output.splitlines()):
                  line = line.strip()

                  if line and re.search(r"[>#]\s*$", line):
                      return line

              return None

          def send_command(shell, command, wait=1):
              shell.send(command + "\n")
              return read_available(shell, wait)

          def send_paged_command(shell, command, wait=2):
              shell.send(command + "\n")

              output = ""
              end_time = time.time() + 30

              while time.time() < end_time:

                  if shell.recv_ready():
                      data = shell.recv(65535).decode(errors="ignore")
                      output += data

                      if "--More--" in output:
                          shell.send(" ")
                          output = output.replace("--More--", "")
                          time.sleep(0.5)
                          continue

                      if "-- More --" in output:
                          shell.send(" ")
                          output = output.replace("-- More --", "")
                          time.sleep(0.5)
                          continue

                      if re.search(r"(?m)^[^\r\n]*[>#]\s*$", output):
                          break

                  else:
                      time.sleep(0.2)

              return output

          def close_connection(shell, ssh):
              try:
                  shell.close()
              except Exception:
                  pass

              try:
                  ssh.close()
              except Exception:
                  pass

          def fail(shell, ssh, message, output=""):
              print("PDP CONFIGURATION FAILED")
              print(message)

              if output:
                  print(output)

              close_connection(shell, ssh)
              sys.exit(1)

          try:

              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10,
                  banner_timeout=10,
                  auth_timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(1)

              initial_output = read_available(shell, wait=1)
              current_prompt = get_last_prompt(initial_output)

              if not current_prompt:
                  fail(
                      shell,
                      ssh,
                      "Unable to detect initial device prompt.",
                      initial_output
                  )

              if current_prompt.endswith(">"):

                  enable_output = send_command(
                      shell,
                      "enable",
                      wait=1
                  )

                  enable_prompt = get_last_prompt(enable_output)

                  if not enable_prompt:
                      fail(
                          shell,
                          ssh,
                          "Unable to detect prompt after enable.",
                          enable_output
                      )

                  if not enable_prompt.endswith("#"):
                      fail(
                          shell,
                          ssh,
                          "Unable to enter privileged mode.",
                          enable_output
                      )

                  current_prompt = enable_prompt

              if not current_prompt.endswith("#"):
                  fail(
                      shell,
                      ssh,
                      "Device is not in privileged mode.",
                      current_prompt
                  )

              config_output = send_command(
                  shell,
                  "config",
                  wait=1
              )

              config_prompt = get_last_prompt(config_output)

              if not config_prompt:
                  fail(
                      shell,
                      ssh,
                      "Unable to detect configuration prompt.",
                      config_output
                  )

              if not config_prompt.endswith("#"):
                  fail(
                      shell,
                      ssh,
                      "Unable to enter configuration mode.",
                      config_output
                  )

              send_command(
                  shell,
                  "terminal length 0",
                  wait=1
              )

              if STATE == "open":

                  output = send_command(
                      shell,
                      "pdp run",
                      wait=1
                  )

                  if re.search(
                      r"(unknown command|invalid|error|failed|incomplete)",
                      output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "Failed to enable PDP.",
                          output
                      )

                  output = send_command(
                      shell,
                      "pdp holdtime " + HOLDTIME,
                      wait=1
                  )

                  if re.search(
                      r"(unknown command|invalid|error|failed|incomplete)",
                      output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "Failed to configure PDP holdtime.",
                          output
                      )

                  output = send_command(
                      shell,
                      "pdp timer " + TX_INTERVAL,
                      wait=1
                  )

                  if re.search(
                      r"(unknown command|invalid|error|failed|incomplete)",
                      output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "Failed to configure PDP timer.",
                          output
                      )

                  if VERSION == "Version1":
                      version_number = "1"
                  else:
                      version_number = "2"

                  output = send_command(
                      shell,
                      "pdp version " + version_number,
                      wait=1
                  )

                  if re.search(
                      r"(parameter out of range|unknown command|invalid|error|failed|incomplete)",
                      output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "Failed to configure PDP version.",
                          output
                      )

              else:

                  output = send_command(
                      shell,
                      "no pdp run",
                      wait=1
                  )

                  if re.search(
                      r"(unknown command|invalid|error|failed|incomplete)",
                      output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "Failed to disable PDP.",
                          output
                      )

              verify_output = send_paged_command(
                  shell,
                  "show running-config",
                  wait=2
              )

              if not verify_output:
                  fail(
                      shell,
                      ssh,
                      "Unable to retrieve running configuration."
                  )

              verify_output = verify_output.replace("--More--", "")
              verify_output = verify_output.replace("-- More --", "")

              if STATE == "open":

                  if not re.search(
                      r"(?m)^\s*pdp\s+run\s*$",
                      verify_output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "PDP run configuration was not found.",
                          verify_output
                      )

                  holdtime_match = re.search(
                      r"(?m)^\s*pdp\s+holdtime\s+(\d+)\s*$",
                      verify_output,
                      re.IGNORECASE
                  )

                  timer_match = re.search(
                      r"(?m)^\s*pdp\s+timer\s+(\d+)\s*$",
                      verify_output,
                      re.IGNORECASE
                  )

                  if not holdtime_match:
                      fail(
                          shell,
                          ssh,
                          "PDP holdtime was not found.",
                          verify_output
                      )

                  if not timer_match:
                      fail(
                          shell,
                          ssh,
                          "PDP timer was not found.",
                          verify_output
                      )

                  actual_holdtime = holdtime_match.group(1)
                  actual_timer = timer_match.group(1)

                  if actual_holdtime != HOLDTIME:
                      fail(
                          shell,
                          ssh,
                          "PDP holdtime verification failed. Expected "
                          + HOLDTIME
                          + ", got "
                          + actual_holdtime,
                          verify_output
                      )

                  if actual_timer != TX_INTERVAL:
                      fail(
                          shell,
                          ssh,
                          "PDP timer verification failed. Expected "
                          + TX_INTERVAL
                          + ", got "
                          + actual_timer,
                          verify_output
                      )

                  version_number = "1" if VERSION == "Version1" else "2"

                  version_command_output = send_command(
                      shell,
                      "pdp version ?",
                      wait=1
                  )

                  if "1-2" not in version_command_output:
                      fail(
                          shell,
                          ssh,
                          "Unable to verify supported PDP version range.",
                          version_command_output
                      )

                  version_test_output = send_command(
                      shell,
                      "pdp version " + version_number,
                      wait=1
                  )

                  if re.search(
                      r"(parameter out of range|unknown command|invalid|error|failed|incomplete)",
                      version_test_output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "PDP version verification failed.",
                          version_test_output
                      )

              else:

                  if re.search(
                      r"(?m)^\s*pdp\s+run\s*$",
                      verify_output,
                      re.IGNORECASE
                  ):
                      fail(
                          shell,
                          ssh,
                          "PDP is still enabled.",
                          verify_output
                      )

              close_connection(shell, ssh)

              print("SUCCESS")
              sys.exit(0)

          except Exception as error:

              print("PDP CONFIGURATION FAILED")
              print("Error: " + str(error))

              sys.exit(1)

    - name: Run PDP configuration script
      ansible.builtin.command:
        cmd: >
          /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          /opt/librenms/librenms-ansible-inventory-plugin/tmp/set_pdp.py
      register: pdp_result
      changed_when: false
      failed_when: false

    - name: Save PDP Open success
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_pdp_open.yml"
        content: "SUCCESS\n"
      when:
        - pdp_state | lower == 'open'
        - pdp_result.rc == 0
        - pdp_result.stdout | trim == 'SUCCESS'

    - name: Save PDP Close success
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_pdp_close.yml"
        content: "SUCCESS\n"
      when:
        - pdp_state | lower == 'close'
        - pdp_result.rc == 0
        - pdp_result.stdout | trim == 'SUCCESS'

    - name: Display PDP result
      ansible.builtin.debug:
        msg: "{{ pdp_result.stdout | trim }}"

    - name: Fail if PDP configuration failed
      ansible.builtin.fail:
        msg: "{{ pdp_result.stdout | trim }}"
      when:
        - pdp_result.rc != 0
          or pdp_result.stdout | trim != 'SUCCESS'
