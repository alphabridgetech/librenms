---
- name: Configure PDP
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    pdp_state: "Close"
    holdtime: 180
    tx_interval: 60
    version: "Version1"
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"

  tasks:

    - name: Validate PDP state
      ansible.builtin.assert:
        that:
          - pdp_state in ['Open', 'Close']
        fail_msg: "pdp_state must be Open or Close."

    - name: Validate PDP holdtime
      ansible.builtin.assert:
        that:
          - holdtime | int >= 10
          - holdtime | int <= 255
        fail_msg: "holdtime must be between 10 and 255."

    - name: Validate PDP TX interval
      ansible.builtin.assert:
        that:
          - tx_interval | int >= 5
          - tx_interval | int <= 254
        fail_msg: "tx_interval must be between 5 and 254."

    - name: Validate PDP version
      ansible.builtin.assert:
        that:
          - version in ['Version1', 'Version2']
        fail_msg: "version must be Version1 or Version2."

    - name: Configure and verify PDP
      ansible.builtin.shell: |
        python3 <<'PY'
        import paramiko
        import re
        import sys
        import os
        import time

        HOST = "{{ ansible_host }}"
        USER = "{{ ansible_user }}"
        PASSWORD = "{{ ansible_password }}"

        PDP_STATE = "{{ pdp_state }}"
        HOLDTIME = "{{ holdtime }}"
        TX_INTERVAL = "{{ tx_interval }}"
        VERSION = "{{ version }}"

        OUTPUT_DIR = "{{ output_dir }}"

        ssh = None
        shell = None

        def fail(message, output=""):
            print(message)

            if output:
                print(output)

            if shell:
                try:
                    shell.close()
                except:
                    pass

            if ssh:
                try:
                    ssh.close()
                except:
                    pass

            sys.exit(1)

        def send_command(shell, command, wait=1.5):
            shell.send(command + "\n")
            time.sleep(wait)

            output = ""

            while shell.recv_ready():
                output += shell.recv(65535).decode(
                    "utf-8",
                    errors="ignore"
                )

            return output

        try:

            ssh = paramiko.SSHClient()
            ssh.set_missing_host_key_policy(
                paramiko.AutoAddPolicy()
            )

            ssh.connect(
                HOST,
                username=USER,
                password=PASSWORD,
                look_for_keys=False,
                allow_agent=False,
                timeout=15,
                banner_timeout=15,
                auth_timeout=15
            )

            shell = ssh.invoke_shell()

            time.sleep(2)

            while shell.recv_ready():
                shell.recv(65535)

            shell.send("\n")
            time.sleep(1)

            initial_output = ""

            while shell.recv_ready():
                initial_output += shell.recv(65535).decode(
                    "utf-8",
                    errors="ignore"
                )

            lines = [
                line.strip()
                for line in initial_output.splitlines()
                if line.strip()
            ]

            if not lines:
                fail("Unable to detect device prompt.")

            prompt = lines[-1]

            if prompt.endswith(">"):
                output = send_command(
                    shell,
                    "enable"
                )

                if re.search(
                    r"(unknown command|invalid|error|failed)",
                    output,
                    re.IGNORECASE
                ):
                    fail(
                        "Failed to enter enable mode.",
                        output
                    )

            output = send_command(
                shell,
                "config"
            )

            if re.search(
                r"(unknown command|invalid|error|failed)",
                output,
                re.IGNORECASE
            ):
                fail(
                    "Failed to enter configuration mode.",
                    output
                )

            send_command(
                shell,
                "terminal length 0"
            )

            if PDP_STATE == "Open":

                output = send_command(
                    shell,
                    "pdp run"
                )

                if re.search(
                    r"(unknown command|invalid|error|failed|incomplete)",
                    output,
                    re.IGNORECASE
                ):
                    fail(
                        "Failed to enable PDP.",
                        output
                    )

                output = send_command(
                    shell,
                    "pdp holdtime " + HOLDTIME
                )

                if re.search(
                    r"(parameter out of range|unknown command|invalid|error|failed|incomplete)",
                    output,
                    re.IGNORECASE
                ):
                    fail(
                        "Failed to configure PDP holdtime.",
                        output
                    )

                output = send_command(
                    shell,
                    "pdp timer " + TX_INTERVAL
                )

                if re.search(
                    r"(parameter out of range|unknown command|invalid|error|failed|incomplete)",
                    output,
                    re.IGNORECASE
                ):
                    fail(
                        "Failed to configure PDP timer.",
                        output
                    )

                version_number = (
                    "1"
                    if VERSION == "Version1"
                    else "2"
                )

                output = send_command(
                    shell,
                    "pdp version " + version_number
                )

                if re.search(
                    r"(parameter out of range|unknown command|invalid|error|failed|incomplete)",
                    output,
                    re.IGNORECASE
                ):
                    fail(
                        "Failed to configure PDP version.",
                        output
                    )

            else:

                output = send_command(
                    shell,
                    "no pdp run"
                )

                if re.search(
                    r"(unknown command|invalid|error|failed|incomplete)",
                    output,
                    re.IGNORECASE
                ):
                    fail(
                        "Failed to disable PDP.",
                        output
                    )

            time.sleep(1)

            running_config = send_command(
                shell,
                "show running-config",
                wait=3
            )

            if PDP_STATE == "Open":

                if not re.search(
                    r"(?m)^\s*pdp\s+run\s*$",
                    running_config,
                    re.IGNORECASE
                ):
                    fail(
                        "PDP run configuration not found.",
                        running_config
                    )

                version_number = (
                    "1"
                    if VERSION == "Version1"
                    else "2"
                )

                # The device only echoes a pdp version line in running-config
                # when it differs from the device default version -
                # requesting the default leaves no explicit line at all
                # (same behavior already seen with holdtime/tx_interval),
                # so only fail when a DIFFERENT version is explicitly set,
                # not merely when no line is present.
                version_match = re.search(
                    r"(?m)^\s*pdp\s+version\s+(\d+)\s*$",
                    running_config,
                    re.IGNORECASE
                )

                if version_match and version_match.group(1) != version_number:
                    fail(
                        "PDP version verification failed.",
                        running_config
                    )

                os.makedirs(
                    OUTPUT_DIR,
                    exist_ok=True
                )

                output_file = os.path.join(
                    OUTPUT_DIR,
                    HOST + "_pdp_open.yml"
                )

                with open(output_file, "w") as f:
                    f.write(
                        "status: SUCCESS\n"
                        "state: Open\n"
                        "holdtime: " + HOLDTIME + "\n"
                        "tx_interval: " + TX_INTERVAL + "\n"
                        "version: " + VERSION + "\n"
                    )

                print("SUCCESS")

            else:

                if re.search(
                    r"(?m)^\s*pdp\s+run\s*$",
                    running_config,
                    re.IGNORECASE
                ):
                    fail(
                        "PDP disable verification failed.",
                        running_config
                    )

                os.makedirs(
                    OUTPUT_DIR,
                    exist_ok=True
                )

                output_file = os.path.join(
                    OUTPUT_DIR,
                    HOST + "_pdp_close.yml"
                )

                with open(output_file, "w") as f:
                    f.write(
                        "status: SUCCESS\n"
                        "state: Close\n"
                    )

                print("SUCCESS")

            shell.close()
            ssh.close()

        except Exception as e:
            fail(
                "PDP configuration failed.",
                str(e)
            )

        PY
      args:
        executable: /bin/bash
      register: pdp_result
      changed_when: "'SUCCESS' in pdp_result.stdout"
      failed_when: pdp_result.rc != 0 or 'SUCCESS' not in pdp_result.stdout

    - name: Show PDP result
      ansible.builtin.debug:
        msg: "{{ pdp_result.stdout }}"
