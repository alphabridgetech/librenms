# =============================================================================
# Playbook Name : IPv6 DHCP Address Pools Delete
# =============================================================================
#
# Description:
# Deletes an IPv6 DHCP pool by its profile name and saves the configuration.
#
# Usage (delete the `test` pool):
# ansible-playbook -i inventory/192.168.200.241.yml \
#   playbooks/l3/ipv6_dhcp_server_config/ipv6_dhcp_address_pools_delete.yml \
#   -e "Pool_Name=test"
# The switch command for this example is: no ipv6 dhcp pool test
#
# Output:
#   output/<switch_ip>_ipv6_dhcp_address_pools_delete.yml
# =============================================================================

- name: Delete IPv6 DHCP address pool
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    # These files live in playbooks/<feature>/, so the plugin root is two
    # levels up.
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"
    ipv6_dhcp_pool_name: "{{ Pool_Name | default('') }}"

  pre_tasks:
    - name: Ensure helper and output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

  tasks:
    - name: Create IPv6 DHCP address pool delete SSH helper
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/ipv6_dhcp_address_pools_delete_exec_{{ ansible_host }}.py"
        mode: '0700'
        content: |
          #!/usr/bin/env python3

          import json
          import re
          import time
          import paramiko

          HOST = {{ ansible_host | to_json }}
          PORT = int({{ ansible_port | default(22) | to_json }})
          USER = {{ ansible_user | to_json }}
          PASSWORD = {{ ansible_password | to_json }}
          POOL_NAME = {{ ipv6_dhcp_pool_name | to_json }}

          ANSI_RE = re.compile(r'\x1b(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*\Z')
          CLI_ERROR_RE = re.compile(
              r'(?im)^\s*%\s*(?:invalid|error|incomplete|ambiguous|'
              r'unknown|unrecognized)\b|'
              r'\b(?:invalid input|unknown command|incomplete command|'
              r'command rejected|bad parameter|too many parameters|fail with ret\s*-?\d+)\b'
          )

          def read_until_prompt(shell, stage, timeout=30):
              buffer = ""
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  if shell.recv_ready():
                      buffer += shell.recv(65535).decode(errors="replace")
                      clean = ANSI_RE.sub("", buffer).replace("\r", "")
                      if PROMPT_RE.search(clean.rstrip()):
                          return clean
                  else:
                      time.sleep(0.1)
              raise TimeoutError(f"Timed out waiting for switch prompt during {stage}")

          def run_command(shell, command, timeout=30, check_errors=True):
              shell.send(command + "\n")
              output = read_until_prompt(shell, command, timeout)
              if check_errors and CLI_ERROR_RE.search(output):
                  raise RuntimeError(f"Switch rejected {command!r}: {output.strip()}")
              return output

          ssh = None
          shell = None
          stage = "input validation"
          try:
              if not POOL_NAME or not re.fullmatch(r"[A-Za-z0-9_.-]+", POOL_NAME):
                  raise ValueError(
                      "Pool_Name is required and may contain only letters, numbers, "
                      "underscores, periods, and hyphens"
                  )
              command = f"no ipv6 dhcp pool {POOL_NAME}"
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              stage = "SSH connection"
              ssh.connect(
                  HOST, port=PORT, username=USER, password=PASSWORD,
                  look_for_keys=False, allow_agent=False,
                  timeout=20, auth_timeout=20, banner_timeout=20,
              )
              shell = ssh.invoke_shell()
              read_until_prompt(shell, "initial prompt", timeout=10)
              stage = "enable mode"
              run_command(shell, "enable", timeout=10, check_errors=False)
              stage = "disable paging"
              run_command(shell, "terminal length 0", timeout=10, check_errors=False)
              stage = "configuration mode"
              run_command(shell, "config", timeout=10)
              stage = command
              run_command(shell, command, timeout=15)
              stage = "exit configuration mode"
              run_command(shell, "exit", timeout=10, check_errors=False)
              stage = "save configuration"
              write_output = ANSI_RE.sub(
                  "", run_command(shell, "write", timeout=20, check_errors=False)
              )
              if re.search(r"%err|invalid|error|fail", write_output, re.IGNORECASE):
                  raise RuntimeError(f"Switch rejected 'write': {write_output.strip()}")
              if "OK!" not in write_output:
                  raise RuntimeError(
                      "Switch did not confirm the configuration save: "
                      + write_output.strip()
                  )
              stage = "verify deleted pool"
              config = run_command(shell, "show run non-interface", timeout=60)
              clean_config = ANSI_RE.sub("", config).replace("\r", "")
              if not any(
                  line.strip().lower().startswith("!version ")
                  or line.strip().lower() == "current configuration:"
                  for line in clean_config.splitlines()
              ):
                  raise RuntimeError("SHOW output does not contain a running-config header")
              target = f"ipv6 dhcp pool {POOL_NAME}".lower()
              if any(line.strip().lower() == target for line in clean_config.splitlines()):
                  raise RuntimeError(f"IPv6 DHCP pool {POOL_NAME!r} remains in running configuration")
              print(json.dumps({"ip": HOST, "status": "success"}))
          except Exception as exc:
              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "stage": stage,
                  "error": str(exc),
              }))
          finally:
              if shell is not None:
                  shell.close()
              if ssh is not None:
                  ssh.close()
      no_log: true

    - name: Execute IPv6 DHCP address pool delete helper
      ansible.builtin.command:
        argv:
          - "{{ project_root }}/bin/python3"   # plugin venv (has paramiko)
          - "{{ tmp_dir }}/ipv6_dhcp_address_pools_delete_exec_{{ ansible_host }}.py"
      register: ipv6_dhcp_pool_delete_raw
      changed_when: >-
        ipv6_dhcp_pool_delete_raw.rc == 0 and
        '"status": "success"' in ipv6_dhcp_pool_delete_raw.stdout
      failed_when: false

    - name: Fail if helper returned no JSON
      ansible.builtin.fail:
        msg: >-
          IPv6 DHCP address pool DELETE helper returned no JSON.
          rc={{ ipv6_dhcp_pool_delete_raw.rc }}; stderr={{ ipv6_dhcp_pool_delete_raw.stderr }}
      when: ipv6_dhcp_pool_delete_raw.stdout | trim | length == 0

    - name: Parse IPv6 DHCP address pool delete result
      ansible.builtin.set_fact:
        ipv6_dhcp_pool_delete_result: "{{ ipv6_dhcp_pool_delete_raw.stdout | from_json }}"

    - name: Fail if IPv6 DHCP address pool deletion failed
      ansible.builtin.fail:
        msg: >-
          IPv6 DHCP address pool DELETE failed during
          {{ ipv6_dhcp_pool_delete_result.stage | default('execution') }}:
          {{ ipv6_dhcp_pool_delete_result.error | default(ipv6_dhcp_pool_delete_raw.stderr) }}
      when: ipv6_dhcp_pool_delete_result.status != 'success' or ipv6_dhcp_pool_delete_raw.rc != 0

    - name: Display IPv6 DHCP address pool delete result
      ansible.builtin.debug:
        msg: "{{ ipv6_dhcp_pool_delete_result | to_nice_yaml(indent=2, sort_keys=False) }}"

    - name: Save IPv6 DHCP address pool delete result
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_ipv6_dhcp_address_pools_delete.yml"
        content: "{{ ipv6_dhcp_pool_delete_result | to_nice_yaml(indent=2, sort_keys=False) }}"

    - name: Display result path
      ansible.builtin.debug:
        msg: >-
          IPv6 DHCP address pool deletion completed successfully.
          Saved to output/{{ ansible_host }}_ipv6_dhcp_address_pools_delete.yml
