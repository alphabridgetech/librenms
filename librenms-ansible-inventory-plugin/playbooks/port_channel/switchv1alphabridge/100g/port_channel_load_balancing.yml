# =============================================================================
# File        : port_channel/switchv1alphabridge/100g/port_channel_load_balancing.yml
# Feature     : Aggregate group load balancing (100G switches, e.g. AS300/56/XC)
#
# On 100G the load-balance method is switch-wide (global config), not set
# per p<N> interface as on 10G, so "port" is accepted but does not limit it.
#
# CLI:
#   config
#   aggregator-group load-balance src-mac | dst-mac | both-mac |
#                                 src-ip | dst-ip | both-ip |
#                                 l4-sport | l4-dport | both-l4port
#   exit
#   write
#
# Extra vars: port (p1-p64, informational), mode ("SRC MAC", "BOTH IP", ...)
#
# Output (same file as the 10G playbook):
#   output/<switch_ip>_port_channel_load_balancing.yml -> status: success | failed
# =============================================================================

- name: Port channel load balancing (100G)
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    plugin_dir: "/opt/librenms/librenms-ansible-inventory-plugin"
    script_path: "{{ plugin_dir }}/tmp/port_channel_lb_100g_{{ ansible_host }}.py"
    output_file: "{{ plugin_dir }}/output/{{ ansible_host }}_port_channel_load_balancing.yml"
    mode_map:
      "SRC MAC": src-mac
      "DST MAC": dst-mac
      "BOTH MAC": both-mac
      "SRC IP": src-ip
      "DST IP": dst-ip
      "BOTH IP": both-ip
      "L4 SRC PORT": l4-sport
      "L4 DST PORT": l4-dport
      "BOTH L4 PORT": both-l4port

  tasks:

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - mode is defined
          - mode | upper in mode_map
        fail_msg: "mode must be one of {{ mode_map.keys() | list }}"

    - name: Create Python SSH script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import re
          import sys
          import time

          import paramiko
          import yaml

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_file }}"

          PORT = "{{ port | default('') | lower }}"
          MODE = "{{ mode | upper }}"
          METHOD = "{{ mode_map[mode | upper] }}"

          ANSI_RE = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*$')
          CLI_ERROR_RE = re.compile(r'Bad parameter|Unknown command|Incomplete|%\s*err|error|fail', re.IGNORECASE)


          # " --more-- " is wrapped in colour codes: \x1b[7m --more-- \x1b[m
          MORE_RE = re.compile(r'(?:\x1b\[[0-9;]*m)?\s*-+\s*more\s*-+\s*(?:\x1b\[[0-9;]*m)?\s*$', re.IGNORECASE)
          BACKSPACE_RE = re.compile(r'\x08+\s*\x08*')


          def read_until_prompt(shell, timeout=10):
              # 100G switches page long output with " --more--" and have no
              # "terminal length 0", so press space at every page break.
              buf = ""
              end = time.time() + timeout
              while time.time() < end:
                  if shell.recv_ready():
                      buf += shell.recv(65535).decode(errors="ignore")
                      if MORE_RE.search(buf):
                          buf = MORE_RE.sub("", buf)
                          shell.send(" ")
                          end = time.time() + timeout
                          continue
                      if PROMPT_RE.search(buf):
                          return BACKSPACE_RE.sub("", buf)
                  else:
                      time.sleep(0.1)
              return BACKSPACE_RE.sub("", buf)


          def run(shell, command, timeout=10, check=True):
              shell.send(command + "\n")
              out = ANSI_RE.sub("", read_until_prompt(shell, timeout)).replace("\r", "")
              if check and CLI_ERROR_RE.search(out.replace(command, "")):
                  raise Exception(f"Switch rejected '{command}': {out.replace(command, '').strip()}")
              return out


          def save(data):
              with open(OUTPUT_FILE, "w") as f:
                  yaml.safe_dump(data, f, default_flow_style=False, sort_keys=False)


          ssh = None
          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(HOST, username=USER, password=PASSWORD,
                          look_for_keys=False, allow_agent=False, timeout=15)
              shell = ssh.invoke_shell()
              read_until_prompt(shell, 5)
              run(shell, "enable", 5, check=False)

              out = run(shell, "config", 5)
              if "(config)#" not in out:
                  raise Exception("Could not enter config mode: " + out.strip())

              command = f"aggregator-group load-balance {METHOD}"
              run(shell, command)
              run(shell, "exit", 5, check=False)
              run(shell, "write", 30, check=False)
              ssh.close()

              save({"ip": HOST, "port": PORT, "mode": MODE, "command": command,
                    "scope": "switch-wide", "status": "success"})
              print("SUCCESS:", command)

          except Exception as e:
              try:
                  if ssh:
                      ssh.close()
              except Exception:
                  pass
              save({"ip": HOST, "port": PORT, "mode": MODE, "status": "failed", "error": str(e)})
              print("ERROR:", e)
              sys.exit(1)
      delegate_to: localhost

    - name: Run load balancing script
      ansible.builtin.command:
        cmd: "{{ plugin_dir }}/bin/python3 {{ script_path }}"
      register: run_result
      changed_when: run_result.rc == 0
      failed_when: false
      delegate_to: localhost

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ run_result.stdout_lines + run_result.stderr_lines }}"

    - name: Fail if load balancing failed
      ansible.builtin.fail:
        msg: "{{ run_result.stdout }}"
      when: run_result.rc != 0
