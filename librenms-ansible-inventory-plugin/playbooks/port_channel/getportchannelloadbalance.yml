# =============================================================================
# File        : port_channel/getportchannelloadbalance.yml
# Feature     : Get port channel load balancing (10G / common switches, e.g. AS212XTS)
#
# 10G switches have no "show port-channel-loading-balance json" (100G uses
# switchv1alphabridge/100g/getportchannelloadbalance.yml for that). The mode
# is read from the running config instead:
#
#   aggregator-group load-balance both-ip     -> mode both-ip
#   (no such line)                            -> switch default, mode ""
#
# CLI:
#   terminal length 0
#   show running-config
#
# Output (same format as the 100G playbook, read by
# KunalApiController::getportchannelloadbalance):
#   output/<switch_ip>_port_channel_load_balance_get.yml
#
#   ip: <switch_ip>
#   capability: global
#   mode: both-ip            ("" when the switch default is in use)
#   mode_label: BOTH IP      ("" when the switch default is in use)
#   status: success | failed
# =============================================================================

- name: Get port channel load balancing
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    plugin_dir: "/opt/librenms/librenms-ansible-inventory-plugin"
    script_path: "{{ plugin_dir }}/tmp/getportchannelloadbalance_{{ ansible_host }}.py"
    output_file: "{{ plugin_dir }}/output/{{ ansible_host }}_port_channel_load_balance_get.yml"

  tasks:

    - name: Create Python SSH script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import re
          import sys
          import time

          import paramiko
          import yaml

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_file }}"

          # CLI keyword -> Load Balancing Mode dropdown value
          MODE_LABELS = {
              "src-mac": "SRC MAC",
              "dst-mac": "DST MAC",
              "both-mac": "BOTH MAC",
              "src-ip": "SRC IP",
              "dst-ip": "DST IP",
              "both-ip": "BOTH IP",
              "src-port": "SRC PORT",
              "enhanced": "ENHANCED",
              "l4-sport": "L4 SRC PORT",
              "l4-dport": "L4 DST PORT",
              "both-l4port": "BOTH L4 PORT",
          }

          ANSI_RE = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*$')
          LB_LINE_RE = re.compile(r'^\s*aggregator-group\s+load-balance\s+(\S+)', re.MULTILINE)


          def read_until_prompt(shell, timeout=10):
              buf = ""
              end = time.time() + timeout
              while time.time() < end:
                  if shell.recv_ready():
                      buf += shell.recv(65535).decode(errors="ignore")
                      if PROMPT_RE.search(buf):
                          return buf
                  else:
                      time.sleep(0.1)
              return buf


          def save(data):
              with open(OUTPUT_FILE, "w") as f:
                  yaml.safe_dump(data, f, default_flow_style=False, sort_keys=False)


          ssh = None
          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(HOST, username=USER, password=PASSWORD,
                          look_for_keys=False, allow_agent=False, timeout=15)
              shell = ssh.invoke_shell()
              read_until_prompt(shell, 5)
              for command in ("enable", "terminal length 0"):
                  shell.send(command + "\n")
                  read_until_prompt(shell, 5)

              shell.send("show running-config\n")
              output = ANSI_RE.sub("", read_until_prompt(shell, 30)).replace("\r", "")
              ssh.close()

              if "Current configuration" not in output:
                  raise Exception("Could not read 'show running-config'")

              match = LB_LINE_RE.search(output)
              mode = match.group(1).lower() if match else ""

              save({
                  "ip": HOST,
                  "capability": "global",
                  "mode": mode,
                  "mode_label": MODE_LABELS.get(mode, ""),
                  "status": "success",
              })
              print(f"mode={mode or 'default'} label={MODE_LABELS.get(mode, '')}")

          except Exception as e:
              try:
                  if ssh:
                      ssh.close()
              except Exception:
                  pass
              save({"ip": HOST, "capability": "", "mode": "", "mode_label": "",
                    "status": "failed", "error": str(e)})
              print("ERROR:", e)
              sys.exit(1)
      delegate_to: localhost

    - name: Run get load balancing script
      ansible.builtin.command:
        cmd: "{{ plugin_dir }}/bin/python3 {{ script_path }}"
      register: run_result
      changed_when: false
      failed_when: false
      delegate_to: localhost

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ run_result.stdout_lines + run_result.stderr_lines }}"

    - name: Fail if get failed
      ansible.builtin.fail:
        msg: "{{ run_result.stdout }}"
      when: run_result.rc != 0
