# ============================================================================
# File        : setlldpinterfaceconfiguration.yml
# Feature     : LLDP Interface Configuration - SET
#
# Usage:
# ansible-playbook -i 192.168.2.1.yml \
# playbooks/setlldpinterfaceconfiguration.yml \
# -e "interface=GigaEthernet0/2 admin_status=enable tlv=enable"
#
# Arguments:
#   interface      : GigaEthernet0/1 ... GigaEthernet0/10
#   admin_status   : enable / disable
#   tlv            : enable / disable
#
# Mapping:
#   admin_status=enable  -> lldp receive
#   admin_status=disable -> no lldp receive
#   tlv=enable           -> lldp transmit
#   tlv=disable          -> no lldp transmit
#
# Connection:
#   SSH - Port 22
# ============================================================================

- name: LLDP Interface Configuration SET
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    script_dir: "/opt/librenms/librenms-ansible-inventory-plugin/tmp"

    script_file: "{{ script_dir }}/set_lldp_interface.py"
    output_file: "{{ output_dir }}/{{ ansible_host }}_lldp_interface_configuration.yml"

  tasks:

    # ========================================================================
    # VALIDATION
    # ========================================================================

    - name: Validate Interface
      assert:
        that:
          - interface is defined
          - interface is match('^GigaEthernet0/[1-9][0-9]*$')
          - (interface.split('/')[1] | int) >= 1
          - (interface.split('/')[1] | int) <= 10
        fail_msg: "Interface must be GigaEthernet0/1 to GigaEthernet0/10"

    - name: Validate Admin Status
      assert:
        that:
          - admin_status is defined
          - admin_status | lower in ['enable', 'disable']
        fail_msg: "admin_status must be enable or disable"

    - name: Validate TLV
      assert:
        that:
          - tlv is defined
          - tlv | lower in ['enable', 'disable']
        fail_msg: "tlv must be enable or disable"

    # ========================================================================
    # DIRECTORIES
    # ========================================================================

    - name: Create output directory
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Create script directory
      file:
        path: "{{ script_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # ========================================================================
    # CREATE SSH PYTHON SCRIPT
    # ========================================================================

    - name: Create LLDP Interface SET script
      copy:
        dest: "{{ script_file }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import sys

          # ------------------------------------------------------------------
          # CONNECTION DETAILS
          # ------------------------------------------------------------------

          HOST = "{{ ansible_host }}"
          PORT = 22

          USER = "{{ ansible_user }}"
          PASS = "{{ ansible_password }}"

          INTERFACE = "{{ interface }}"
          ADMIN_STATUS = "{{ admin_status | lower }}"
          TLV = "{{ tlv | lower }}"

          # ------------------------------------------------------------------
          # CONVERT INTERFACE
          # ------------------------------------------------------------------

          match = re.match(
              r'^GigaEthernet([0-9]+/[0-9]+)$',
              INTERFACE
          )

          if not match:
              print("Invalid interface format")
              sys.exit(1)

          CLI_INTERFACE = "GigaEthernet " + match.group(1)

          # ------------------------------------------------------------------
          # CLEAN OUTPUT
          # ------------------------------------------------------------------

          def clean_output(data):

              data = data.replace("\r", "")

              data = re.sub(
                  r'\x1b\[[0-9;?]*[A-Za-z]',
                  '',
                  data
              )

              return data

          # ------------------------------------------------------------------
          # READ FROM CHANNEL
          # ------------------------------------------------------------------

          def read_channel(channel, wait=0.3):

              time.sleep(wait)

              output = ""

              while channel.recv_ready():

                  try:

                      data = channel.recv(65535)

                      if not data:
                          break

                      output += data.decode(
                          "utf-8",
                          "ignore"
                      )

                  except Exception:
                      break

              return clean_output(output)

          # ------------------------------------------------------------------
          # WAIT FOR PROMPT
          # ------------------------------------------------------------------

          def wait_for_prompt(channel, timeout=10):

              end_time = time.time() + timeout
              output = ""

              while time.time() < end_time:

                  if channel.recv_ready():

                      data = channel.recv(65535)

                      if data:

                          output += data.decode(
                              "utf-8",
                              "ignore"
                          )

                          output = clean_output(output)

                          lines = [
                              x.strip()
                              for x in output.splitlines()
                              if x.strip()
                          ]

                          if lines:

                              last_line = lines[-1]

                              if re.search(
                                  r'username\s*:',
                                  last_line,
                                  re.IGNORECASE
                              ):
                                  return output

                              if re.search(
                                  r'password\s*:',
                                  last_line,
                                  re.IGNORECASE
                              ):
                                  return output

                              if (
                                  last_line.endswith(">") or
                                  last_line.endswith("#")
                              ):
                                  return output

                  time.sleep(0.2)

              raise Exception(
                  "Timeout waiting for switch prompt"
              )

          # ------------------------------------------------------------------
          # SEND COMMAND
          # ------------------------------------------------------------------

          def send_command(
              channel,
              command,
              wait=0.8
          ):

              channel.send(
                  command + "\n"
              )

              time.sleep(wait)

              return read_channel(
                  channel,
                  0.2
              )

          # ------------------------------------------------------------------
          # FAILURE
          # ------------------------------------------------------------------

          def fail(message):

              print(message)
              sys.exit(1)

          ssh = None

          try:

              # ==============================================================
              # SSH CONNECTION
              # ==============================================================

              ssh = paramiko.SSHClient()

              ssh.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              try:

                  ssh.connect(
                      HOST,
                      port=PORT,
                      username=USER,
                      password=PASS,
                      look_for_keys=False,
                      allow_agent=False,
                      timeout=10,
                      banner_timeout=10,
                      auth_timeout=10
                  )

              except paramiko.AuthenticationException:

                  fail(
                      "SSH authentication failed"
                  )

              except paramiko.SSHException as e:

                  fail(
                      "SSH connection failed: " + str(e)
                  )

              except Exception as e:

                  fail(
                      "SSH connection failed: " + str(e)
                  )

              # ==============================================================
              # OPEN INTERACTIVE SHELL
              # ==============================================================

              channel = ssh.invoke_shell(
                  width=200,
                  height=50
              )

              time.sleep(1)

              initial_output = read_channel(
                  channel,
                  1
              )

              # ==============================================================
              # WAIT FOR CLI PROMPT
              # ==============================================================

              try:

                  prompt_output = wait_for_prompt(
                      channel,
                      10
                  )

              except Exception:

                  prompt_output = initial_output

              # ==============================================================
              # HANDLE USER EXEC MODE
              # ==============================================================

              lines = [
                  x.strip()
                  for x in prompt_output.splitlines()
                  if x.strip()
              ]

              if lines:

                  last_line = lines[-1]

                  if last_line.endswith(">"):

                      enable_output = send_command(
                          channel,
                          "enable",
                          1
                      )

                      if re.search(
                          r'password\s*:',
                          enable_output,
                          re.IGNORECASE
                      ):

                          channel.send(
                              PASS + "\n"
                          )

                          time.sleep(1)

                          read_channel(
                              channel,
                              0.5
                          )

              # ==============================================================
              # DISABLE PAGINATION
              # ==============================================================

              send_command(
                  channel,
                  "terminal length 0",
                  0.5
              )

              # ==============================================================
              # ENTER CONFIGURATION MODE
              # ==============================================================

              config_output = send_command(
                  channel,
                  "config",
                  1
              )

              if re.search(
                  r'unknown command|invalid command|error',
                  config_output,
                  re.IGNORECASE
              ):

                  fail(
                      "Unable to enter configuration mode: "
                      + config_output.strip()
                  )

              # ==============================================================
              # ENTER INTERFACE CONFIGURATION
              # ==============================================================

              interface_output = send_command(
                  channel,
                  "interface " + CLI_INTERFACE,
                  1
              )

              if re.search(
                  r'unknown command|invalid command|error',
                  interface_output,
                  re.IGNORECASE
              ):

                  fail(
                      "Unable to enter interface "
                      + INTERFACE
                      + ": "
                      + interface_output.strip()
                  )

              # ==============================================================
              # LLDP RECEIVE
              # ==============================================================

              if ADMIN_STATUS == "enable":

                  receive_command = "lldp receive"

              else:

                  receive_command = "no lldp receive"

              receive_output = send_command(
                  channel,
                  receive_command,
                  0.8
              )

              if re.search(
                  r'unknown command|invalid command|error',
                  receive_output,
                  re.IGNORECASE
              ):

                  fail(
                      "LLDP receive command failed: "
                      + receive_output.strip()
                  )

              # ==============================================================
              # LLDP TRANSMIT
              # ==============================================================

              if TLV == "enable":

                  transmit_command = "lldp transmit"

              else:

                  transmit_command = "no lldp transmit"

              transmit_output = send_command(
                  channel,
                  transmit_command,
                  0.8
              )

              if re.search(
                  r'unknown command|invalid command|error',
                  transmit_output,
                  re.IGNORECASE
              ):

                  fail(
                      "LLDP transmit command failed: "
                      + transmit_output.strip()
                  )

              # ==============================================================
              # EXIT INTERFACE CONFIGURATION
              # ==============================================================

              send_command(
                  channel,
                  "exit",
                  0.8
              )

              # ==============================================================
              # EXIT CONFIGURATION MODE
              # ==============================================================

              send_command(
                  channel,
                  "exit",
                  0.8
              )

              # ==============================================================
              # VERIFY CONFIGURATION
              # ==============================================================

              verify_output = send_command(
                  channel,
                  "show lldp interface " + CLI_INTERFACE,
                  2
              )

              verify_lower = verify_output.lower()

              # ==============================================================
              # VERIFY RECEIVE
              # ==============================================================

              if ADMIN_STATUS == "enable":

                  if not re.search(
                      r'rx\s*:\s*enabled',
                      verify_lower
                  ):

                      fail(
                          "LLDP receive verification failed"
                      )

              else:

                  if not re.search(
                      r'rx\s*:\s*disabled',
                      verify_lower
                  ):

                      fail(
                          "LLDP receive disable verification failed"
                      )

              # ==============================================================
              # VERIFY TRANSMIT
              # ==============================================================

              if TLV == "enable":

                  if not re.search(
                      r'tx\s*:\s*enabled',
                      verify_lower
                  ):

                      fail(
                          "LLDP transmit verification failed"
                      )

              else:

                  if not re.search(
                      r'tx\s*:\s*disabled',
                      verify_lower
                  ):

                      fail(
                          "LLDP transmit disable verification failed"
                      )

              # ==============================================================
              # SUCCESS
              # ==============================================================

              print("SUCCESS")

          except Exception as e:

              fail(
                  str(e)
              )

          finally:

              if ssh is not None:

                  try:
                      ssh.close()
                  except Exception:
                      pass

    # ========================================================================
    # EXECUTE SCRIPT
    # ========================================================================

    - name: Execute LLDP Interface SET
      command:
        cmd: "python3 {{ script_file }}"
      register: result
      changed_when: false
      failed_when: false
      delegate_to: localhost

    # ========================================================================
    # SAVE SUCCESS OUTPUT
    # ========================================================================

    - name: Save SUCCESS output
      copy:
        dest: "{{ output_file }}"
        content: |
          IP: {{ ansible_host }}
          SUCCESS
      when: result.rc == 0
      delegate_to: localhost

    # ========================================================================
    # SAVE FAILURE OUTPUT
    # ========================================================================

    - name: Save FAILURE output
      copy:
        dest: "{{ output_file }}"
        content: |
          IP: {{ ansible_host }}
          FAILURE: {{ result.stdout | default('Unknown error') }}
      when: result.rc != 0
      delegate_to: localhost

    # ========================================================================
    # DISPLAY RESULT
    # ========================================================================

    - name: Display result
      debug:
        msg: >-
          {{
            'IP: ' ~ ansible_host ~ ' SUCCESS'
            if result.rc == 0
            else
            'IP: ' ~ ansible_host ~ ' FAILURE: ' ~
            (result.stdout | default('Unknown error'))
          }}

    - meta: end_play
```
