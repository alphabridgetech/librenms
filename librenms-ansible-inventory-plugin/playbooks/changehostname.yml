- name: Set hostname via SSH (Optimized)
  hosts: all
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/set_hostname_exec.py"

  tasks:

    - name: Copy optimized Python script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: '0755'
        content: |
          import paramiko
          import time

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          NEW_HOSTNAME = "{{ new_hostname }}"

          def send_cmd(shell, cmd, wait=0.5):
              shell.send(cmd + "\n")
              time.sleep(wait)

              output = ""
              while shell.recv_ready():
                  output += shell.recv(65535).decode('utf-8')
              return output

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=5
              )

              shell = ssh.invoke_shell()
              time.sleep(0.5)

              # Fast execution sequence
              send_cmd(shell, "enable", 0.3)
              send_cmd(shell, PASSWORD, 0.3)
              send_cmd(shell, "config", 0.3)
              send_cmd(shell, f"hostname {NEW_HOSTNAME}", 0.3)
              send_cmd(shell, "end", 0.3)
              send_cmd(shell, "write memory", 1)

              print("SUCCESS")

              ssh.close()

          except Exception as e:
              print("ERROR:", str(e))

    - name: Run script
      ansible.builtin.command: >
        /opt/librenms/librenms-ansible-inventory-plugin/bin/python3 {{ script_path }}
      register: output
      changed_when: true

    - name: Show output
      ansible.builtin.debug:
        msg: "{{ output.stdout }}"