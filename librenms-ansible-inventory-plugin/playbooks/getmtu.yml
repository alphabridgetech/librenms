---
- name: Get System MTU from network device (FAST)
  hosts: alphabridge_devices
  gather_facts: no
  strategy: free

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/get_mtu_exec.py"
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    venv_python: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Create optimized Python script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import re

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          def send_cmd(shell, cmd, wait=0.3):
              shell.send(cmd + "\n")
              time.sleep(wait)

              output = ""
              end_time = time.time() + 3

              while time.time() < end_time:
                  if shell.recv_ready():
                      output += shell.recv(65535).decode(errors="ignore")
                  else:
                      time.sleep(0.1)
              return output

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=5
              )

              shell = ssh.invoke_shell()
              time.sleep(0.5)

              # Clear buffer
              if shell.recv_ready():
                  shell.recv(65535)

              send_cmd(shell, "enable", 0.2)
              send_cmd(shell, PASSWORD, 0.2)

              output = send_cmd(shell, "show system mtu", 0.5)

              ssh.close()

              mtu = None
              for line in output.splitlines():
                  match = re.search(r'System MTU Jumbo size is (\d+)', line)
                  if match:
                      mtu = match.group(1)
                      break

              if mtu:
                  print(mtu)
              else:
                  print("ERROR")

          except Exception:
              print("ERROR")

    - name: Execute MTU script
      ansible.builtin.command:
        cmd: "{{ venv_python }} {{ script_path }}"
      register: mtu_output
      changed_when: false

    - name: Save MTU output
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_getmtu.yml"
        content: |
          ip: "{{ ansible_host }}"
          mtu: "{{ mtu_output.stdout | trim }}"
      when: mtu_output.stdout | trim != "ERROR"

    - name: Display MTU
      ansible.builtin.debug:
        msg: "MTU: {{ mtu_output.stdout | trim }}"