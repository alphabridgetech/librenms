---
- name: Get System MTU from network device
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/get_mtu_exec.py"
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    venv_python: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Create Python SSH MTU script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import re

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  port=22,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(2)

              if shell.recv_ready():
                  shell.recv(65535)

              shell.send("enable\n")
              time.sleep(1)
              shell.send(PASSWORD + "\n")
              time.sleep(1)

              if shell.recv_ready():
                  shell.recv(65535)

              shell.send("show system mtu\n")
              time.sleep(2)

              output = ""
              while shell.recv_ready():
                  output += shell.recv(65535).decode(errors="ignore")

              ssh.close()

              mtu = None
              for line in output.splitlines():
                  line = line.strip()

                  # Match: System MTU Jumbo size is 1900 bytes
                  match = re.search(r'System MTU Jumbo size is (\d+)', line)
                  if match:
                      mtu = match.group(1)
                      break

              if mtu:
                  print(mtu)
              else:
                  print("ERROR")

          except Exception as e:
              print("ERROR")

    - name: Execute MTU script
      ansible.builtin.command:
        cmd: "{{ venv_python }} {{ script_path }}"
      register: mtu_output
      changed_when: false

    - name: Save MTU output to YAML
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_getmtu.yml"
        content: |
          ip: "{{ ansible_host }}"
          mtu: "{{ mtu_output.stdout | trim }}"
      when: mtu_output.stdout | trim != "ERROR"

    - name: Display MTU
      ansible.builtin.debug:
        msg: "MTU: {{ mtu_output.stdout | trim }}"
