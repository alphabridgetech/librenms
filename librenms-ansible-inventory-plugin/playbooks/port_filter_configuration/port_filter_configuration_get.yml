# =============================================================================
# Playbook Name : Get Port Filter Interface Configuration
# =============================================================================
#
# Description:
# Reads `show running-config`, discovers physical Ethernet interfaces, and
# reports per-interface filter settings shown in the Port Filter Interface GUI:
# ARP, Source IP, BPDU, DHCP, ICMP, and ICMPv6.
# Example:
# ansible-playbook -i inventory/192.168.200.241.yml playbooks/port_config/Port_Filter_Configuration/port_filter_configuration_get.yml
# Output:
#   output/<switch_ip>_port_filter_configuration_get.yml
# =============================================================================

- name: Get Port Filter interface configuration
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    # Resolve paths from this checkout, including the Jenkins workspace.
    # This file lives in playbooks/port_filter_configuration/, so the plugin
    # root is two levels up.
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  pre_tasks:
    - name: Ensure script and output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

  tasks:
    # ==========================================
    # CREATE PYTHON SSH SCRIPT
    # ==========================================

    - name: Create Python SSH script for Port Filter interface get
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/port_filter_configuration_get_exec_{{ ansible_host }}.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import json
          import paramiko
          import re
          import time

          HOST = {{ ansible_host | to_json }}
          PORT = int({{ ansible_port | default(22) | to_json }})
          USER = {{ ansible_user | to_json }}
          PASSWORD = {{ ansible_password | to_json }}

          ANSI_RE = re.compile(r'\x1b(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*\Z')
          PAGER_RE = re.compile(
              r'--+\s*more\s*--+|----\s*more\s*----|'
              r'press\s+(?:any\s+key|space)\s+to\s+continue',
              re.IGNORECASE
          )
          CLI_ERROR_RE = re.compile(
              r'(?im)^\s*%\s*(?:invalid|error|incomplete|ambiguous|'
              r'unknown|unrecognized)\b|'
              r'\b(?:invalid input|unknown command|incomplete command|'
              r'command rejected|fail with ret\s*-?\d+)\b'
          )
          INTERFACE_RE = re.compile(
              r'^\s*interface\s+(TGigaEthernet|GigaEthernet|tg|g)(\d+/\d+)\s*$',
              re.IGNORECASE
          )

          FILTER_COMMANDS = {
              "filter arp": "filter_arp",
              "filter ip source-ip": "filter_source_ip",
              "filter bpdu": "filter_bpdu",
              "filter dhcp": "filter_dhcp",
              "filter icmp": "filter_icmp",
              "filter icmpv6": "filter_icmpv6"
          }


          # --------------------------------------------------------------
          # Read CLI output until the switch prompt returns.
          # --------------------------------------------------------------
          def read_until_prompt(shell, stage, timeout=60):
              output = ""
              deadline = time.monotonic() + timeout
              pager_count = 0

              while time.monotonic() < deadline:
                  if shell.recv_ready():
                      output += shell.recv(65535).decode(errors="ignore")
                      clean = ANSI_RE.sub("", output).replace("\r", "")
                      current_pager_count = len(PAGER_RE.findall(clean))
                      if current_pager_count > pager_count:
                          shell.send(" ")
                          pager_count = current_pager_count
                      if PROMPT_RE.search(clean.rstrip()):
                          return clean
                  else:
                      time.sleep(0.1)

              raise TimeoutError(
                  f"Timed out waiting for switch prompt during {stage}"
              )


          # --------------------------------------------------------------
          # Execute one CLI command and reject recognizable errors.
          # --------------------------------------------------------------
          def run_command(shell, command, stage, timeout=60):
              shell.send(command + "\n")
              output = read_until_prompt(shell, stage, timeout)
              if CLI_ERROR_RE.search(output):
                  raise RuntimeError(
                      f"Switch rejected {command!r}: {output.strip()}"
                  )
              return output


          # --------------------------------------------------------------
          # Format switch interface names like the GUI Port column.
          # --------------------------------------------------------------
          def normalize_port(prefix, slot_port):
              prefix = prefix.lower()
              if prefix in ("tgigaethernet", "tg"):
                  prefix = "tg"
              else:
                  prefix = "g"
              return f"{prefix}{slot_port}"


          # --------------------------------------------------------------
          # Parse filter settings from one physical interface block.
          # --------------------------------------------------------------
          def parse_interface_block(port, lines):
              settings = {
                  field: "Disable" for field in FILTER_COMMANDS.values()
              }

              for raw_line in lines:
                  command = raw_line.strip().lower()
                  if command in FILTER_COMMANDS:
                      settings[FILTER_COMMANDS[command]] = "Enable"
                  elif command.startswith("no ") and command[3:] in FILTER_COMMANDS:
                      settings[FILTER_COMMANDS[command[3:]]] = "Disable"

              return {"port": port, **settings}


          # --------------------------------------------------------------
          # Discover physical interfaces and parse their filter settings.
          # --------------------------------------------------------------
          def parse_port_filter_configuration(running_config):
              clean = ANSI_RE.sub("", running_config).replace("\r", "")
              if not any(
                  line.strip().lower() == "current configuration:"
                  for line in clean.splitlines()
              ):
                  raise ValueError(
                      "SHOW output did not contain 'Current configuration:'"
                  )

              interfaces = []
              current_port = None
              current_lines = []

              def save_current():
                  if current_port is not None:
                      interfaces.append(
                          parse_interface_block(current_port, current_lines)
                      )

              for line in clean.splitlines():
                  if line.strip().lower() == "current configuration:":
                      continue
                  if line.strip().lower().startswith("interface "):
                      save_current()
                      match = INTERFACE_RE.match(line)
                      if match:
                          prefix, slot_port = match.groups()
                          current_port = normalize_port(prefix, slot_port)
                          current_lines = []
                      else:
                          current_port = None
                          current_lines = []
                      continue

                  if current_port is not None:
                      if line.strip() == "!":
                          save_current()
                          current_port = None
                          current_lines = []
                      else:
                          current_lines.append(line)

              save_current()
              if not interfaces:
                  raise ValueError(
                      "No physical Ethernet interfaces were found in SHOW output"
                  )
              return interfaces


          shell = None
          ssh = None
          stage = "SSH connection"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST,
                  port=PORT,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=20,
                  auth_timeout=20,
                  banner_timeout=20
              )

              shell = ssh.invoke_shell()
              read_until_prompt(shell, "initial SSH prompt", timeout=10)

              stage = "enable mode"
              run_command(shell, "enable", stage, timeout=10)

              stage = "disable paging"
              run_command(shell, "terminal length 0", stage, timeout=10)

              stage = "show running-config"
              running_config = run_command(
                  shell, "show running-config", stage, timeout=90
              )

              stage = "parse Port Filter interface configuration"
              interfaces = parse_port_filter_configuration(running_config)

              print(json.dumps({
                  "ip": HOST,
                  "interfaces": interfaces,
                  "status": "success"
              }, indent=4))

          except Exception as exc:
              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "stage": stage,
                  "error": str(exc)
              }, indent=4))

          finally:
              if shell is not None:
                  shell.close()
              if ssh is not None:
                  ssh.close()
      no_log: true

    # ==========================================
    # EXECUTE PYTHON SCRIPT
    # ==========================================

    - name: Execute Port Filter interface get script
      ansible.builtin.command:
        argv:
          - "{{ project_root }}/bin/python3"   # plugin venv (has paramiko)
          - "{{ tmp_dir }}/port_filter_configuration_get_exec_{{ ansible_host }}.py"
      register: port_filter_configuration_raw
      changed_when: false
      failed_when: false

    # ==========================================
    # CONVERT JSON RESULT
    # ==========================================

    - name: Convert Port Filter interface result to JSON
      ansible.builtin.set_fact:
        port_filter_configuration_result: "{{ port_filter_configuration_raw.stdout | from_json }}"

    # ==========================================
    # DISPLAY RESULT
    # ==========================================

    - name: Display Port Filter interface result
      ansible.builtin.debug:
        var: port_filter_configuration_result

    # ==========================================
    # SAVE RESULT
    # ==========================================

    - name: Save Port Filter interface result
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_port_filter_configuration_get.yml"
        content: |
          {{ port_filter_configuration_result | to_nice_yaml }}

    # ==========================================
    # FAIL IF COMMAND FAILED
    # ==========================================

    - name: Fail if Port Filter interface get failed
      ansible.builtin.fail:
        msg: "{{ port_filter_configuration_result.error }}"
      when: port_filter_configuration_result.status == "failed"

    # ==========================================
    # FINAL MESSAGE
    # ==========================================

    - name: Display result file
      ansible.builtin.debug:
        msg: >
          Port Filter interface configuration retrieved from {{ ansible_host }}.
          Result saved to
          output/{{ ansible_host }}_port_filter_configuration_get.yml
