---
# ============================================================================
# File        : switchv1alphabridge/10g/getstaticroute.yml
# Feature     : Static Route Configuration - GET (Alphabridge V1, 10G)
#
# Picked automatically for a switch detected as switchv1alphabridge whose
# fastest physical port is 10G (App\Services\DeviceCapabilities), e.g.
# AS200/12/XF. Order tried (first that exists wins):
#   static_route_l3/<os>/<speed>/getstaticroute.yml   <- this file
#   static_route_l3/<os>/getstaticroute.yml
#   static_route_l3/getstaticroute.yml                 (common)
# V2 / V3 10G switches never get this file - give them their own
# switchv2alphabridge/10g/ (or switchv2alphabridge/) folder.
#
# Differences from the common playbook:
#   - project_root comes from the inventory (hosts/<ip>.yml), so the file
#     works at any folder depth
#   - its own tmp script (getstaticroute_v1_10g.py), so it never overwrites
#     the common script while both run
#   - 180s to read the running config (the 10G config is longer)
#   - writes playbook_variant: switchv1alphabridge/10g into the output file
#
# Put any V1-10G-only CLI changes in this file; the output format must stay
# the same as the common playbook's.
#
# Supported route formats:
#
# 1. Gateway IP:
#    ip route <destination> <mask> <gateway> <distance> tag <tag>
#             description <description>
#
# 2. Null0:
#    ip route <destination> <mask> Null0 <forwarding-address>
#             <distance> tag <tag> description <description>
#
# 3. VLAN:
#    ip route <destination> <mask> vlan<vlan-id> <forwarding-address>
#             <distance> tag <tag> description <description>
#
# 4. Default route:
#    ip route default <next-hop/interface> <gateway> <distance>
#             tag <tag> description <description>
#
# ============================================================================

- name: Static Route Configuration - GET
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    project_root: "{{ inventory_dir }}/.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:

    # ========================================================================
    # Create required directories
    # ========================================================================

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ output_dir }}"
        - "{{ tmp_dir }}"
      delegate_to: localhost

    # ========================================================================
    # Create Static Route GET script
    # ========================================================================

    - name: Create Static Route GET script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/getstaticroute_v1_10g.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import sys
          import yaml

          # ==================================================================
          # Device information
          # ==================================================================

          host = "{{ ansible_host }}"
          username = "{{ ansible_user }}"
          password = "{{ ansible_password }}"

          output_file = (
              "{{ output_dir }}/"
              "{{ ansible_host }}_staticroute.yml"
          )

          # ==================================================================
          # Helper functions
          # ==================================================================

          def is_ipv4(value):

              pattern = re.compile(
                  r"^(?:\d{1,3}\.){3}\d{1,3}$"
              )

              if not pattern.match(value):
                  return False

              try:

                  octets = value.split(".")

                  return all(
                      0 <= int(octet) <= 255
                      for octet in octets
                  )

              except ValueError:

                  return False


          def is_interface(value):

              pattern = re.compile(
                  r"^(?:"
                  r"Null0|"
                  r"VLAN\d+|"
                  r"vlan\d+|"
                  r"GigaEthernet\d+/\d+|"
                  r"TGigaEthernet\d+/\d+|"
                  r"Port-aggregator\d+|"
                  r"[gtp]\d+/\d+"
                  r")$",
                  re.IGNORECASE
              )

              return bool(pattern.match(value))


          def is_distance(value):

              return value.isdigit()


          # ==================================================================
          # Main
          # ==================================================================

          try:

              # ==============================================================
              # SSH CONNECTION
              # ==============================================================

              client = paramiko.SSHClient()

              client.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              client.connect(
                  hostname=host,
                  username=username,
                  password=password,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=15,
                  banner_timeout=15,
                  auth_timeout=15
              )

              # ==============================================================
              # INTERACTIVE SHELL
              # ==============================================================

              shell = client.invoke_shell()

              time.sleep(1)

              if shell.recv_ready():
                  shell.recv(65535)

              # ==============================================================
              # ENABLE
              # ==============================================================

              shell.send("enable\n")

              time.sleep(1)

              while shell.recv_ready():
                  shell.recv(65535)

              # ==============================================================
              # CONFIG
              # ==============================================================

              shell.send("config\n")

              time.sleep(1)

              while shell.recv_ready():
                  shell.recv(65535)

              # ==============================================================
              # SHOW RUNNING CONFIG
              # ==============================================================

              shell.send("show running-config\n")

              output = ""

              end_time = time.time() + 180

              while time.time() < end_time:

                  if shell.recv_ready():

                      data = shell.recv(
                          65535
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      output += data

                      # ------------------------------------------------------
                      # Pagination
                      # ------------------------------------------------------

                      if "--More--" in output:

                          shell.send(" ")

                          output = output.replace(
                              "--More--",
                              ""
                          )

                          time.sleep(0.5)

                          continue

                      # ------------------------------------------------------
                      # Detect common configuration prompt
                      # ------------------------------------------------------

                      if re.search(
                          r"[>#]\s*$",
                          output.rstrip()
                      ):

                          time.sleep(0.5)

                          while shell.recv_ready():

                              extra = shell.recv(
                                  65535
                              ).decode(
                                  "utf-8",
                                  errors="ignore"
                              )

                              output += extra

                              if "--More--" in output:

                                  shell.send(" ")

                                  output = output.replace(
                                      "--More--",
                                      ""
                                  )

                                  time.sleep(0.5)

                          break

                  else:

                      time.sleep(0.2)

              client.close()

              # ==============================================================
              # Clean output
              # ==============================================================

              output = output.replace(
                  "\r",
                  ""
              )

              output = output.replace(
                  "--More--",
                  ""
              )

              # ==============================================================
              # ROUTE LIST
              # ==============================================================

              static_routes = []

              # ==============================================================
              # PARSE EVERY IP ROUTE LINE
              # ==============================================================

              for raw_line in output.splitlines():

                  line = raw_line.strip()

                  if not line:
                      continue

                  # ----------------------------------------------------------
                  # Only process actual ip route commands
                  # ----------------------------------------------------------

                  match = re.match(
                      r"^ip\s+route\s+(.+)$",
                      line,
                      re.IGNORECASE
                  )

                  if not match:
                      continue

                  route_text = match.group(1).strip()

                  parts = route_text.split()

                  if not parts:
                      continue

                  # ==========================================================
                  # Initialize fields
                  # ==========================================================

                  default_route = False

                  destination_ip = None
                  destination_mask = None

                  interface = None

                  forwarding_address = None

                  distance_metric = None

                  routing_tag = None

                  description = None

                  # ==========================================================
                  # DEFAULT ROUTE
                  # ==========================================================

                  if parts[0].lower() == "default":

                      default_route = True

                      index = 1

                      # ------------------------------------------------------
                      # Parse next-hop/interface information
                      # ------------------------------------------------------

                      while index < len(parts):

                          value = parts[index]

                          if value.lower() == "tag":
                              break

                          if value.lower() == "description":
                              break

                          if is_interface(value):

                              interface = value

                          elif is_ipv4(value):

                              forwarding_address = value

                          elif is_distance(value):

                              distance_metric = int(value)

                          index += 1

                  # ==========================================================
                  # NON-DEFAULT ROUTE
                  # ==========================================================

                  else:

                      default_route = False

                      # ------------------------------------------------------
                      # Destination IP
                      # ------------------------------------------------------

                      destination_ip = parts[0]

                      # ------------------------------------------------------
                      # Destination mask
                      # ------------------------------------------------------

                      if (
                          len(parts) > 1
                          and is_ipv4(parts[1])
                      ):

                          destination_mask = parts[1]

                      # ------------------------------------------------------
                      # Remaining route parameters
                      #
                      # Supported:
                      #
                      # Gateway:
                      #   192.168.14.1 5
                      #
                      # Null0:
                      #   Null0 192.168.14.1 5
                      #
                      # VLAN:
                      #   vlan82 192.168.82.1 5
                      # ------------------------------------------------------

                      remaining_start = 2

                      for index in range(
                          remaining_start,
                          len(parts)
                      ):

                          value = parts[index]

                          # Stop at tag
                          if value.lower() == "tag":
                              break

                          # Stop at description
                          if value.lower() == "description":
                              break

                          # --------------------------------------------------
                          # Interface
                          # --------------------------------------------------

                          if is_interface(value):

                              interface = value

                              continue

                          # --------------------------------------------------
                          # IPv4 address
                          #
                          # This is important for gateway routes.
                          #
                          # Example:
                          #
                          # ip route 172.16.10.0 255.255.255.0
                          #          192.168.14.1 5 tag 20
                          #
                          # 192.168.14.1 must become forwarding address.
                          # --------------------------------------------------

                          if is_ipv4(value):

                              if forwarding_address is None:

                                  forwarding_address = value

                              continue

                          # --------------------------------------------------
                          # Distance metric
                          # --------------------------------------------------

                          if is_distance(value):

                              if distance_metric is None:

                                  distance_metric = int(value)

                              continue

                  # ==========================================================
                  # TAG
                  # ==========================================================

                  for index, value in enumerate(parts):

                      if value.lower() == "tag":

                          if index + 1 < len(parts):

                              if parts[index + 1].isdigit():

                                  routing_tag = int(
                                      parts[index + 1]
                                  )

                          break

                  # ==========================================================
                  # DESCRIPTION
                  # ==========================================================

                  for index, value in enumerate(parts):

                      if value.lower() == "description":

                          if index + 1 < len(parts):

                              description = " ".join(
                                  parts[index + 1:]
                              )

                          break

                  # ==========================================================
                  # FINAL DEFAULT ROUTE LOGIC
                  # ==========================================================

                  if (
                      destination_ip is None
                      and destination_mask is None
                  ):

                      default_route = True

                  else:

                      default_route = False

                  # ==========================================================
                  # BUILD ROUTE
                  # ==========================================================

                  route = {

                      "default_route":
                          default_route,

                      "destination_ip":
                          destination_ip,

                      "destination_ip_mask":
                          destination_mask,

                      "interface":
                          interface,

                      "forwarding_routing_address":
                          forwarding_address,

                      "distance_metric":
                          distance_metric,

                      "routing_tag":
                          routing_tag,

                      "route_description":
                          description
                  }

                  static_routes.append(route)

              # ==============================================================
              # REMOVE DUPLICATES
              # ==============================================================

              unique_routes = []

              for route in static_routes:

                  if route not in unique_routes:

                      unique_routes.append(route)

              # ==============================================================
              # RESULT
              # ==============================================================

              result = {

                  "status": "SUCCESS",

                  "device_ip": host,

                  "playbook_variant": "switchv1alphabridge/10g",

                  "static_routes": unique_routes
              }

              # ==============================================================
              # WRITE YAML
              # ==============================================================

              with open(
                  output_file,
                  "w"
              ) as f:

                  yaml.dump(
                      result,
                      f,
                      default_flow_style=False,
                      sort_keys=False,
                      allow_unicode=True
                  )

              print("GET SUCCESS")

          except Exception as e:

              print(
                  "ERROR:",
                  str(e)
              )

              with open(
                  output_file,
                  "w"
              ) as f:

                  yaml.dump(
                      {
                          "status": "ERROR",
                          "device_ip": host,
                          "static_routes": []
                      },
                      f,
                      default_flow_style=False,
                      sort_keys=False
                  )

              sys.exit(1)

    # ========================================================================
    # Execute GET script
    # ========================================================================

    - name: Get Static Route configuration
      ansible.builtin.command:
        cmd: "python3 {{ tmp_dir }}/getstaticroute_v1_10g.py"
      delegate_to: localhost
      register: static_route_get_result
      changed_when: false

    # ========================================================================
    # Show result
    # ========================================================================

    - name: Show Static Route configuration
      ansible.builtin.debug:
        msg: >-
          {{
            lookup(
              'file',
              output_dir + '/' +
              ansible_host +
              '_staticroute.yml'
            )
          }}
