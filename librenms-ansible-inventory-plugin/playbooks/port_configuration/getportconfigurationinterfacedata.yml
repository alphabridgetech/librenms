# ============================================================================
# File        : getportconfigurationinterfacedata.yml
# Feature     : Port Configuration - Interface GET
#
# Purpose     :
#   Get port/interface configuration from the switch.
#
# Status Logic:
#   shutdown      -> Disable
#   no shutdown   -> Enable
#   absent        -> Enable
#
# Other Parameters:
#   Speed
#   Duplex
#   Flow Control
#   Medium
#
#   These parameters are obtained from "show interface".
#
# Transport:
#   Plain paramiko SSH (matches every other playbook in this project -
#   no extra Python packages like pexpect/PyYAML need to be installed
#   into the venv). Output is serialized by Ansible's own to_nice_yaml
#   filter, not Python's yaml module.
#
# Output:
#   /opt/librenms/librenms-ansible-inventory-plugin/output/<device-ip>_port_configuration.yml
# ============================================================================

---
- name: Get Port Configuration Interface Data
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    script_dir: "/opt/librenms/librenms-ansible-inventory-plugin/tmp"
    script_file: "{{ script_dir }}/get_port_configuration.py"
    venv_python: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    # ========================================================================
    # Create directories
    # ========================================================================

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Create script directory
      ansible.builtin.file:
        path: "{{ script_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # ========================================================================
    # Create Python GET script
    # ========================================================================

    - name: Create Python GET script
      ansible.builtin.copy:
        dest: "{{ script_file }}"
        mode: "0755"
        content: |
          import paramiko
          import re
          import json
          import sys
          import time

          # ==================================================================
          # Device information
          # ==================================================================

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          # ==================================================================
          # Read shell output until it goes idle (no data for ~1 second)
          # ==================================================================

          def read_output(shell, timeout=20):

              buffer = ""
              end_time = time.time() + timeout
              last_data_time = time.time()

              while time.time() < end_time:

                  if shell.recv_ready():

                      data = shell.recv(65535).decode(errors="ignore")
                      buffer += data
                      last_data_time = time.time()

                  else:

                      if buffer and (time.time() - last_data_time) >= 1.0:
                          break

                      time.sleep(0.1)

              return buffer.replace("\r", "")

          def send_command(shell, command, timeout=20):

              while shell.recv_ready():
                  shell.recv(65535)

              shell.send(command + "\n")

              return read_output(shell, timeout)

          # ==================================================================
          # Get interface status from running configuration
          #
          # shutdown     -> Disable
          # no shutdown  -> Enable
          # nothing      -> Enable
          # ==================================================================

          def get_interface_status(config_text):

              for line in config_text.splitlines():

                  stripped = line.strip()

                  if stripped == "shutdown":
                      return "Disable"

                  if stripped == "no shutdown":
                      return "Enable"

              return "Enable"

          # ==================================================================
          # Parse physical interfaces from SHOW INTERFACE
          # ==================================================================

          def parse_interfaces(show_output):

              interfaces = {}

              header_pattern = re.compile(
                  r'^(GigaEthernet\d+/\d+|TGigaEthernet\d+/\d+)'
                  r'\s+is\s+(.+)$',
                  re.MULTILINE
              )

              matches = list(header_pattern.finditer(show_output))

              for index, match in enumerate(matches):

                  interface_name = match.group(1)
                  start = match.start()

                  if index + 1 < len(matches):
                      end = matches[index + 1].start()
                  else:
                      end = len(show_output)

                  block = show_output[start:end]

                  # ==========================================================
                  # SPEED
                  # ==========================================================

                  speed = "Auto"

                  speed_match = re.search(
                      r'Auto-Speed\((\d+)Mb/s\)',
                      block,
                      re.IGNORECASE
                  )

                  speed_map = {
                      "10000": "10G",
                      "1000": "1000M",
                      "100": "100M",
                      "10": "10M",
                  }

                  if speed_match:
                      speed = speed_map.get(speed_match.group(1), "Auto")
                  else:
                      fixed_speed_match = re.search(
                          r'(?:^|,|\s)(10|100|1000|10000)Mb/s',
                          block,
                          re.IGNORECASE
                      )
                      if fixed_speed_match:
                          speed = speed_map.get(fixed_speed_match.group(1), "Auto")

                  # ==========================================================
                  # DUPLEX
                  # ==========================================================

                  duplex = "Auto"

                  if re.search(r'Auto-Duplex', block, re.IGNORECASE):
                      duplex = "Auto"
                  elif re.search(r'Full-duplex', block, re.IGNORECASE):
                      duplex = "Full"
                  elif re.search(r'Half-duplex', block, re.IGNORECASE):
                      duplex = "Half"

                  # ==========================================================
                  # FLOW CONTROL
                  # ==========================================================

                  flow_control = "Auto"

                  flow_match = re.search(
                      r'Flow-Control\s+([A-Za-z]+)',
                      block,
                      re.IGNORECASE
                  )

                  if flow_match:
                      value = flow_match.group(1).lower()
                      if value == "on":
                          flow_control = "On"
                      elif value == "off":
                          flow_control = "Off"
                      elif value == "auto":
                          flow_control = "Auto"

                  # ==========================================================
                  # MEDIUM
                  #
                  # Derived from hardware information.
                  #
                  # Giga-TX / copper hardware -> Copper
                  # LX / FX / SFP              -> Fiber
                  # ==========================================================

                  medium = "Auto"

                  hardware_match = re.search(
                      r'Hardware is\s+([^\r\n]+)',
                      block,
                      re.IGNORECASE
                  )

                  if hardware_match:
                      hardware = hardware_match.group(1)

                      if re.search(
                          r'Giga-TX|100BASE-TX|1000BASE-T|'
                          r'10BASE-T|10/100/1000',
                          hardware,
                          re.IGNORECASE
                      ):
                          medium = "Copper"

                      elif re.search(
                          r'LX|FX|SFP|Fiber|1000BASE-X|10Giga-FX',
                          hardware,
                          re.IGNORECASE
                      ):
                          medium = "Fiber"

                  # ==========================================================
                  # FIBER AUTO
                  #
                  # show interface does not reliably expose this setting.
                  # Therefore it is not inferred.
                  # ==========================================================

                  fiber_auto = "Auto"

                  interfaces[interface_name] = {
                      "speed": speed,
                      "duplex": duplex,
                      "flow_control": flow_control,
                      "medium": medium,
                      "fiber_auto": fiber_auto,
                  }

              return interfaces

          # ==================================================================
          # Extract individual interface blocks from running configuration
          # ==================================================================

          def parse_running_config(config_text):

              interface_configs = {}

              pattern = re.compile(
                  r'^\s*interface\s+'
                  r'(GigaEthernet\d+/\d+|TGigaEthernet\d+/\d+)'
                  r'\s*$'
                  r'(.*?)'
                  r'(?=^\s*interface\s+'
                  r'(?:GigaEthernet\d+/\d+|TGigaEthernet\d+/\d+)'
                  r'\s*$|\Z)',
                  re.MULTILINE | re.DOTALL
              )

              for match in pattern.finditer(config_text):
                  interface_configs[match.group(1)] = match.group(2)

              return interface_configs

          # ==================================================================
          # MAIN
          # ==================================================================

          try:

              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(1)

              while shell.recv_ready():
                  shell.recv(65535)

              # ==============================================================
              # Enter enable mode
              #
              # Always attempt "enable" regardless of the device's initial
              # prompt text - some prompts report the device's own hostname
              # (e.g. "AS212XTS_>") rather than a fixed string, so checking
              # for one hardcoded prompt string is unreliable. Sending
              # "enable" while already privileged is harmless.
              # ==============================================================

              enable_output = send_command(shell, "enable", timeout=5)

              if re.search(r'assword', enable_output):
                  send_command(shell, PASSWORD, timeout=5)

              # ==============================================================
              # DISABLE PAGING
              # ==============================================================

              send_command(shell, "terminal length 0", timeout=5)

              # ==============================================================
              # GET SHOW INTERFACE
              #
              # Speed / Duplex / Flow-Control / Hardware are obtained
              # from this command.
              # ==============================================================

              show_interface = send_command(shell, "show interface", timeout=20)

              interface_data = parse_interfaces(show_interface)

              if not interface_data:
                  raise Exception(
                      "No physical interfaces found in show interface output."
                  )

              # ==============================================================
              # GET RUNNING CONFIGURATION
              #
              # Used only to derive interface status (shutdown/no shutdown).
              # We do not enter config mode for this.
              # ==============================================================

              running_config = send_command(shell, "show running-config", timeout=20)

              config_interfaces = parse_running_config(running_config)

              for interface_name in interface_data:
                  interface_config = config_interfaces.get(interface_name, "")
                  interface_data[interface_name]["status"] = get_interface_status(
                      interface_config
                  )

              ssh.close()

              # ==============================================================
              # Arrange output in UI order
              # ==============================================================

              final_data = {}

              for interface_name, data in interface_data.items():
                  final_data[interface_name] = {
                      "status": data["status"],
                      "speed": data["speed"],
                      "duplex": data["duplex"],
                      "flow_control": data["flow_control"],
                      "medium": data["medium"],
                      "fiber_auto": data["fiber_auto"],
                  }

              print(json.dumps(final_data))
              sys.exit(0)

          except Exception as error:
              print(json.dumps({"error": str(error)}))
              sys.exit(1)

    # ========================================================================
    # Execute GET
    # ========================================================================

    - name: Execute Port Configuration GET
      ansible.builtin.command:
        cmd: "{{ venv_python }} {{ script_file }}"
      register: port_get_result
      changed_when: false
      failed_when: false

    - name: Convert JSON
      ansible.builtin.set_fact:
        port_json: "{{ port_get_result.stdout | from_json }}"

    - name: Fail if collection failed
      ansible.builtin.fail:
        msg: "{{ port_json.error | default('Unknown error') }}"
      when: port_get_result.rc != 0 or (port_json.error is defined)

    # ========================================================================
    # Save output
    # ========================================================================

    - name: Save Port Configuration output
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_port_configuration.yml"
        mode: "0644"
        content: "{{ port_json | to_nice_yaml(indent=4, sort_keys=false) }}"
      delegate_to: localhost

    # ========================================================================
    # Display result
    # ========================================================================

    - name: Display result
      ansible.builtin.debug:
        msg: "SUCCESS"
