---
- name: Set LLDP configuration via SSH
  hosts: all
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/set_lldp_exec.py"
    venv_python: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Copy LLDP Python script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          PROTOCOL_STATE = "{{ protocol_state }}"
          HOLDTIME = "{{ holdtime }}"
          TIMER = "{{ timer }}"
          REINIT = "{{ reinit }}"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(2)

              if shell.recv_ready():
                  shell.recv(65535)

              shell.send("enable\n")
              time.sleep(1)
              shell.send(PASSWORD + "\n")
              time.sleep(1)

              shell.send("config\n")
              time.sleep(1)

              if PROTOCOL_STATE == "open":
                  shell.send("lldp run\n")
                  time.sleep(1)
                  shell.send(f"lldp holdtime {HOLDTIME}\n")
                  time.sleep(0.5)
                  shell.send(f"lldp timer {TIMER}\n")
                  time.sleep(0.5)
                  shell.send(f"lldp reinit {REINIT}\n")
              else:
                  shell.send("no lldp run\n")

              time.sleep(1)
              shell.send("end\n")
              time.sleep(1)
              shell.send("write memory\n")
              time.sleep(2)

              ssh.close()
              print("SUCCESS")

          except Exception as e:
              print("ERROR")
              print(e)

    - name: Run LLDP SET script
      ansible.builtin.command:
        cmd: "{{ venv_python }} {{ script_path }}"
      register: lldp_result
      changed_when: false
      failed_when: "'ERROR' in lldp_result.stdout"

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ lldp_result.stdout }}"
