# =============================================================================
# Playbook Name : DHCP Snooping Interface Configuration (Get)
# =============================================================================
# Command: show running-config
# Reads physical interface blocks. A trust command means Trust; absent means
# Distrust. Logical interfaces (VLAN, Null, port aggregators, etc.) are excluded.
# Example:
# ansible-playbook -i inventory/192.168.2.245.yml \
#   playbooks/dhcp_interface_config_get.yml 
#
# Output: output/<switch_ip>_dhcp_interface_config_get.yml
# =============================================================================

- name: Get DHCP snooping interface configuration
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  pre_tasks:
    - name: Ensure helper and output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

  tasks:
    - name: Create DHCP interface configuration getter
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/dhcp_interface_config_get_exec.py"
        mode: '0700'
        content: |
          #!/usr/bin/env python3
          import json
          import os
          import re
          import sys
          import time

          import paramiko

          HOST = os.environ["SWITCH_HOST"]
          USER = os.environ["SWITCH_USER"]
          PASSWORD = os.environ["SWITCH_PASSWORD"]

          ANSI_RE = re.compile(r'\x1b(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'(?m)^[^\r\n\s]+[>#]\s*\Z')
          ERROR_RE = re.compile(
              r'(?im)^\s*(?:%\s*(?:err(?:or)?|invalid|unknown|unrecognized|'
              r'incomplete)\b|error:|invalid (?:input|command)|unknown command)'
          )
          INTERFACE_RE = re.compile(r'^interface\s+(.+?)\s*$', re.I)

          # Exclude logical interfaces; do not restrict physical interface names
          # to g0/1-g0/10 or any other fixed interface list.
          LOGICAL_RE = re.compile(
              r'^(?:null|vlan|port-aggregator|port-channel|loopback|tunnel|'
              r'management|mgmt|bdi|nve)(?=\d|/|\b)', re.I
          )

          TRUST_COMMANDS = (
              ('DHCP Trust Port', 'dhcp snooping trust'),
              ('ARP Inspection Trust Port', 'arp inspection trust'),
              ('IP Source Trust Port', 'ip-source trust'),
          )

          # ==========================================
          # READ UNTIL SWITCH PROMPT
          # ==========================================

          def read_until_prompt(shell, timeout=60):
              output = ''
              deadline = time.monotonic() + timeout

              while time.monotonic() < deadline:
                  if shell.recv_ready():
                      output += shell.recv(65535).decode(
                          'utf-8', errors='replace'
                      )
                      clean = ANSI_RE.sub('', output).replace('\r', '')

                      if PROMPT_RE.search(clean):
                          return clean
                  else:
                      time.sleep(0.1)

              raise TimeoutError(
                  'Timed out waiting for the switch prompt; output may be incomplete'
              )

          # ==========================================
          # EXECUTE CLI COMMAND
          # ==========================================

          def command(shell, text, timeout=60):
              shell.send(text + '\n')
              output = read_until_prompt(shell, timeout)

              if ERROR_RE.search(output):
                  raise RuntimeError(
                      'Switch rejected command: ' + text
                  )

              return output

          # ==========================================
          # CONVERT INTERFACE NAME TO GUI FORMAT
          #
          # GigaEthernet0/1  -> g0/1
          # TGigaEthernet0/1 -> tg0/1
          # ==========================================

          def display_port(name):

              short = re.fullmatch(
                  r'GigaEthernet(\d+/\d+(?:/\d+)?)',
                  name,
                  re.I
              )

              if short:
                  return 'g' + short.group(1)

              short = re.fullmatch(
                  r'TGigaEthernet(\d+/\d+(?:/\d+)?)',
                  name,
                  re.I
              )

              if short:
                  return 'tg' + short.group(1)

              return name

          # ==========================================
          # PARSE RUNNING CONFIGURATION
          # ==========================================

          def parse_config(output):

              if not re.search(
                  r'(?m)^Current configuration:\s*$',
                  output
              ):
                  raise ValueError(
                      'Unrecognized or incomplete show running-config output'
                  )

              ports = []
              current = None

              for raw_line in output.splitlines():

                  line = raw_line.strip()

                  match = INTERFACE_RE.fullmatch(line)

                  # ==================================
                  # NEW INTERFACE BLOCK
                  # ==================================

                  if match:

                      interface_name = match.group(1)

                      # Skip logical interfaces.
                      if LOGICAL_RE.match(interface_name):
                          current = None
                          continue

                      # Default all three fields to Distrust.
                      current = {
                          'Port': display_port(interface_name)
                      }

                      for field, _ in TRUST_COMMANDS:
                          current[field] = 'Distrust'

                      ports.append(current)
                      continue

                  # ==================================
                  # END OF INTERFACE BLOCK
                  # ==================================

                  if line == '!' or line.lower() == 'exit':
                      current = None
                      continue

                  # ==================================
                  # CHECK TRUST COMMANDS
                  # ==================================

                  if current is not None:

                      for field, trust_command in TRUST_COMMANDS:

                          # Command present = Trust
                          if line == trust_command:
                              current[field] = 'Trust'

                          # Explicit no command = Distrust
                          elif line == 'no ' + trust_command:
                              current[field] = 'Distrust'

              # ==================================
              # VALIDATE RESULTS
              # ==================================

              if not ports:
                  raise ValueError(
                      'No physical interface blocks found in running-config'
                  )

              return ports

          # ==========================================
          # SSH INITIALIZATION
          # ==========================================

          ssh = None
          shell = None

          try:

              ssh = paramiko.SSHClient()

              ssh.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              # ==================================
              # SSH CONNECTION
              # ==================================

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10,
                  auth_timeout=10,
                  banner_timeout=10
              )

              shell = ssh.invoke_shell()

              # ==================================
              # INITIAL PROMPT
              # ==================================

              first_prompt = read_until_prompt(
                  shell,
                  timeout=10
              )

              # ==================================
              # ENABLE MODE
              # ==================================

              if first_prompt.rstrip().endswith('>'):

                  enabled = command(
                      shell,
                      'enable',
                      timeout=10
                  )

                  if not enabled.rstrip().endswith('#'):
                      raise RuntimeError(
                          'Failed to enter privileged EXEC mode'
                      )

              elif not first_prompt.rstrip().endswith('#'):

                  raise RuntimeError(
                      'Unrecognized switch prompt'
                  )

              # ==================================
              # DISABLE PAGING
              # ==================================

              command(
                  shell,
                  'terminal length 0',
                  timeout=10
              )

              # ==================================
              # SHOW RUNNING CONFIG
              # ==================================

              config = command(
                  shell,
                  'show running-config',
                  timeout=60
              )

              # ==================================
              # PARSE AND RETURN JSON
              # ==================================

              print(json.dumps({
                  'ip': HOST,
                  'interfaces': parse_config(config),
                  'status': 'success'
              }))

          # ==========================================
          # EXCEPTION HANDLING
          # ==========================================

          except Exception as exc:

              print(json.dumps({
                  'ip': HOST,
                  'status': 'failed',
                  'error': str(exc)
              }))

              sys.exit(1)

          # ==========================================
          # CLOSE SSH
          # ==========================================

          finally:

              if shell is not None:
                  shell.close()

              if ssh is not None:
                  ssh.close()

    # ==========================================
    # EXECUTE PYTHON SCRIPT
    # ==========================================

    - name: Execute DHCP interface configuration getter
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../bin/python3"
          - "{{ tmp_dir }}/dhcp_interface_config_get_exec.py"
      environment:
        SWITCH_HOST: "{{ ansible_host }}"
        SWITCH_USER: "{{ ansible_user }}"
        SWITCH_PASSWORD: "{{ ansible_password }}"
      register: dhcp_raw
      changed_when: false
      failed_when: false
      no_log: true

    # ==========================================
    # CHECK PYTHON OUTPUT
    # ==========================================

    - name: Check helper returned data
      ansible.builtin.assert:
        that:
          - dhcp_raw.stdout | trim | length > 0
        fail_msg: >-
          DHCP interface getter returned empty output.
          Verify the Python interpreter, Paramiko installation
          and SSH connectivity securely.

    # ==========================================
    # CONVERT JSON RESULT
    # ==========================================

    - name: Parse helper JSON
      ansible.builtin.set_fact:
        dhcp_result: "{{ dhcp_raw.stdout | from_json }}"

    # ==========================================
    # FAIL IF COMMAND FAILED
    # ==========================================

    - name: Fail on unsuccessful retrieval
      ansible.builtin.fail:
        msg: "{{ dhcp_result.error | default('Helper exited with nonzero status') }}"
      when: dhcp_raw.rc != 0 or dhcp_result.status != 'success'

    # ==========================================
    # DISPLAY RESULT
    # ==========================================

    - name: Display DHCP interface configuration
      ansible.builtin.debug:
        var: dhcp_result

    # ==========================================
    # SAVE RESULT
    # ==========================================

    - name: Save DHCP interface configuration
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_dhcp_interface_config_get.yml"
        mode: '0644'
        content: "{{ dhcp_result | to_nice_yaml(sort_keys=False) }}\n"

    # ==========================================
    # FINAL MESSAGE
    # ==========================================

    - name: Show report location
      ansible.builtin.debug:
        msg: "Saved output/{{ ansible_host }}_dhcp_interface_config_get.yml"
