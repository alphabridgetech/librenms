# =============================================================================
# Playbook Name : Delete Port List Entry
# =============================================================================
# Description:
# This playbook removes a port list entry from the AlphaBridge switch.
# The playbook first verifies that the ARP entry exists before deleting it.
#
# CLI Command:
#   no ip source binding mac address ip address vlan <id>
#
# Example:
# ansible-playbook \
# -i inventory/192.168.2.245.yml \
# playbooks/dhcp_port_list_delete.yml \
# -e "ip_address=192.168.2.100 mac_address=f4:ee:08:ea:ea:1c vlan_id=200"
#
# Output:
# output/<switch_ip>_dhcp_port_list_delete.yml
# =============================================================================

- name: Delete Port List Entry on network device
  hosts: alphabridge_devices
  gather_facts: false

  tasks:

    # ==========================================
    # Validate IP Address
    # ==========================================

    - name: Validate IP Address
      ansible.builtin.assert:
        that:
          - ip_address is defined
          - ip_address is ansible.utils.ipv4
        fail_msg: "Invalid IPv4 address: {{ ip_address }}"

    # ==========================================
    # Validate VLAN ID
    # ==========================================
    - name: Validate VLAN ID
      ansible.builtin.assert:
        that:
          - vlan_id is defined
          - vlan_id | int >= 1
          - vlan_id | int <= 4094
        fail_msg: "vlan_id must be between 1 and 4094"

    # ==========================================
    # Create Python SSH Script
    # ==========================================

    - name: Create Python SSH Script for PORT List deletion
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/dhcp_port_list_delete_exec.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import json

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          IP_ADDRESS = "{{ ip_address }}"
          VLAN_ID = "{{ vlan_id }}"
          MAC_ADDRESS = "{{ mac_address }}"

          def read_until_prompt(shell, prompt_regex, timeout=10):

              buf = ""
              end_time = time.time() + timeout

              while time.time() < end_time:

                  if shell.recv_ready():

                      chunk = shell.recv(65535).decode(
                          errors="ignore"
                      )

                      buf += chunk

                      if re.search(prompt_regex, buf):
                          return buf

                  else:
                      time.sleep(0.1)

              return buf


          ansi_re = re.compile(
              r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])'
          )

          shell = None
          ssh = None

          try:

              # ==========================================
              # SSH CONNECTION
              # ==========================================

              ssh = paramiko.SSHClient()

              ssh.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()

              time.sleep(0.5)

              # ==========================================
              # INITIAL PROMPT
              #
              # Example:
              # AS212XTS>
              # ==========================================

              initial_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # ENABLE
              #
              # Example:
              # AS212XTS#
              # ==========================================

              shell.send("enable\n")

              enable_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # CONFIG
              #
              # Example:
              # AS212XTS_config#
              # ==========================================

              shell.send("config\n")

              config_output = read_until_prompt(
                  shell,
                  r'_config#\s*$',
                  timeout=5
              )

              # ==========================================
              # DELETE BINDING PORT LIST
              #
              # ==========================================

              port_command = (
                  f"no ip source binding {MAC_ADDRESS} {IP_ADDRESS} "
                  f"vlan {VLAN_ID}"
              )

              shell.send(port_command + "\n")

              port_output = read_until_prompt(
                  shell,
                  r'_config#\s*$',
                  timeout=5
              )
              # ==========================================
              # CHECK COMMAND RESULT
              # ==========================================

              if re.search(r'%err|parameter invalid|error', port_output, re.IGNORECASE):
                  raise Exception(
                      f"PORT List deletion command rejected by switch: "
                      f"{port_output.strip()}"
                  )

              # ==========================================
              # WRITE CONFIGURATION
              # ==========================================

              shell.send("write\n")

              write_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=10
              )

              # ==========================================
              # EXIT
              # ==========================================

              shell.send("exit\n")

              exit_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # CLEAN ANSI CHARACTERS
              # ==========================================

              enable_output = ansi_re.sub(
                  "",
                  enable_output
              )

              config_output = ansi_re.sub(
                  "",
                  config_output
              )

              port_output = ansi_re.sub(
                  "",
                  port_output
              )

              write_output = ansi_re.sub(
                  "",
                  write_output
              )

              exit_output = ansi_re.sub(
                  "",
                  exit_output
              )
              # ==========================================
              # CLOSE SSH
              # ==========================================

              shell.close()
              ssh.close()

              # ==========================================
              # RETURN JSON
              # ==========================================

              print(json.dumps({

                  "ip": HOST,
                  "status": "success"

              }))

          except Exception as e:

              try:

                  if shell:
                      shell.close()

                  if ssh:
                      ssh.close()

              except:
                  pass

              print(json.dumps({

                  "ip": HOST,
                  "status": "failed",
                  "error": str(e)

              }))

    # ==========================================
    # EXECUTE PYTHON SCRIPT
    # ==========================================

    - name: Execute BIND PORT List deletion script
      ansible.builtin.command:
        cmd: >
          /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          /opt/librenms/librenms-ansible-inventory-plugin/tmp/dhcp_port_list_delete_exec.py
      register: port_raw
      changed_when: false
      failed_when: false

    # ==========================================
    # CONVERT JSON RESULT
    # ==========================================

    - name: Convert BIND PORT result to JSON
      ansible.builtin.set_fact:
        port_result: "{{ port_raw.stdout | from_json }}"

    # ==========================================
    # DISPLAY RESULT
    # ==========================================

    - name: Display BIND Port deletion result
      ansible.builtin.debug:
        var: port_result

    # ==========================================
    # SAVE RESULT
    # ==========================================

    - name: Save BIND PORT deletion result
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/\
               {{ ansible_host }}_delete_port_list_delete.yml"
        content: |
          {{ port_result | to_nice_yaml }}


    # ==========================================
    # FAIL IF BIND PORT DELETION FAILED
    # ==========================================

    - name: Fail if BIND PORT deletion failed
      ansible.builtin.fail:
        msg: "{{ port_result.error }}"
      when: port_result.status == "failed"

    # ==========================================
    # FINAL MESSAGE
    # ==========================================

    - name: Display result file
      ansible.builtin.debug:
        msg: "BIND PORT entry {{ ip_address }} VLAN_ID {{ vlan_id }}
             MAC_ADDRESS {{mac_address}} deleted.
             Result saved to output/{{ ansible_host }}_delete_port_list_delete.yml"
