- name: Run "show hostname" on network device via SSH
  hosts: alphabridge_devices
  gather_facts: no

  tasks:

    - name: Create Python SSH script
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/get_hostname_exec.py"
        mode: '0755'
        content: |
          import paramiko
          import time

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False
              )

              shell = ssh.invoke_shell()
              time.sleep(1)

              shell.send("enable\n")
              time.sleep(1)
              shell.send(PASSWORD + "\n")
              time.sleep(1)

              shell.send("show running-config | include hostname\n")
              time.sleep(2)

              output = ""
              while shell.recv_ready():
                  output += shell.recv(65535).decode()

              hostname_value = None
              for line in output.splitlines():
                  line = line.strip()
                  if line.startswith("hostname "):
                      hostname_value = line.split("hostname ")[1].strip()
                      break

              if hostname_value:
                  print(hostname_value)
              else:
                  print("ERROR")

              ssh.close()

          except Exception:
              print("ERROR")

    - name: Run SSH script using virtualenv Python
      ansible.builtin.command:
        cmd: >
          /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          /opt/librenms/librenms-ansible-inventory-plugin/tmp/get_hostname_exec.py
      register: output
      changed_when: false

    - name: Save hostname output to YAML file
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_gethostname.yml"
        content: |
          ip: "{{ ansible_host }}"
          hostname: "{{ output.stdout | trim }}"
      when: output.stdout | trim != "ERROR"

    - name: Display hostname only
      ansible.builtin.debug:
        msg: "Hostname: {{ output.stdout | trim }}"
