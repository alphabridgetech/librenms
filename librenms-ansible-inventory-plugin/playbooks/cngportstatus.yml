- name: Change interface port status via SSH
  hosts: all
  gather_facts: no

  tasks:

    - name: Copy Python script
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/change_port_status_exec.py"
        mode: '0755'
        content: |
          import paramiko
          import time
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          INTERFACE = "{{ interface }}"
          STATUS = "{{ status }}"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(HOST, username=USER, password=PASSWORD, look_for_keys=False, allow_agent=False)

              shell = ssh.invoke_shell()
              time.sleep(1)

              shell.send("enable\n")
              time.sleep(1)
              shell.send(PASSWORD + "\n")
              time.sleep(1)

              shell.send("config\n")
              time.sleep(1)


              shell.send(f"interface {INTERFACE}\n")
              time.sleep(1)

              if STATUS.lower() == "enable":
                  shell.send(f"no shutdown\n")
              else if STATUS.lower() == "disable":
                  shell.send(f"shutdown\n")
              else:
                  shell.send(f"shutdown\n")
              time.sleep(1)

              shell.send("!\n")
              time.sleep(1)

              shell.send("write all\n")
              time.sleep(2)

              print("SUCCESS")

              ssh.close()

          except Exception as e:
              print("ERROR:", e)

    - name: Run script
      ansible.builtin.command: >
        /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
        /opt/librenms/librenms-ansible-inventory-plugin/tmp/change_port_status_exec.py
      register: output
      changed_when: true

    - name: Debug
      ansible.builtin.debug:
        var: output.stdout
