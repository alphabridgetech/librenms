# =============================================================================
# Playbook Name : IGMP Snooping VLAN Config
# =============================================================================
#
# Description:
# This playbook configures IGMP Snooping on a given VLAN on AlphaBridge
# switches over SSH, then reads back the resulting configuration and saves
# it in YAML/JSON format.
#
# Required input vars (pass with -e or a vars file):
#   vlan_id               : e.g. "3"
#   status_snooping_vlan  : "Enable" | "Disable"  (global IGMP snooping on the VLAN)
#   immediate_leave       : "Enable" | "Disable"
#   member_port           : e.g. "g0/1"           (mrouter interface)
#
# Example:
# ansible-playbook -i inventory/192.168.2.245.yml \
#   playbooks/igmp_snooping_vlan_config.yml \
#   -e "vlan_id=3 status_snooping_vlan=Enable immediate_leave=Enable member_port=g0/1"
#
# Output:
# output/<switch_ip>_igmp_snooping_vlan_config.yml
# =============================================================================

- name: IGMP snooping vlan config
  hosts: alphabridge_devices
  gather_facts: no

  tasks:

    # ==========================================
    # Sanity check required vars are present
    # ==========================================

    - name: Validate required input variables
      ansible.builtin.assert:
        that:
          - vlan_id is defined
          - status_snooping_vlan is defined
          - immediate_leave is defined
          - member_port is defined
        fail_msg: >
          You must pass vlan_id, status_snooping_vlan (Enable/Disable),
          immediate_leave (Enable/Disable) and member_port (e.g. g0/1).

    # ==========================================
    # Create Python SSH Script
    # ==========================================

    - name: Create Python SSH Script for IGMP snooping vlan config
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/\
               igmp_snooping_vlan_config_exec.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import json

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          VLAN_ID = "{{ vlan_id }}"
          STATUS_SNOOPING_VLAN = "{{ status_snooping_vlan }}"
          IMMEDIATE_LEAVE = "{{ immediate_leave }}"
          MEMBER_PORT = "{{ member_port }}"

          def read_until_prompt(shell, prompt_regex, timeout=10):
              buf = ""
              end_time = time.time() + timeout

              while time.time() < end_time:
                  if shell.recv_ready():
                      chunk = shell.recv(65535).decode(errors="ignore")
                      buf += chunk

                      if re.search(prompt_regex, buf):
                          return buf
                  else:
                      time.sleep(0.1)

              return buf

          def is_enabled(value):
              return value.strip().lower() in ("enable", "enabled", "true", "yes")

          ansi_re = re.compile(
              r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])'
          )

          shell = None
          ssh = None

          try:
              # ==========================================
              # SSH CONNECTION
              # ==========================================

              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(0.5)

              # ==========================================
              # INITIAL PROMPT
              # Example:
              # AS212XTS>
              # ==========================================

              initial_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # ENABLE
              # Example:
              # AS212XTS#
              # ==========================================

              shell.send("enable\n")

              enable_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # DISABLE PAGING
              # ==========================================

              shell.send("terminal length 0\n")

              terminal_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # ENTER CONFIG MODE
              # ==========================================

              shell.send("config\n")

              config_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=10
              )

              # ==========================================
              # GLOBAL IGMP SNOOPING ON VLAN (enable/disable)
              # ==========================================

              if is_enabled(STATUS_SNOOPING_VLAN):
                  snooping_cmd = f"ip igmp-snooping vlan {VLAN_ID}\n"
              else:
                  snooping_cmd = f"no ip igmp-snooping vlan {VLAN_ID}\n"

              shell.send(snooping_cmd)

              igmp_snooping_vlan = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=10
              )

              if re.search(r'%err|invalid|error', igmp_snooping_vlan, re.IGNORECASE):
                  raise Exception(
                      f"'{snooping_cmd.strip()}' rejected by switch: "
                      f"{igmp_snooping_vlan.strip()}"
                  )

              # ==========================================
              # IMMEDIATE LEAVE (enable/disable)
              # ==========================================

              if is_enabled(IMMEDIATE_LEAVE):
                  immediate_leave_cmd = f"ip igmp-snooping vlan {VLAN_ID} immediate-leave\n"
              else:
                  immediate_leave_cmd = f"no ip igmp-snooping vlan {VLAN_ID} immediate-leave\n"

              shell.send(immediate_leave_cmd)

              igmp_snooping_immediate_leave = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=10
              )

              if re.search(r'%err|invalid|error', igmp_snooping_immediate_leave, re.IGNORECASE):
                  raise Exception(
                      f"'{immediate_leave_cmd.strip()}' rejected by switch: "
                      f"{igmp_snooping_immediate_leave.strip()}"
                  )

              # ==========================================
              # MROUTER / MEMBER PORT
              # ==========================================

              mrouter_cmd = f"ip igmp-snooping vlan {VLAN_ID} mrouter interface {MEMBER_PORT}\n"
              shell.send(mrouter_cmd)

              igmp_snooping_config_member = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=10
              )

              if re.search(r'%err|invalid|error', igmp_snooping_config_member, re.IGNORECASE):
                  raise Exception(
                      f"'{mrouter_cmd.strip()}' rejected by switch: "
                      f"{igmp_snooping_config_member.strip()}"
                  )

              # ==========================================
              # EXIT CONFIG MODE
              # ==========================================

              shell.send("exit\n")

              exit_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # SAVE CONFIG (persist running-config)
              # NOTE: assumes "write" is the correct save command for
              # AlphaBridge switches. Change to "write memory",
              # "copy running-config startup-config", "save", etc. if
              # your switch uses different syntax.
              # ==========================================

              shell.send("write\n")

              write_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=15
              )

              if re.search(r'%err|invalid|error|fail', write_output, re.IGNORECASE):
                  raise Exception(
                      f"'write' (save config) rejected by switch: "
                      f"{write_output.strip()}"
                  )

              # ==========================================
              # READ BACK ACTUAL STATE
              # NOTE: adjust this command / the parsing block below to match
              # whatever your switch's real "show" output looks like. This
              # assumes a global "show ip igmp-snooping" style block with
              # "Key : value" lines (the earlier script parsed for this
              # format but never actually ran a show command to produce it).
              # ==========================================

              shell.send(f"show ip igmp-snooping vlan {VLAN_ID}\n")

              show_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=10
              )

              # ==========================================
              # CLEAN ANSI CHARACTERS
              # ==========================================

              enable_output = ansi_re.sub("", enable_output)
              config_output = ansi_re.sub("", config_output)
              igmp_snooping_vlan = ansi_re.sub("", igmp_snooping_vlan)
              igmp_snooping_immediate_leave = ansi_re.sub("", igmp_snooping_immediate_leave)
              igmp_snooping_config_member = ansi_re.sub("", igmp_snooping_config_member)
              exit_output = ansi_re.sub("", exit_output)
              write_output = ansi_re.sub("", write_output)
              show_output = ansi_re.sub("", show_output)

              # ==========================================
              # PARSE OUTPUT
              #
              # Only "key : value" lines from the show command are parsed.
              # Parsing stops once a per-VLAN table header is reached
              # (kept as a safety guard in case the device instead returns
              # the tabular "VLAN Immediate-leave Querier IP Router Ports"
              # format for this command).
              # ==========================================

              lines = show_output.splitlines()

              field_re = re.compile(r'^([A-Za-z][A-Za-z0-9\-\s]*?)\s*:\s*(.*)$')

              raw_fields = {}

              for line in lines:
                  clean_line = line.strip()

                  if not clean_line:
                      continue

                  # Stop once the per-VLAN table header shows up
                  if clean_line.startswith("VLAN") and "Immediate-leave" in clean_line:
                      break

                  if clean_line.startswith("---"):
                      continue

                  match = field_re.match(clean_line)
                  if match:
                      key = match.group(1).strip()
                      value = match.group(2).strip()
                      raw_fields[key] = value

              # ==========================================
              # CLOSE SSH
              # ==========================================

              shell.close()
              ssh.close()

              # ==========================================
              # RETURN JSON
              # ==========================================

              print(json.dumps({
                  "ip": HOST,
                  "status": "success",
              }))

          except Exception as e:
              try:
                  if shell:
                      shell.close()

                  if ssh:
                      ssh.close()
              except:
                  pass

              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "error": str(e)
              }))

    # ==========================================
    # EXECUTE PYTHON SCRIPT
    # ==========================================

    - name: Execute IGMP snooping config/show script
      ansible.builtin.command:
        cmd: >
          /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          /opt/librenms/librenms-ansible-inventory-plugin/tmp/\
          igmp_snooping_vlan_config_exec.py
      register: igmp_raw
      changed_when: false
      failed_when: false

    # ==========================================
    # CONVERT JSON RESULT
    # ==========================================

    - name: Convert IGMP snooping result to JSON
      ansible.builtin.set_fact:
        igmp_result: "{{ igmp_raw.stdout | from_json }}"

    # ==========================================
    # DISPLAY RESULT
    # ==========================================

    - name: Display IGMP snooping result
      ansible.builtin.debug:
        var: igmp_result

    # ==========================================
    # SAVE RESULT
    # ==========================================

    - name: Save IGMP snooping result
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/\
               {{ ansible_host }}_igmp_snooping_vlan_config.yml"
        content: |
          {{ igmp_result | to_nice_yaml }}

    # ==========================================
    # FAIL IF COMMAND FAILED
    # ==========================================

    - name: Fail if IGMP snooping config/show failed
      ansible.builtin.fail:
        msg: "{{ igmp_result.error }}"
      when: igmp_result.status == "failed"

    # ==========================================
    # FINAL MESSAGE
    # ==========================================

    - name: Display result file
      ansible.builtin.debug:
        msg: "IGMP snooping configured on {{ ansible_host }} for VLAN {{ vlan_id }}.
        Result saved to output/{{ ansible_host }}_igmp_snooping_vlan_config.yml"
