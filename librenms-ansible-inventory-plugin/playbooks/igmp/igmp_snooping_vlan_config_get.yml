# =============================================================================
# Playbook Name : IGMP Snooping VLAN Show
# =============================================================================
#
# Description:
# This playbook only READS the current IGMP snooping VLAN table from an
# AlphaBridge switch over SSH by running:
#   show ip igmp-snooping vlan [<vlan_id>]
#
# It does not change any configuration.
#
# Raw device output looks like:
# show ip igmp-snooping vlan
# VLAN  Immediate-leave  Querier IP       Router Ports
# --------------------------------------------------------
# 1     Disabled         none
# 2     Disabled         none
# 3     Enabled          none             g0/6(static);
#
# Input vars:
#   vlan_id  (optional) - if set, runs "show ip igmp-snooping vlan <vlan_id>"
#                          and expects a single matching row.
#                          If omitted, runs "show ip igmp-snooping vlan"
#                          (all VLANs) and returns every row.
#
# Example:
# ansible-playbook -i inventory/192.168.2.245.yml \
#   playbooks/igmp_snooping_vlan_show.yml \
#   -e "vlan_id=3"
#
# Output:
# output/<switch_ip>_igmp_snooping_vlan_show.yml
# =============================================================================

- name: IGMP snooping vlan show
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    # Resolve paths from this checkout, including the Jenkins workspace.
    project_root: "/opt/librenms/librenms-ansible-inventory-plugin/../.."

  pre_tasks:
    - name: Ensure script and report directories exist
      ansible.builtin.file:
        path: "/opt/librenms/librenms-ansible-inventory-plugin/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - tmp
        - output

  tasks:

    # ==========================================
    # Create Python SSH Script
    # ==========================================

    - name: Create Python SSH Script for IGMP snooping vlan show
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/igmp_snooping_vlan_show_exec.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import json

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          VLAN_ID = "{{ vlan_id | default('') }}"


          def read_until_prompt(shell, prompt_regex, timeout=10):
              buf = ""
              end_time = time.time() + timeout

              while time.time() < end_time:
                  if shell.recv_ready():
                      chunk = shell.recv(65535).decode(errors="ignore")
                      buf += chunk

                      if re.search(prompt_regex, buf):
                          return buf
                  else:
                      time.sleep(0.1)

              return buf


          ansi_re = re.compile(
              r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])'
          )

          shell = None
          ssh = None

          try:
              # ==========================================
              # SSH CONNECTION
              # ==========================================

              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(0.5)

              # ==========================================
              # INITIAL PROMPT
              # ==========================================

              initial_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # ENABLE
              # ==========================================

              shell.send("enable\n")

              enable_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # DISABLE PAGING
              # ==========================================

              shell.send("terminal length 0\n")

              terminal_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=5
              )

              # ==========================================
              # SHOW COMMAND
              # If VLAN_ID is blank, shows all VLANs.
              # ==========================================

              if VLAN_ID.strip():
                  show_cmd = f"show ip igmp-snooping vlan {VLAN_ID}\n"
              else:
                  show_cmd = "show ip igmp-snooping vlan\n"

              shell.send(show_cmd)

              show_output = read_until_prompt(
                  shell,
                  r'[>#]\s*$',
                  timeout=10
              )

              if re.search(r'%err|invalid|error', show_output, re.IGNORECASE):
                  raise Exception(
                      f"'{show_cmd.strip()}' rejected by switch: "
                      f"{show_output.strip()}"
                  )

              # ==========================================
              # CLEAN ANSI CHARACTERS
              # ==========================================

              show_output = ansi_re.sub("", show_output)

              # ==========================================
              # PARSE TABLE
              #
              # Expected row format:
              # VLAN  Immediate-leave  Querier IP       Router Ports
              # 3     Enabled          none             g0/6(static);
              #
              # Router Ports may be empty.
              # ==========================================

              row_re = re.compile(
                  r'^\s*(\d+)\s+(Enabled|Disabled)\s+(\S+)\s*(.*?)\s*$',
                  re.IGNORECASE
              )

              # ==========================================
              # CLEAN ROUTER PORTS
              #
              # Raw Router Ports column includes the switch itself
              # ("SWITCH(querier);") alongside any real router ports
              # ("g0/7(static);") - drop the SWITCH(querier) entry
              # entirely, strip the (static)/(dynamic) tag from whatever
              # real ports remain, and drop the ";" separators too, e.g.:
              #   "SWITCH(querier); g0/7(static);" -> "g0/7"
              #   "SWITCH(querier);"                -> ""
              # ==========================================

              def clean_router_ports(raw):

                  if not raw:
                      return ""

                  cleaned = re.sub(
                      r'(?i)SWITCH\s*\(\s*querier\s*\)\s*;?',
                      '',
                      raw
                  )

                  cleaned = re.sub(
                      r'(?i)\s*\((?:static|dynamic)\)',
                      '',
                      cleaned
                  )

                  cleaned = cleaned.replace(';', '')

                  cleaned = re.sub(r'\s+', ' ', cleaned).strip()

                  return cleaned

              vlans = []

              for line in show_output.splitlines():
                  clean_line = line.strip()

                  if not clean_line:
                      continue

                  # Skip header and separator lines
                  if clean_line.lower().startswith("vlan"):
                      continue

                  if clean_line.startswith("---"):
                      continue

                  # Skip the echoed command / prompt lines
                  if clean_line.lower().startswith("show ip igmp-snooping"):
                      continue

                  match = row_re.match(clean_line)
                  if not match:
                      continue

                  vlan_num, immediate_leave, querier_ip, router_ports = match.groups()

                  vlans.append({
                      "vlan_id": vlan_num,
                      "immediate_leave": immediate_leave.capitalize(),
                      "router_ports": clean_router_ports(router_ports.strip())
                  })

              # ==========================================
              # CLOSE SSH
              # ==========================================

              shell.close()
              ssh.close()

              # ==========================================
              # RETURN JSON
              # ==========================================

              print(json.dumps({
                  "ip": HOST,
                  "status": "success",
                  "vlans": vlans
              }))

          except Exception as e:
              try:
                  if shell:
                      shell.close()

                  if ssh:
                      ssh.close()
              except:
                  pass

              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "error": str(e)
              }))

    # ==========================================
    # EXECUTE PYTHON SCRIPT
    # ==========================================

    - name: Execute IGMP snooping show script
      ansible.builtin.command:
        argv:
          - /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          - "/opt/librenms/librenms-ansible-inventory-plugin/tmp/igmp_snooping_vlan_show_exec.py"
      register: igmp_raw
      changed_when: false
      failed_when: false

    # ==========================================
    # CONVERT JSON RESULT
    # ==========================================

    - name: Convert IGMP snooping result to JSON
      ansible.builtin.set_fact:
        igmp_result: "{{ igmp_raw.stdout | from_json }}"

    # ==========================================
    # DISPLAY RESULT
    # ==========================================

    - name: Display IGMP snooping result
      ansible.builtin.debug:
        var: igmp_result

    # ==========================================
    # SAVE RESULT
    # ==========================================

    - name: Save IGMP snooping result
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_igmp_snooping_vlan_show.yml"
        content: |
          {{ igmp_result | to_nice_yaml (sort_keys=False) }}

    # ==========================================
    # FAIL IF SHOW COMMAND FAILED
    # ==========================================

    - name: Fail if IGMP snooping show failed
      ansible.builtin.fail:
        msg: "{{ igmp_result.error }}"
      when: igmp_result.status == "failed"

    # ==========================================
    # FINAL MESSAGE
    # ==========================================

    - name: Display result file
      ansible.builtin.debug:
        msg: "IGMP snooping VLAN table retrieved from {{ ansible_host }}.
        Result saved to output/{{ ansible_host }}_igmp_snooping_vlan_show.yml"
