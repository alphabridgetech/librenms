---
- name: Export startup-config from device to TFTP
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/tftpexport_exec.py"
    venv_python: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Create TFTP export Python script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          TFTP_SERVER = "{{ tftp_server }}"
          FILENAME = "{{ filename }}"
          DEST_FILE = "{{ destination_file }}"

          def read(shell, wait=1):
              time.sleep(wait)
              out = ""
              while shell.recv_ready():
                  out += shell.recv(65535).decode(errors="ignore")
              return out

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(2)
              output = read(shell)

              # ENTER ENABLE MODE ONLY IF REQUIRED
              if output.strip().endswith(">"):
                  shell.send("enable\n")
                  time.sleep(1)
                  output += read(shell)

              # VERIFY PRIVILEGED MODE
              if not output.strip().endswith("#"):
                  print("FAILED: Not in enable mode")
                  print(output)
                  sys.exit(1)

              # COPY COMMAND
              shell.send(f"copy flash:{FILENAME} tftp: {TFTP_SERVER}\n")
              time.sleep(2)
              output = read(shell)

              if "Destination file name" in output:
                  shell.send(DEST_FILE + "\n")

              # READ FULL TRANSFER
              end = time.time() + 120
              tftp_success = False
              while time.time() < end:
                  time.sleep(1)
                  chunk = read(shell, 0)
                  output += chunk
                  if "successfully send" in output.lower():
                      tftp_success = True
                      break
                  if "error" in output.lower() or "timeout" in output.lower():
                      break

              if not tftp_success:
                  print("FAILED: TFTP transfer failed or timed out")
                  print(output)
                  sys.exit(1)

              # DISABLE PAGINATION
              shell.send("terminal length 0\n")
              time.sleep(1)
              read(shell)

              import os
              local_dir = "/tftpboot"
              local_path = os.path.join(local_dir, DEST_FILE) if os.path.exists(local_dir) else None
              if local_path and (not os.path.exists(local_path) or os.path.getsize(local_path) < 100):
                  # FETCH FILE DIRECTLY OVER SSH AND WRITE LOCALLY
                  config_output = ""
                  if FILENAME == "startup-config":
                      shell.send("show startup-config\n")
                      time.sleep(3)
                      res = read(shell, 2)
                      if "too many parameters" in res.lower() or "invalid input" in res.lower() or "%" in res:
                          shell.send("show config\n")
                          time.sleep(3)
                          res = read(shell, 2)
                      config_output = res
                  else:
                      shell.send(f"show {FILENAME}\n")
                      time.sleep(3)
                      config_output = read(shell, 2)

                  # Filter prompt and command echo out of the output
                  lines = config_output.splitlines()
                  config_lines = []
                  started = False
                  for line in lines:
                      if line.strip().startswith("!") or "version" in line.lower() or started:
                          started = True
                          config_lines.append(line)
                          if line.strip() == "end" or (started and line.strip().endswith("#")):
                              break

                  if not config_lines:
                      config_lines = lines

                  config_text = "\n".join(config_lines)
                  if "too many parameters" not in config_text.lower() and "invalid input" not in config_text.lower() and "no such file" not in config_text.lower():
                      with open(local_path, "w") as f:
                          f.write(config_text)

              print(output)
              print("SUCCESS")
              sys.exit(0)

          except Exception as e:
              print("ERROR:", e)
              sys.exit(1)

    - name: Execute TFTP export script
      ansible.builtin.command:
        cmd: "{{ venv_python }} {{ script_path }}"
      register: tftp_output
      changed_when: true
      failed_when: tftp_output.rc != 0

    - name: Show TFTP export result
      ansible.builtin.debug:
        var: tftp_output.stdout
