---
# ============================================================
# Get Port Protect Group Configuration
#
# Retrieves Port Protect Group assignments for physical
# interfaces from show running-config.
# Saves structured interface data without the full configuration.
#
# Ansible command:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/portprotectgroup/getportprotectconfiguration.yml
# ============================================================

- name: Get Port Protect Group Configuration
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    project_root: "{{ playbook_dir }}/../../"
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Generate Port Protect Group retrieval script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/get_portprotectconfiguration.py"
        mode: "0755"
        content: |
          import sys
          import time
          import json
          import re
          import paramiko

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          SSH_PORT = int("{{ ansible_port | default(22) }}")
          USERNAME = "{{ ansible_user | default(ansible_ssh_user | default('admin')) }}"
          PASSWORD = "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_portprotectconfiguration.yml"

          def clean_output(text):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              return text.replace("\x08", "").replace("\r", "")

          def run_command(channel, command, timeout=60):
              channel.send(command + "\n")
              output = ""
              deadline = time.time() + timeout
              last_data = time.time()
              while time.time() < deadline:
                  if channel.recv_ready():
                      output += channel.recv(65535).decode("utf-8", errors="ignore")
                      last_data = time.time()
                      cleaned = clean_output(output)
                      if re.search(r"--More--|Press any key|Press <SPACE>", cleaned, re.I):
                          channel.send(" ")
                      lines = [line.strip() for line in cleaned.splitlines() if line.strip()]
                      if lines and re.search(r"[>#]\s*$", lines[-1]):
                          time.sleep(0.25)
                          while channel.recv_ready():
                              output += channel.recv(65535).decode("utf-8", errors="ignore")
                          return clean_output(output)
                  else:
                      time.sleep(0.15)
                      if output and time.time() - last_data > 3:
                          break
              return clean_output(output)

          def has_cli_error(output):
              patterns = [
                  r"Unknown command", r"Invalid command", r"invalid input",
                  r"Incomplete command", r"% Error", r"% Invalid",
                  r"command failed", r"configuration failed"
              ]
              return any(re.search(pattern, output, re.I) for pattern in patterns)

          def normalize_interface(name):
              name = name.strip()
              patterns = [
                  (r"TGigaEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"TenGigabitEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"GigaEthernet\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"FastEthernet\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"Ethernet\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"tg\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"ge\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"g\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"fe\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"e\s*(\d+)\s*/\s*(\d+)", "e")
              ]
              for pattern, prefix in patterns:
                  match = re.fullmatch(pattern, name, re.I)
                  if match:
                      return prefix + match.group(1) + "/" + match.group(2)
              return name

          def parse_config(config):
              interfaces = []
              current = None
              for raw_line in config.splitlines():
                  line = raw_line.strip()
                  match = re.match(r"^interface\s+(.+?)\s*$", line, re.I)
                  if match:
                      name = match.group(1).strip()
                      normalized = normalize_interface(name)
                      if re.fullmatch(r"(?:tg|g|ge|fe|e)\d+/\d+", normalized, re.I):
                          current = {
                              "interface": normalized,
                              "port_protect_group": None
                          }
                          interfaces.append(current)
                      else:
                          current = None
                      continue

                  if current is not None:
                      group_match = re.match(
                          r"^switchport\s+protected\s+(\d+)\s*$",
                          line,
                          re.I
                      )
                      if group_match:
                          current["port_protect_group"] = int(group_match.group(1))

              return interfaces

          def main():
              client = None
              status = "failed"
              try:
                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  client.connect(
                      hostname=HOST, port=SSH_PORT, username=USERNAME, password=PASSWORD,
                      look_for_keys=False, allow_agent=False, timeout=15,
                      banner_timeout=15, auth_timeout=15
                  )
                  channel = client.invoke_shell()
                  time.sleep(2)
                  initial = ""
                  while channel.recv_ready():
                      initial += channel.recv(65535).decode("utf-8", errors="ignore")
                  lines = [line.strip() for line in clean_output(initial).splitlines() if line.strip()]
                  prompt = lines[-1] if lines else ""
                  if not prompt:
                      raise RuntimeError("Could not read the switch prompt.")
                  if prompt.endswith(">"):
                      output = run_command(channel, "enable", 5)
                      lines = [line.strip() for line in output.splitlines() if line.strip()]
                      prompt = lines[-1] if lines else ""
                      if has_cli_error(output) or not prompt.endswith("#"):
                          raise RuntimeError("Could not enter privileged EXEC mode.")

                  config = run_command(channel, "show running-config", 60)
                  if has_cli_error(config):
                      raise RuntimeError("Switch rejected show running-config.")

                  interfaces = parse_config(config)
                  report = {"ip": HOST, "interfaces": interfaces}
                  status = "success"

              except Exception as exc:
                  print("Port Protect Group retrieval error: " + str(exc), file=sys.stderr)
                  report = {"ip": HOST, "interfaces": [], "message": "Port Protect Group retrieval failed."}
                  status = "failed"
              finally:
                  if client:
                      client.close()

              with open(OUTPUT_FILE, "w") as report_file:
                  json.dump(report, report_file, indent=2)
                  report_file.write("\n")
              print(json.dumps(report, indent=2))
              sys.exit(0 if status == "success" else 1)

          if __name__ == "__main__":
              main()

    - name: Execute Port Protect Group retrieval
      ansible.builtin.command:
        argv:
          - python3
          - "{{ tmp_dir }}/get_portprotectconfiguration.py"
      register: port_protect_get_result
      changed_when: false
      failed_when: port_protect_get_result.rc != 0

    - name: Display Port Protect Group result
      ansible.builtin.debug:
        var: port_protect_get_result.stdout

