---
# ============================================================
# Get Port Protect Group Configuration
#
# Retrieves Port Protect Group assignments for physical
# interfaces from show running-config.
# Saves structured interface data without the full configuration.
#
# Ansible command:
# ansible-playbook -i hosts/10.10.10.1.yml playbooks/portprotectgroup/switchv1alphabridge/100g/getportprotectconfiguration.yml
# ============================================================

- name: Get Port Protect Group Configuration
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    temp_script: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/get_portprotectconfiguration_{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}.py"

  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ temp_script | dirname }}"
        state: directory
        mode: "0755"

    - name: Generate Port Protect Group retrieval script
      ansible.builtin.copy:
        dest: "{{ temp_script }}"
        mode: "0755"
        content: |
          import sys
          import time
          import json
          import re
          import paramiko

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          SSH_PORT = int("{{ ansible_port | default(22) }}")
          USERNAME = "{{ ansible_user | default(ansible_ssh_user | default('admin')) }}"
          PASSWORD = "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_portprotectconfiguration.yml"

          def clean_output(text):
              text = text.replace("\x1bE", "\n")
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              text = re.sub(r"\x1b[()][A-Z0-9]", "", text)
              return text.replace("\x08", "").replace("\r", "")

          def run_command(channel, command, timeout=60):
              channel.send(command + "\n")
              output = ""
              deadline = time.time() + timeout

              while time.time() < deadline:
                  if channel.recv_ready():
                      output += channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )

                      cleaned = clean_output(output)

                      if re.search(
                          r"--More--|Press any key|Press <SPACE>",
                          cleaned,
                          re.I
                      ):
                          channel.send(" ")
                          output = re.sub(
                              r"--More--|Press any key|Press <SPACE>",
                              "",
                              output,
                              flags=re.I
                          )

                      lines = [
                          line.strip()
                          for line in cleaned.splitlines()
                          if line.strip()
                      ]

                      if lines and re.search(r"[>#]\s*$", lines[-1]):
                          time.sleep(0.3)

                          while channel.recv_ready():
                              output += channel.recv(65535).decode(
                                  "utf-8", errors="ignore"
                              )

                          return clean_output(output)

                  else:
                      time.sleep(0.15)

              raise TimeoutError(
                  "Timeout waiting for prompt after command: "
                  + command + ". Output: " + clean_output(output)[-1000:]
              )

          def has_cli_error(output):
              patterns = [
                  r"Unknown command",
                  r"Invalid command",
                  r"invalid input",
                  r"Incomplete command",
                  r"% Error",
                  r"% Invalid",
                  r"command failed",
                  r"configuration failed",
                  r"Bad parameter"
              ]

              return any(
                  re.search(pattern, output, re.I)
                  for pattern in patterns
              )

          def normalize_interface(name):
              name = name.strip()

              patterns = [
                  (r"TGigaEthernet\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"TenGigabitEthernet\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"GigaEthernet\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"FastEthernet\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"Ethernet\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"tg\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"g\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"ge\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"fe\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"e\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"cg\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "cg"),
                  (r"wg\s*(\d+)\s*/\s*(\d+)\s*/\s*(\d+)", "wg"),
                  (r"TGigaEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"TenGigabitEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"GigaEthernet\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"FastEthernet\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"Ethernet\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"tg\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"ge\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"g\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"fe\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"e\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"cg\s*(\d+)\s*/\s*(\d+)", "cg"),
                  (r"wg\s*(\d+)\s*/\s*(\d+)", "wg")
              ]

              for pattern, prefix in patterns:
                  match = re.fullmatch(pattern, name, re.I)

                  if match:
                      return prefix + "/".join(match.groups())

              return re.sub(r"\s+", "", name).lower()

          def parse_config(config):
              interfaces = []
              current = None

              for raw_line in clean_output(config).splitlines():
                  line = raw_line.strip()

                  match = re.match(
                      r"^interface\s+(.+?)\s*$",
                      line,
                      re.I
                  )

                  if match:
                      name = match.group(1).strip()
                      normalized = normalize_interface(name)

                      if re.fullmatch(
                          r"(?:tg|g|ge|fe|e|cg|wg)\d+/\d+(?:/\d+)?",
                          normalized,
                          re.I
                      ):
                          current = {
                              "interface": normalized,
                              "port_protect_group": None
                          }
                          interfaces.append(current)
                      else:
                          current = None

                      continue

                  if current is not None:
                      group_match = re.fullmatch(
                          r"switchport\s+protected\s+(\d+)",
                          line,
                          re.I
                      )

                      if group_match:
                          current["port_protect_group"] = int(
                              group_match.group(1)
                          )

              return interfaces

          def main():
              client = None
              status = "failed"

              try:
                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(
                      paramiko.AutoAddPolicy()
                  )

                  client.connect(
                      hostname=HOST,
                      port=SSH_PORT,
                      username=USERNAME,
                      password=PASSWORD,
                      look_for_keys=False,
                      allow_agent=False,
                      timeout=15,
                      banner_timeout=15,
                      auth_timeout=15
                  )

                  channel = client.invoke_shell()
                  time.sleep(2)

                  initial = ""

                  while channel.recv_ready():
                      initial += channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )

                  lines = [
                      line.strip()
                      for line in clean_output(initial).splitlines()
                      if line.strip()
                  ]

                  prompt = lines[-1] if lines else ""

                  if not prompt:
                      channel.send("\n")
                      initial = run_command(channel, "", 10)

                      lines = [
                          line.strip()
                          for line in clean_output(initial).splitlines()
                          if line.strip()
                      ]

                      prompt = lines[-1] if lines else ""

                  if not prompt:
                      raise RuntimeError(
                          "Could not read the switch prompt."
                      )

                  if prompt.endswith(">"):
                      output = run_command(channel, "enable", 10)

                      lines = [
                          line.strip()
                          for line in output.splitlines()
                          if line.strip()
                      ]

                      prompt = lines[-1] if lines else ""

                      if has_cli_error(output) or not prompt.endswith("#"):
                          raise RuntimeError(
                              "Could not enter privileged EXEC mode."
                          )

                  # Read the complete running configuration.
                  config = run_command(
                      channel,
                      "show running-config",
                      120
                  )

                  if has_cli_error(config):
                      raise RuntimeError(
                          "Switch rejected show running-config: "
                          + config[-1000:]
                      )

                  # Parse Port Protect Group assignments.
                  interfaces = parse_config(config)

                  report = {
                      "ip": HOST,
                      "interfaces": interfaces
                  }

                  status = "success"

              except Exception as exc:
                  print(
                      "Port Protect Group retrieval error: " + str(exc),
                      file=sys.stderr
                  )

                  report = {
                      "ip": HOST,
                      "interfaces": [],
                      "message": "Port Protect Group retrieval failed."
                  }

                  status = "failed"

              finally:
                  if client:
                      client.close()

              with open(OUTPUT_FILE, "w") as report_file:
                  json.dump(report, report_file, indent=2)
                  report_file.write("\n")

              print(json.dumps(report, indent=2))

              sys.exit(0 if status == "success" else 1)

          if __name__ == "__main__":
              main()

    - name: Execute Port Protect Group retrieval
      ansible.builtin.command:
        argv:
          - python3
          - "{{ temp_script }}"
      register: port_protect_get_result
      changed_when: false
      failed_when: port_protect_get_result.rc != 0
      timeout: 300

    - name: Display Port Protect Group result
      ansible.builtin.debug:
        var: port_protect_get_result.stdout
