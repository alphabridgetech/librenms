---
# ============================================================
# Set or Delete Port Protect Group
#
# Configures or removes a Port Protect Group ID.
# Valid group IDs are 1 through 28.
# Retrieves show running-config to verify the operation.
# Saves only the switch IP and operation result.
#
# Required Parameters:
# - group_id: Port Protect Group ID (1-28)
# - operation: set or delete (defaults to set)
#
# Set:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/portprotectgroup/portportectlist/setportprotectgroup.yml -e '{"operation":"set","group_id":23}'
# Delete:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/portprotectgroup/portportectlist/setportprotectgroup.yml -e '{"operation":"delete","group_id":23}'
# ============================================================

- name: Set or Delete Port Protect Group
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    project_root: "{{ playbook_dir }}/../../"
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:
    - name: Validate Port Protect Group parameters
      ansible.builtin.assert:
        that:
          - group_id is defined
          - (group_id | int) >= 1
          - (group_id | int) <= 28
          - (operation | default('set') | lower) in ['set', 'delete']
        fail_msg: "Provide group_id between 1 and 28 and operation set or delete."
        success_msg: "Port Protect Group parameters validated."

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Generate Port Protect Group configuration script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/set_portprotectgroup.py"
        mode: "0755"
        content: |
          import sys
          import time
          import json
          import re
          import paramiko

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          SSH_PORT = int("{{ ansible_port | default(22) }}")
          USERNAME = "{{ ansible_user | default(ansible_ssh_user | default('admin')) }}"
          PASSWORD = "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
          GROUP_ID = int("{{ group_id }}")
          OPERATION = "{{ operation | default('set') | lower }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_portprotectgroup_set.yml"

          def clean_output(text):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              return text.replace("\x08", "").replace("\r", "")

          def run_command(channel, command, timeout=30):
              channel.send(command + "\n")
              output = ""
              deadline = time.time() + timeout
              last_data = time.time()

              while time.time() < deadline:
                  if channel.recv_ready():
                      output += channel.recv(65535).decode("utf-8", errors="ignore")
                      last_data = time.time()
                      cleaned = clean_output(output)

                      if re.search(r"--More--|Press any key|Press <SPACE>", cleaned, re.I):
                          channel.send(" ")

                      lines = [line.strip() for line in cleaned.splitlines() if line.strip()]
                      if lines and re.search(r"[>#]\s*$", lines[-1]):
                          time.sleep(0.2)
                          while channel.recv_ready():
                              output += channel.recv(65535).decode("utf-8", errors="ignore")
                          return clean_output(output)
                  else:
                      time.sleep(0.15)
                      if output and time.time() - last_data > 2:
                          break

              return clean_output(output)

          def has_cli_error(output):
              patterns = [
                  r"Unknown command", r"Invalid command", r"invalid input",
                  r"Incomplete command", r"% Error", r"% Invalid",
                  r"command failed", r"configuration failed"
              ]
              return any(re.search(pattern, output, re.I) for pattern in patterns)

          def configured_group_ids(config):
              ids = set()
              for raw_line in config.splitlines():
                  line = raw_line.strip()
                  match = re.fullmatch(r"port-protected\s+(\d+)", line, re.I)
                  if match:
                      ids.add(int(match.group(1)))
              return ids

          def main():
              client = None
              status = "failed"
              try:
                  if not 1 <= GROUP_ID <= 28:
                      raise ValueError("Port Protect Group ID must be between 1 and 28.")
                  if OPERATION not in ("set", "delete"):
                      raise ValueError("operation must be set or delete.")

                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  client.connect(
                      hostname=HOST, port=SSH_PORT, username=USERNAME, password=PASSWORD,
                      look_for_keys=False, allow_agent=False, timeout=15,
                      banner_timeout=15, auth_timeout=15
                  )
                  channel = client.invoke_shell()
                  time.sleep(2)
                  initial = ""
                  while channel.recv_ready():
                      initial += channel.recv(65535).decode("utf-8", errors="ignore")
                  lines = [line.strip() for line in clean_output(initial).splitlines() if line.strip()]
                  prompt = lines[-1] if lines else ""
                  if not prompt:
                      raise RuntimeError("Could not read the switch prompt.")

                  if prompt.endswith(">"):
                      output = run_command(channel, "enable", 5)
                      lines = [line.strip() for line in output.splitlines() if line.strip()]
                      prompt = lines[-1] if lines else ""
                      if has_cli_error(output) or not prompt.endswith("#"):
                          raise RuntimeError("Could not enter privileged EXEC mode. " + output.strip())

                  before = run_command(channel, "show running-config", 60)
                  if has_cli_error(before):
                      raise RuntimeError("Switch rejected show running-config.")
                  before_ids = configured_group_ids(before)

                  output = run_command(channel, "config", 5)
                  lines = [line.strip() for line in output.splitlines() if line.strip()]
                  prompt = lines[-1] if lines else ""
                  if has_cli_error(output) or "config#" not in prompt.lower():
                      raise RuntimeError("Could not enter configuration mode. " + output.strip())

                  command = ("port-protected " if OPERATION == "set" else "no port-protected ") + str(GROUP_ID)
                  output = run_command(channel, command, 5)
                  if has_cli_error(output):
                      raise RuntimeError("Switch rejected command: " + command + ". Response: " + output.strip())

                  run_command(channel, "exit", 3)
                  time.sleep(0.5)
                  after = run_command(channel, "show running-config", 60)
                  if has_cli_error(after):
                      raise RuntimeError("Could not verify the change using show running-config.")
                  after_ids = configured_group_ids(after)

                  if OPERATION == "set" and GROUP_ID not in after_ids:
                      raise RuntimeError("Port Protect Group " + str(GROUP_ID) + " was not found after SET.")
                  if OPERATION == "delete" and GROUP_ID in after_ids:
                      raise RuntimeError("Port Protect Group " + str(GROUP_ID) + " is still present after DELETE.")

                  message = (
                      "Port Protect Group configured successfully."
                      if OPERATION == "set"
                      else "Port Protect Group deleted successfully."
                  )
                  report = {"ip": HOST, "message": message}
                  status = "success"

              except Exception as exc:
                  print("Port Protect Group error: " + str(exc), file=sys.stderr)
                  report = {"ip": HOST, "message": "Port Protect Group operation failed."}
                  status = "failed"
              finally:
                  if client:
                      client.close()

              with open(OUTPUT_FILE, "w") as report_file:
                  json.dump(report, report_file, indent=2)
                  report_file.write("\n")
              print(json.dumps(report, indent=2))
              sys.exit(0 if status == "success" else 1)

          if __name__ == "__main__":
              main()

    - name: Execute Port Protect Group operation
      ansible.builtin.command:
        argv:
          - python3
          - "{{ tmp_dir }}/set_portprotectgroup.py"
      register: port_protect_result
      changed_when: port_protect_result.rc == 0
      failed_when: port_protect_result.rc != 0

    - name: Display Port Protect Group result
      ansible.builtin.debug:
        var: port_protect_result.stdout

