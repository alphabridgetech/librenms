# =============================================================================
# Playbook Name : Show GVRP Interface Configuration
# =============================================================================
#
# Description:
# This playbook retrieves the per-interface GVRP (GARP VLAN Registration
# Protocol) status from AlphaBridge switches through SSH using a Python
# helper script, by parsing "show running-config".
#
# GVRP is enabled by default on every switchport. It only shows up in the
# running-config when it has been explicitly disabled, e.g.:
#
#   interface GigaEthernet0/1
#    no gvrp
#    ...
#   !
#
# So the parsing rule is:
#   - interface block contains "no gvrp"  -> status: Disable
#   - interface block has no "gvrp" line  -> status: Enable
#
# Only switchport-style interfaces (GigaEthernet*) are included; VLAN
# (SVI), Null0, and Port-aggregator interfaces are skipped since they are
# not shown on the GVRP GUI configuration page.
#
# Features:
# - Connect to Switch
# - Execute "show running-config"
# - Parse per-interface GVRP status
# - Convert to Structured JSON
# - Save YAML Report
# - Return Parsed Results
#
# CLI Command:
# show running-config
#
# Example:
# ansible-playbook \
# -i inventory/192.168.2.245.yml \
# playbooks/gvrp_interface_config_show.yml
#
# Output:
# output/<switch_ip>_gvrp_interface_config_show.yml
# =============================================================================

- name: Show GVRP interface configuration
  hosts: alphabridge_devices
  gather_facts: false

  tasks:

    # ==========================================
    # Create Python SSH Script
    # ==========================================

    - name: Create Python SSH Script for GVRP interface show
      ansible.builtin.copy:
        dest: "/home/vikas/ABOSS/Ansible/tmp/gvrp_interface_config_show_exec.py"
        mode: '0755'
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import json

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"


          def read_until_prompt(shell, prompt_regex, timeout=10):
              buf = ""
              end_time = time.time() + timeout

              while time.time() < end_time:
                  if shell.recv_ready():
                      chunk = shell.recv(65535).decode(errors="ignore")
                      buf += chunk

                      if re.search(prompt_regex, buf):
                          return buf
                  else:
                      time.sleep(0.1)

              return buf


          ansi_re = re.compile(
              r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])'
          )

          shell = None
          ssh = None

          try:
              # ==========================================
              # SSH CONNECTION
              # ==========================================

              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(0.5)

              # ==========================================
              # INITIAL PROMPT
              # ==========================================

              initial_output = read_until_prompt(shell, r'[>#]\s*$', timeout=5)

              # ==========================================
              # ENABLE
              # ==========================================

              shell.send("enable\n")
              enable_output = read_until_prompt(shell, r'[>#]\s*$', timeout=5)

              # ==========================================
              # DISABLE PAGING
              # ==========================================

              shell.send("terminal length 0\n")
              terminal_output = read_until_prompt(shell, r'[>#]\s*$', timeout=5)

              # ==========================================
              # SHOW RUNNING-CONFIG
              # ==========================================

              show_command = "show running-config"
              shell.send(show_command + "\n")
              running_config_output = read_until_prompt(
                  shell, r'[>#]\s*$', timeout=15
              )

              # ==========================================
              # EXIT
              # ==========================================

              shell.send("exit\n")
              exit_output = read_until_prompt(shell, r'[>#]\s*$', timeout=5)

              # ==========================================
              # CLEAN ANSI CHARACTERS
              # ==========================================

              enable_output = ansi_re.sub("", enable_output)
              running_config_output = ansi_re.sub("", running_config_output)
              exit_output = ansi_re.sub("", exit_output)

              # ==========================================
              # PARSE PER-INTERFACE GVRP STATUS
              #
              # Walk the running-config line by line. Track the current
              # "interface <name>" block until the closing "!" line, and
              # check whether "no gvrp" appears inside that block.
              # ==========================================

              gvrp_entries = []
              lines = running_config_output.splitlines()

              current_port = None
              current_has_no_gvrp = False

              interface_start_re = re.compile(r'^interface\s+(\S+)\s*$')
              no_gvrp_re = re.compile(r'^\s*no\s+gvrp\s*$', re.IGNORECASE)
              eligible_port_re = re.compile(
                  r'^GigaEthernet', re.IGNORECASE
              )

              for raw_line in lines:
                  line = raw_line.rstrip()
                  stripped = line.strip()

                  iface_match = interface_start_re.match(stripped)

                  if iface_match:
                      current_port = iface_match.group(1)
                      current_has_no_gvrp = False
                      continue

                  if stripped == "!":
                      if current_port and eligible_port_re.match(current_port):
                          status = (
                              "Disable" if current_has_no_gvrp else "Enable"
                          )
                          gvrp_entries.append({
                              "port": current_port,
                              "status": status
                          })

                      current_port = None
                      current_has_no_gvrp = False
                      continue

                  if current_port and no_gvrp_re.match(stripped):
                      current_has_no_gvrp = True

              # ==========================================
              # CLOSE SSH
              # ==========================================

              shell.close()
              ssh.close()

              # ==========================================
              # RETURN JSON
              # ==========================================

              print(json.dumps({
                  "ip": HOST,
                  "gvrp_entries": gvrp_entries,
                  "status": "success"
              }, indent=4))

          except Exception as e:
              try:
                  if shell:
                      shell.close()
                  if ssh:
                      ssh.close()
              except Exception:
                  pass

              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "error": str(e)
              }))

    # ==========================================
    # EXECUTE PYTHON SCRIPT
    # ==========================================

    - name: Execute GVRP interface show script
      ansible.builtin.command:
        cmd: >
          /home/vikas/ABOSS/Ansible/usr/bin/python3
          /home/vikas/ABOSS/Ansible/tmp/gvrp_interface_config_show_exec.py
      register: gvrp_raw
      changed_when: false
      failed_when: false

    # ==========================================
    # CONVERT JSON RESULT
    # ==========================================

    - name: Convert GVRP interface result to JSON
      ansible.builtin.set_fact:
        gvrp_result: "{{ gvrp_raw.stdout | from_json }}"

    # ==========================================
    # DISPLAY RESULT
    # ==========================================

    - name: Display GVRP interface result
      ansible.builtin.debug:
        msg: |
          ip: {{ gvrp_result.ip }}
          gvrp_entries:
          {{ gvrp_result.gvrp_entries | to_nice_yaml(indent=4) | indent(2, True) }}
          status: {{ gvrp_result.status }}

    # ==========================================
    # SAVE RESULT
    # ==========================================

    - name: Save GVRP interface result
      ansible.builtin.copy:
        dest: "/home/vikas/ABOSS/Ansible/output/\
               {{ ansible_host }}_gvrp_interface_config_show.yml"
        content: |
          ip: {{ gvrp_result.ip }}
          gvrp_entries:
          {{ gvrp_result.gvrp_entries | to_nice_yaml(indent=4) | indent(2, True) }}
          status: {{ gvrp_result.status }}

    # ==========================================
    # FAIL IF SCRIPT FAILED
    # ==========================================

    - name: Fail if GVRP interface show failed
      ansible.builtin.fail:
        msg: "{{ gvrp_result.error }}"
      when: gvrp_result.status == "failed"

    # ==========================================
    # FINAL MESSAGE
    # ==========================================

    - name: Display result file
      ansible.builtin.debug:
        msg: "GVRP interface status collected successfully.\
              Result saved to output/{{ ansible_host }}_gvrp_interface_config_show.yml"
 