# =============================================================================
# Playbook Name : Show GVRP Interface Configuration (Selected Interfaces)
# =============================================================================
#
# Description:
# Read "show running-config" and return the GVRP status of ONLY the interfaces
# requested by the user. No fixed interface family, port list, or model check.
#
# User inputs:
#   -e 'interface=g0/1'
#   -e 'interface=gigaethernet0/1'
#   -e 'interface=GigaEthernet0/1'
#   -e 'interface=tg0/1'
#   -e 'interfaces=g0/1,tg0/1'
#
# Name matching (case-insensitive):
#   1. Match the complete interface name returned by the switch, if possible.
#   2. Otherwise, split each name before its FIRST digit. Match the port part
#      exactly and match the user-supplied type as a prefix of the switch type.
#      Example: g0/1 -> GigaEthernet0/1; tg0/1 -> TGigaEthernet0/1.
#   3. Reject missing or ambiguous matches instead of returning the wrong port.
#      An arbitrary unrelated alias cannot be resolved without a switch-defined
#      mapping; use its actual name or an unambiguous leading abbreviation.
#
# Status rule:
#   "no gvrp" inside an interface block -> Disable
#   No "no gvrp" inside its block       -> Enable (device default)
#
# No regex is used to identify interface blocks, GVRP lines, or port families.
# The switch's returned interface names determine which types exist.
#
# Example:
#   ansible-playbook -i inventory/192.168.3.1.yml \
#     playbooks/gvrp/gvrp_interface_config_show.yml \
#     -e 'interfaces=g0/1,tg0/1'
#
# Output:
#   output/<switch_ip>_gvrp_interface_config_show.yml
# =============================================================================

- name: Show GVRP interface configuration
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    # Correct when this playbook is located in playbooks/.
    project_root: "{{ playbook_dir }}/../.."
    requested_interfaces: "{{ interfaces | default(interface | default('')) }}"

  pre_tasks:
    - name: Require interface or interfaces input
      ansible.builtin.assert:
        that:
          - interface is defined or interfaces is defined
          - not (interface is defined and interfaces is defined)
          - requested_interfaces | string | trim | length > 0
        fail_msg: "Provide -e 'interface=g0/1' or -e 'interfaces=g0/1,tg0/1'."

    - name: Ensure script and report directories exist
      ansible.builtin.file:
        path: "{{ project_root }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - tmp
        - output

  tasks:
    # ==========================================
    # Create Python SSH script
    # ==========================================
    - name: Create Python SSH Script for GVRP interface show
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/gvrp_interface_config_show_exec.py"
        mode: '0700'
        content: |
          #!/usr/bin/env python3

          import json
          import re
          import time
          import paramiko

          HOST = {{ ansible_host | to_json }}
          PORT = int({{ ansible_port | default(22) | to_json }})
          USER = {{ ansible_user | to_json }}
          PASSWORD = {{ ansible_password | to_json }}
          INTERFACE_INPUT = {{ requested_interfaces | to_json }}

          # Regex is used only for terminal control/prompt handling, not for
          # interface names, block identification, or GVRP configuration lines.
          ansi_re = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          prompt_re = re.compile(r'[>#]\s*\Z')
          cli_error_re = re.compile(
              r'(?im)^\s*%\s*(?:invalid|error|incomplete|ambiguous|'
              r'unknown|unrecognized)\b|\b(?:invalid input|unknown command)\b'
          )

          def read_until_prompt(shell, stage, timeout=30):
              buffer = ""
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  if shell.recv_ready():
                      buffer += shell.recv(65535).decode(errors="ignore")
                      cleaned = ansi_re.sub("", buffer).replace("\r", "")
                      if prompt_re.search(cleaned.rstrip()):
                          return cleaned
                  else:
                      time.sleep(0.1)
              raise TimeoutError(f"Timed out waiting for prompt during {stage}")

          def run_command(shell, command, timeout=30):
              shell.send(command + "\n")
              output = read_until_prompt(shell, command, timeout)
              if cli_error_re.search(output):
                  raise RuntimeError(f"Switch rejected {command!r}: {output}")
              return output

          def parse_interfaces(running_config):
              """Collect all interface blocks; no type whitelist or name regex."""
              entries = []
              current_name = None
              has_no_gvrp = False

              def finish_block():
                  if current_name is not None:
                      entries.append({
                          "port": current_name,
                          "status": "Disable" if has_no_gvrp else "Enable",
                      })

              for raw_line in running_config.splitlines():
                  line = raw_line.strip()
                  parts = line.split(maxsplit=1)

                  # Find the literal 'interface' command, whatever follows it.
                  if len(parts) == 2 and parts[0].casefold() == "interface":
                      finish_block()
                      current_name = parts[1].strip()
                      has_no_gvrp = False
                      continue

                  if line == "!":
                      finish_block()
                      current_name = None
                      has_no_gvrp = False
                      continue

                  if current_name is not None and line.casefold() == "no gvrp":
                      has_no_gvrp = True

              finish_block()  # Also handle output without a final '!'.
              return entries

          def name_parts(name):
              """Split an interface name before its first digit, without regex."""
              for position, char in enumerate(name):
                  if char.isdigit():
                      return name[:position].casefold(), name[position:].casefold()
              return name.casefold(), ""

          def select_interfaces(entries, user_input):
              requested = [value.strip() for value in user_input.split(",")]
              if not requested or any(not value for value in requested):
                  raise ValueError("Provide a non-empty interface name for each entry")

              selected = []
              for wanted in requested:
                  # Prefer exact names before considering abbreviated aliases.
                  exact = [entry for entry in entries
                           if entry["port"].casefold() == wanted.casefold()]
                  if exact:
                      matches = exact
                  else:
                      wanted_type, wanted_port = name_parts(wanted)
                      matches = []
                      for entry in entries:
                          actual_type, actual_port = name_parts(entry["port"])
                          if (wanted_type and wanted_port
                                  and actual_port == wanted_port
                                  and actual_type.startswith(wanted_type)):
                              matches.append(entry)

                  if not matches:
                      raise ValueError(
                          f"Interface {wanted!r} was not found in running-config"
                      )
                  if len(matches) != 1:
                      names = [entry["port"] for entry in matches]
                      raise ValueError(
                          f"Interface {wanted!r} is ambiguous; matches: {names}"
                      )
                  if all(entry["port"] != matches[0]["port"] for entry in selected):
                      selected.append(matches[0])
              return selected

          ssh = None
          shell = None
          stage = "SSH connection"

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST, port=PORT, username=USER, password=PASSWORD,
                  look_for_keys=False, allow_agent=False,
                  timeout=20, auth_timeout=20, banner_timeout=20
              )
              shell = ssh.invoke_shell()
              read_until_prompt(shell, "initial prompt", timeout=10)

              stage = "enable mode"
              run_command(shell, "enable", timeout=10)

              stage = "disable paging"
              run_command(shell, "terminal length 0", timeout=10)

              stage = "show running-config"
              config = run_command(shell, "show running-config", timeout=45)

              stage = "parse requested interfaces"
              all_entries = parse_interfaces(config)
              gvrp_entries = select_interfaces(all_entries, INTERFACE_INPUT)

              print(json.dumps({
                  "ip": HOST,
                  "gvrp_entries": gvrp_entries,
                  "status": "success",
              }, indent=4))

          except Exception as exc:
              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "stage": stage,
                  "error": str(exc),
              }))

          finally:
              if shell is not None:
                  shell.close()
              if ssh is not None:
                  ssh.close()
      no_log: true

    # ==========================================
    # Execute Python script and convert JSON
    # ==========================================
    - name: Execute GVRP interface show script
      ansible.builtin.command:
        argv:
          - /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          - /opt/librenms/librenms-ansible-inventory-plugin/tmp/gvrp_interface_config_show_exec.py
      register: gvrp_raw
      changed_when: false
      failed_when: false

    - name: Fail if script returned no JSON
      ansible.builtin.fail:
        msg: >-
          GVRP SHOW script did not return JSON. rc={{ gvrp_raw.rc }};
          stderr={{ gvrp_raw.stderr }}
      when: gvrp_raw.stdout | trim | length == 0

    - name: Convert GVRP interface result to JSON
      ansible.builtin.set_fact:
        gvrp_result: "{{ gvrp_raw.stdout | from_json }}"

    - name: Fail if GVRP interface show failed
      ansible.builtin.fail:
        msg: "{{ gvrp_result.stage }}: {{ gvrp_result.error }}"
      when: gvrp_result.status == 'failed'

    # ==========================================
    # Display and save only requested interfaces
    # ==========================================
    - name: Display GVRP interface result
      ansible.builtin.debug:
        msg: |
          ip: {{ gvrp_result.ip }}
          gvrp_entries:
          {{ gvrp_result.gvrp_entries | to_nice_yaml(indent=4) | indent(2, True) }}
          status: {{ gvrp_result.status }}

    - name: Save GVRP interface result
      ansible.builtin.copy:
        dest: "{{ project_root }}/output/{{ ansible_host }}_gvrp_interface_config_show.yml"
        content: |
          ip: {{ gvrp_result.ip }}
          gvrp_entries:
          {{ gvrp_result.gvrp_entries | to_nice_yaml(indent=4) | indent(2, True) }}
          status: {{ gvrp_result.status }}

    - name: Display result file
      ansible.builtin.debug:
        msg: >-
          GVRP interface status collected successfully.
          Result saved to output/{{ ansible_host }}_gvrp_interface_config_show.yml