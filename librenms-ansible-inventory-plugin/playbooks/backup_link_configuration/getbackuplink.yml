# ============================================================================
# File        : getbackuplink.yml
# Feature     : BackupLink Protocol Global Configuration - GET
# Device      : ABTPL Ethernet Switch
#
# Purpose:
#   Dynamically collect all configured BackupLink Protocol Global Groups.
#
# CLI:
#   show backup-link-group <GROUP_ID>
#
# Output:
#   output/<device_ip>_backuplink.yml
#
# Notes:
#   - No hostname is hard-coded.
#   - No fixed BackupLink group list is used.
#   - Group IDs are discovered dynamically from CLI output.
#   - Only configured groups are returned.
# ============================================================================

---
- name: Get BackupLink Protocol Global Configuration
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    temp_script: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/get_backuplink.py"
    output_file: "/opt/librenms/librenms-ansible-inventory-plugin/output/{{ ansible_host }}_backuplink.yml"

  tasks:

    # ========================================================================
    # Create Python SSH Script
    # ========================================================================

    - name: Create Python SSH script for BackupLink GET
      ansible.builtin.copy:
        dest: "{{ temp_script }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import sys

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          # ==================================================================
          # Generic prompts
          #
          # Examples:
          #   Switch>
          #   Switch#
          #   AS212XTS_>
          #   AS212XTS_#
          #   AS212XTS__config#
          #
          # No hostname is hard-coded.
          # ==================================================================

          USER_PROMPT_RE = re.compile(
              r'(?m)^[^\r\n]*>\s*$'
          )

          ENABLE_PROMPT_RE = re.compile(
              r'(?m)^[^\r\n]*#\s*$'
          )

          CONFIG_PROMPT_RE = re.compile(
              r'(?m)^[^\r\n]*_config#\s*$'
          )

          # ==================================================================
          # Clean CLI output
          # ==================================================================

          def clean_output(text):

              text = re.sub(
                  r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])',
                  '',
                  text
              )

              text = text.replace("\r", "")
              text = text.replace("--More--", "")
              text = text.replace("-- More --", "")

              return text

          # ==================================================================
          # Read output until CLI becomes idle
          #
          # Do not stop on the first prompt occurrence.
          # ==================================================================

          def read_output(shell, timeout=15):

              output = ""

              end_time = time.time() + timeout
              last_data_time = time.time()

              while time.time() < end_time:

                  if shell.recv_ready():

                      data = shell.recv(65535).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      output += data
                      last_data_time = time.time()

                      if "--More--" in data:
                          shell.send(" ")

                      if "-- More --" in data:
                          shell.send(" ")

                  else:

                      if output and (
                          time.time() - last_data_time >= 1.0
                      ):
                          break

                      time.sleep(0.1)

              return clean_output(output)

          # ==================================================================
          # Clear pending data
          # ==================================================================

          def clear_channel(shell):

              time.sleep(0.2)

              while shell.recv_ready():
                  shell.recv(65535)

          # ==================================================================
          # Send command
          # ==================================================================

          def send_command(shell, command, wait=1.0):

              clear_channel(shell)

              shell.send(command + "\n")

              time.sleep(wait)

              return read_output(
                  shell,
                  timeout=15
              )

          # ==================================================================
          # Get last non-empty line
          # ==================================================================

          def last_line(output):

              lines = [
                  line.strip()
                  for line in output.splitlines()
                  if line.strip()
              ]

              if not lines:
                  return ""

              return lines[-1]

          # ==================================================================
          # Parse BackupLink group
          # ==================================================================

          def parse_group(group_id, result):

              result = clean_output(result)

              # --------------------------------------------------------------
              # Ignore CLI errors
              # --------------------------------------------------------------

              if re.search(
                  r'(Invalid|Incomplete|Ambiguous|Unknown command|Error)',
                  result,
                  re.IGNORECASE
              ):

                  return None

              # --------------------------------------------------------------
              # Find Preemption Mode
              # --------------------------------------------------------------

              mode_match = re.search(
                  r'Preemption\s+Mode\s*:\s*(.+)',
                  result,
                  re.IGNORECASE
              )

              # --------------------------------------------------------------
              # If no Preemption Mode exists, group is not configured
              # --------------------------------------------------------------

              if not mode_match:
                  return None

              cli_mode = mode_match.group(1).strip()

              # Remove prompt if it appears on same line
              cli_mode = re.sub(
                  r'\s+[A-Za-z0-9_.-]+(?:_[A-Za-z0-9_.-]+)*[>#]\s*$',
                  '',
                  cli_mode
              ).strip()

              # --------------------------------------------------------------
              # Convert CLI mode to GUI mode
              # --------------------------------------------------------------

              if cli_mode.lower() == "bandwidth":

                  gui_mode = (
                      "High Bandwidth Port Preempt First"
                  )

              elif cli_mode.lower() == "active":

                  gui_mode = (
                      "Active Port Preempt First"
                  )

              elif cli_mode.lower() == "forced":

                  gui_mode = (
                      "Active Port Preempt First"
                  )

              elif cli_mode.lower() in [
                  "none",
                  "no preemption",
                  "no-preemption"
              ]:

                  gui_mode = "No Preemption"

              else:

                  gui_mode = cli_mode

              # --------------------------------------------------------------
              # Preemption Delay
              # --------------------------------------------------------------

              delay_match = re.search(
                  r'Preemption\s+Delay\s*:\s*(\d+)',
                  result,
                  re.IGNORECASE
              )

              if delay_match:

                  gui_delay = delay_match.group(1)

              else:

                  gui_delay = "0"

              return {
                  "group_id": str(group_id),
                  "preemption_mode": gui_mode,
                  "preemption_delay": gui_delay
              }

          # ==================================================================
          # Dynamically discover BackupLink Group IDs
          # ==================================================================
          #
          # First try:
          #
          #   show backup-link-group
          #
          # If the device displays all configured groups, extract their IDs.
          #
          # If the device requires a group ID, use the command help output
          # to determine the supported group range dynamically.
          # ==================================================================

          def discover_group_ids(shell):

              group_ids = set()

              # --------------------------------------------------------------
              # Try show command without group ID
              # --------------------------------------------------------------

              result = send_command(
                  shell,
                  "show backup-link-group",
                  wait=1.5
              )

              # --------------------------------------------------------------
              # Extract Group IDs from output
              #
              # Supported forms:
              #
              # Group 1
              # Group ID: 1
              # Backup Link Group 1
              # backup-link-group 1
              # --------------------------------------------------------------

              patterns = [

                  r'(?im)^\s*Group\s+(?:ID\s*[:=]\s*)?(\d+)\s*$',

                  r'(?im)^\s*Group\s+ID\s*[:=]\s*(\d+)',

                  r'(?im)Backup[\s-]*Link[\s-]*Group\s+(\d+)',

                  r'(?im)backup-link-group\s+(\d+)'

              ]

              for pattern in patterns:

                  for match in re.finditer(
                      pattern,
                      result
                  ):

                      group_ids.add(
                          int(match.group(1))
                      )

              # --------------------------------------------------------------
              # If all-group command did not expose IDs, inspect help.
              # --------------------------------------------------------------

              if not group_ids:

                  help_output = send_command(
                      shell,
                      "show backup-link-group ?",
                      wait=1
                  )

                  # ----------------------------------------------------------
                  # Look for numeric range
                  #
                  # Examples:
                  #   <1-8>
                  #   (1-8)
                  #   1-8
                  # ----------------------------------------------------------

                  range_matches = re.findall(
                      r'(\d+)\s*[-–]\s*(\d+)',
                      help_output
                  )

                  for start, end in range_matches:

                      start = int(start)
                      end = int(end)

                      if (
                          start >= 1
                          and end >= start
                          and end - start <= 255
                      ):

                          for group_id in range(
                              start,
                              end + 1
                          ):

                              group_ids.add(
                                  group_id
                              )

              return sorted(
                  group_ids
              )

          # ==================================================================
          # Create YAML output
          # ==================================================================

          def create_yaml(rows):

              print(
                  "ip: " + HOST
              )

              print(
                  "backuplink_global_configuration:"
              )

              if not rows:

                  print(
                      "    []"
                  )

                  return

              for row in rows:

                  print(
                      "    - group_id: "
                      + row["group_id"]
                  )

                  print(
                      "      preemption_mode: "
                      + row["preemption_mode"]
                  )

                  print(
                      "      preemption_delay: "
                      + row["preemption_delay"]
                  )

          # ==================================================================
          # SSH Connection
          # ==================================================================

          ssh = paramiko.SSHClient()

          ssh.set_missing_host_key_policy(
              paramiko.AutoAddPolicy()
          )

          shell = None

          try:

              # ==============================================================
              # CONNECT
              # ==============================================================

              ssh.connect(
                  HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=15,
                  banner_timeout=15,
                  auth_timeout=15
              )

              shell = ssh.invoke_shell()

              time.sleep(2)

              # ==============================================================
              # Read initial prompt
              # ==============================================================

              first = read_output(
                  shell,
                  timeout=5
              )

              current_prompt = last_line(
                  first
              )

              # ==============================================================
              # ENTER ENABLE MODE
              # ==============================================================

              if USER_PROMPT_RE.search(
                  current_prompt
              ):

                  enable_output = send_command(
                      shell,
                      "enable",
                      wait=2
                  )

                  # ----------------------------------------------------------
                  # Handle password prompt
                  # ----------------------------------------------------------

                  if re.search(
                      r'password\s*:',
                      enable_output,
                      re.IGNORECASE
                  ):

                      enable_output = send_command(
                          shell,
                          PASSWORD,
                          wait=2
                      )

                  # ----------------------------------------------------------
                  # Verify enable mode
                  # ----------------------------------------------------------

                  enable_prompt = last_line(
                      enable_output
                  )

                  if USER_PROMPT_RE.search(
                      enable_prompt
                  ):

                      print(
                          "BackupLink GET failed: "
                          "Unable to enter enable mode",
                          file=sys.stderr
                      )

                      sys.exit(1)

                  if not ENABLE_PROMPT_RE.search(
                      enable_prompt
                  ):

                      print(
                          "BackupLink GET failed: "
                          "Enable prompt not detected",
                          file=sys.stderr
                      )

                      sys.exit(1)

              # ==============================================================
              # DISCOVER GROUP IDs
              # ==============================================================

              discovered_groups = discover_group_ids(
                  shell
              )

              # ==============================================================
              # If discovery returned no IDs, do not hard-code 1-8.
              #
              # Return empty configuration.
              # ==============================================================

              all_groups = []

              # ==============================================================
              # GET EACH DISCOVERED GROUP
              # ==============================================================

              for group_id in discovered_groups:

                  result = send_command(
                      shell,
                      f"show backup-link-group {group_id}",
                      wait=1.2
                  )

                  parsed = parse_group(
                      group_id,
                      result
                  )

                  if parsed:

                      all_groups.append(
                          parsed
                      )

              # ==============================================================
              # CLOSE SSH
              # ==============================================================

              shell.close()
              ssh.close()

              shell = None

              # ==============================================================
              # SORT GROUPS
              # ==============================================================

              all_groups.sort(
                  key=lambda x: int(
                      x["group_id"]
                  )
              )

              # ==============================================================
              # CREATE YAML
              # ==============================================================

              create_yaml(
                  all_groups
              )

              sys.exit(0)

          except Exception as e:

              print(
                  "BackupLink GET failed: "
                  + str(e),
                  file=sys.stderr
              )

              try:

                  if shell:
                      shell.close()

              except Exception:
                  pass

              try:
                  ssh.close()
              except Exception:
                  pass

              sys.exit(1)

    # ========================================================================
    # Run GET Script
    # ========================================================================

    - name: Run BackupLink GET script
      ansible.builtin.command:
        cmd: >
          /opt/librenms/librenms-ansible-inventory-plugin/bin/python3
          {{ temp_script }}
      register: backup_get
      changed_when: false
      failed_when: backup_get.rc != 0

    # ========================================================================
    # Save GET YAML
    # ========================================================================

    - name: Save BackupLink GET YAML
      ansible.builtin.copy:
        dest: "{{ output_file }}"
        mode: "0644"
        content: "{{ backup_get.stdout }}\n"
      delegate_to: localhost

    # ========================================================================
    # Display GET YAML
    # ========================================================================

    - name: Display BackupLink GET YAML
      ansible.builtin.debug:
        msg: "{{ backup_get.stdout }}"
