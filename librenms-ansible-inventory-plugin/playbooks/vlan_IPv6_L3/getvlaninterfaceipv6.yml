---
# ============================================================
# VLAN INTERFACE IPv6 CONFIGURATION - GET
# ============================================================

- name: Get VLAN Interface IPv6 Configuration
  hosts: alphabridge_devices
  gather_facts: no

  vars:
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ output_dir }}"
        - "{{ tmp_dir }}"
      delegate_to: localhost

    - name: Create VLAN Interface IPv6 GET script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/getvlaninterfaceipv6.py"
        mode: "0755"
        content: |
          #!/usr/bin/env python3

          import paramiko
          import time
          import re
          import sys
          import yaml

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"

          OUTPUT_FILE = (
              "{{ output_dir }}/"
              "{{ ansible_host }}_vlan_interface_ipv6.yml"
          )

          def read_command(shell, command, wait_time=2):
              shell.send(command + "\n")
              time.sleep(wait_time)

              output = ""
              last_data_time = time.time()

              while time.time() - last_data_time < 2:
                  if shell.recv_ready():
                      data = shell.recv(65535).decode(
                          "utf-8",
                          errors="ignore"
                      )
                      output += data
                      last_data_time = time.time()
                  else:
                      time.sleep(0.2)

              return output.replace("\r", "")

          try:

              client = paramiko.SSHClient()
              client.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              client.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=15,
                  banner_timeout=15,
                  auth_timeout=15
              )

              shell = client.invoke_shell()
              time.sleep(1)

              shell.send("enable\n")
              time.sleep(0.5)

              shell.send("config\n")
              time.sleep(0.5)

              shell.send("terminal length 0\n")
              time.sleep(0.5)

              # ------------------------------------------------
              # Discover VLAN interfaces
              # ------------------------------------------------
              brief_output = read_command(
                  shell,
                  "show ip interface brief",
                  3
              )

              vlan_ids = []

              for line in brief_output.splitlines():

                  line = line.strip()

                  match = re.match(
                      r"^VLAN(\d+)\s+",
                      line,
                      re.IGNORECASE
                  )

                  if match:
                      vlan_ids.append(int(match.group(1)))

              vlan_ids = sorted(set(vlan_ids))

              vlan_data = []

              # ------------------------------------------------
              # Get IPv6 configuration for every VLAN
              # ------------------------------------------------
              for vlan_id in vlan_ids:

                  config_output = read_command(
                      shell,
                      "show running-config interface vlan "
                      + str(vlan_id),
                      2
                  )

                  interface_output = read_command(
                      shell,
                      "show interface vlan "
                      + str(vlan_id),
                      2
                  )

                  ipv6_enable = "disable"
                  ipv6_address = ""
                  ip_attribute = "Manual Configuration"

                  # --------------------------------------------
                  # IPv6 enable
                  # --------------------------------------------
                  for line in config_output.splitlines():

                      line = line.strip().lower()

                      if line == "ipv6 enable":
                          ipv6_enable = "enable"

                  # --------------------------------------------
                  # IPv6 Auto Configuration
                  # --------------------------------------------
                  if re.search(
                      r"^\s*ipv6\s+address\s+autoconfig\s*$",
                      config_output,
                      re.IGNORECASE | re.MULTILINE
                  ):
                      ip_attribute = "Auto Configuration"
                      ipv6_address = "autoconfig"

                  # --------------------------------------------
                  # IPv6 Manual Configuration
                  # --------------------------------------------
                  else:

                      manual_match = re.search(
                          r"^\s*ipv6\s+address\s+"
                          r"([0-9a-fA-F:]+/\d+)\s*$",
                          config_output,
                          re.IGNORECASE | re.MULTILINE
                      )

                      if manual_match:
                          ip_attribute = "Manual Configuration"
                          ipv6_address = manual_match.group(1)

                  # --------------------------------------------
                  # Operate status
                  # --------------------------------------------
                  operate = "down"

                  operate_match = re.search(
                      r"line protocol is\s+(up|down)",
                      interface_output,
                      re.IGNORECASE
                  )

                  if operate_match:
                      operate = operate_match.group(1).lower()

                  vlan_data.append({
                      "vlan_id": vlan_id,
                      "ip_attribute": ip_attribute,
                      "ipv6_enable": ipv6_enable,
                      "ipv6_address": ipv6_address,
                      "operate": operate
                  })

              client.close()

              result = {
                  "status": "SUCCESS",
                  "device_ip": HOST,
                  "vlan_interface_ipv6": vlan_data
              }

              with open(OUTPUT_FILE, "w") as f:
                  yaml.dump(
                      result,
                      f,
                      default_flow_style=False,
                      sort_keys=False
                  )

              print("GET SUCCESS")

          except Exception as e:

              print("ERROR:", str(e))

              with open(OUTPUT_FILE, "w") as f:
                  yaml.dump(
                      {
                          "status": "FAILED",
                          "device_ip": HOST,
                          "vlan_interface_ipv6": [],
                          "error": str(e)
                      },
                      f,
                      default_flow_style=False,
                      sort_keys=False
                  )

              sys.exit(1)

    - name: Execute VLAN Interface IPv6 GET
      ansible.builtin.command:
        cmd: "python3 {{ tmp_dir }}/getvlaninterfaceipv6.py"
      delegate_to: localhost
      register: vlan_ipv6_get_result
      changed_when: false

    - name: Show VLAN Interface IPv6 configuration
      ansible.builtin.debug:
        msg: >-
          {{
            lookup(
              'file',
              output_dir + '/' +
              ansible_host +
              '_vlan_interface_ipv6.yml'
            )
          }}
