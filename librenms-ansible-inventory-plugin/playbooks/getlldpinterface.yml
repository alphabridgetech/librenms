---
- name: Show LLDP interface configuration via SSH
  hosts: all
  gather_facts: no

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/show_lldp_interface_exec.py"
    python_bin: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Copy Python LLDP interface SHOW script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import os
          import sys
          import re
          import json

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host }}_getlldpinterface.yml"

          TOTAL_PORTS = 28

          def read_channel(chan, wait=1):
              time.sleep(wait)
              output = ""
              while chan.recv_ready():
                  output += chan.recv(65535).decode(errors="ignore")
                  time.sleep(0.2)
              return output

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              read_channel(shell, 2)

              shell.send("enable\n")
              read_channel(shell, 1)
              shell.send(PASSWORD + "\n")
              read_channel(shell, 1)

              shell.send("terminal length 0\n")
              read_channel(shell, 1)

              shell.send("show running-config\n")
              output = read_channel(shell, 4)

              ssh.close()

              # ---------------- GLOBAL FLAGS ----------------
              lldp_enabled = False
              global_mgmt_ip = ""

              for line in output.splitlines():
                  line = line.strip()
                  if line == "lldp run":
                      lldp_enabled = True

                  m = re.match(r"lldp management-ip ([0-9.]+)", line)
                  if m and not global_mgmt_ip:
                      global_mgmt_ip = m.group(1)

              # ---------------- INIT ALL PORTS ----------------
              ports = {}
              for i in range(1, TOTAL_PORTS + 1):
                  ports[f"g0/{i}"] = {
                      "receive": "Enable" if lldp_enabled else "Disable",
                      "send": "Enable" if lldp_enabled else "Disable",
                      "management_ip": global_mgmt_ip
                  }

              # ---------------- PARSE INTERFACES ----------------
              current = None

              for line in output.splitlines():
                  line = line.strip()

                  m = re.match(r"interface GigaEthernet0/(\d+)", line)
                  if m:
                      current = f"g0/{m.group(1)}"
                      continue

                  if current:
                      if line == "no lldp receive":
                          ports[current]["receive"] = "Disable"

                      if line == "no lldp transmit":
                          ports[current]["send"] = "Disable"

                      m = re.match(r"lldp management-ip ([0-9.]+)", line)
                      if m:
                          ports[current]["management_ip"] = m.group(1)

                  if line == "!":
                      current = None

              # ---------------- BUILD ARRAY ----------------
              lldp_interfaces = []
              for port in sorted(ports, key=lambda x: int(x.split('/')[1])):
                  lldp_interfaces.append({
                      "port": port,
                      "receive": ports[port]["receive"],
                      "send": ports[port]["send"],
                      "management_ip": ports[port]["management_ip"]
                  })

              result = {
                  "status": "success",
                  "ip": HOST,
                  "lldp": lldp_enabled,
                  "lldp_interfaces": lldp_interfaces
              }

              os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
              with open(OUTPUT_FILE, "w") as f:
                  json.dump(result, f, indent=2)

              print("SUCCESS")

          except Exception as e:
              print("ERROR")
              print(str(e))
              sys.exit(1)

    - name: Run LLDP interface SHOW script
      ansible.builtin.command:
        cmd: "{{ python_bin }} {{ script_path }}"
      register: lldp_output
      changed_when: false
      failed_when: "'ERROR' in lldp_output.stdout"

    - name: Display LLDP interface output
      ansible.builtin.debug:
        msg: "{{ lldp_output.stdout }}"
