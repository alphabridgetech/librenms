---
# ============================================================
# Set Static MAC Filtration Mode
#
# Configures Static MAC Filtration Mode on switch interfaces.
# Supports Accept, Reject and Disable modes.
# Dynamically discovers interfaces from show running-config.
# Skips trunk ports because port security cannot be configured
# on VLAN trunk ports.
# Saves the execution report in the output directory.
#
# Required Parameters:
# - mode: accept, reject or disable
# - target_interface: Optional interface (e.g. g0/1); defaults to all
#
# Ansible command:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/portsecurity/staticmacmode/setstaticmacfiltrationmode.yml -e '{"mode":"accept","target_interface":"g0/1"}'
#
# ============================================================

- name: Set Static MAC Filtration Mode
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:
    - name: Validate Static MAC Filtration Mode parameters
      ansible.builtin.assert:
        that:
          - mode is defined
          - (mode | default('') | lower) in ['accept', 'reject', 'disable']
          - (target_interface | default('all') | string | length) > 0
        fail_msg: "Provide mode as accept, reject or disable. target_interface is optional and defaults to all."
        success_msg: "Static MAC Filtration Mode parameters validated."

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Generate Static MAC Filtration Mode configuration script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/set_staticmacfiltrationmode.py"
        mode: "0755"
        content: |
          import sys
          import time
          import json
          import re
          import paramiko

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          SSH_PORT = int("{{ ansible_port | default(22) }}")
          USERNAME = "{{ ansible_user | default(ansible_ssh_user | default('admin')) }}"
          PASSWORD = "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
          MODE = "{{ mode | lower }}"
          TARGET_INTERFACE = "{{ target_interface | default('all') }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_staticmacfiltrationmode_set.yml"

          def clean_output(output):
              output = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output)
              # Drop pager prompts the switch has already erased with
              # backspaces - otherwise the next config line ends up glued
              # to "--More--" and is missed (e.g. "interface g0/2").
              output = re.sub(r" ?--More-- ?\x08+ *\x08*", "", output)
              output = output.replace("\x08", "")
              return output.replace("\r", "")

          def read_initial_prompt(channel, timeout=10):
              output = ""
              end_time = time.time() + timeout

              while time.time() < end_time:
                  if channel.recv_ready():
                      output += channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )

                      lines = clean_output(output).splitlines()
                      nonempty = [line.strip() for line in lines if line.strip()]

                      if nonempty and re.search(r"[>#]\s*$", nonempty[-1]):
                          time.sleep(0.3)
                          while channel.recv_ready():
                              output += channel.recv(65535).decode(
                                  "utf-8", errors="ignore"
                              )
                          return clean_output(output)
                  else:
                      time.sleep(0.2)

              return clean_output(output)

          def run_command(channel, command, timeout=60):
              channel.send(command + "\n")
              output = ""
              end_time = time.time() + timeout
              last_data_time = time.time()

              while time.time() < end_time:
                  if channel.recv_ready():
                      chunk = channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )
                      output += chunk
                      last_data_time = time.time()

                      if re.search(
                          r"--More--|Press any key|Press <SPACE>",
                          clean_output(output),
                          re.IGNORECASE
                      ):
                          channel.send(" ")

                      lines = clean_output(output).splitlines()
                      nonempty = [line.strip() for line in lines if line.strip()]

                      if nonempty and re.search(r"[>#]\s*$", nonempty[-1]):
                          time.sleep(0.3)
                          while channel.recv_ready():
                              output += channel.recv(65535).decode(
                                  "utf-8", errors="ignore"
                              )
                          return clean_output(output)
                  else:
                      time.sleep(0.2)
                      if output and time.time() - last_data_time > 3:
                          break

              return clean_output(output)

          def has_cli_error(output):
              patterns = [
                  r"Unknown command",
                  r"Invalid command",
                  r"invalid input",
                  r"Incomplete command",
                  r"% Error",
                  r"% Invalid",
                  r"command failed",
                  r"configuration failed",
                  r"Port security control cannot be configured on the VLAN Trunk port"
              ]

              return any(
                  re.search(pattern, output, re.IGNORECASE)
                  for pattern in patterns
              )

          def normalize_interface(interface):
              interface = interface.strip()

              patterns = [
                  (r"TGigaEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"TenGigabitEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"GigaEthernet\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"FastEthernet\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"Ethernet\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"tg\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"g\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"ge\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"fe\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"e\s*(\d+)\s*/\s*(\d+)", "e")
              ]

              for pattern, prefix in patterns:
                  match = re.fullmatch(
                      pattern, interface, re.IGNORECASE
                  )
                  if match:
                      return (
                          prefix + match.group(1)
                          + "/" + match.group(2)
                      )

              return interface

          def discover_interfaces(config):
              interfaces = []
              current = None

              for raw_line in config.splitlines():
                  line = raw_line.strip()

                  interface_match = re.match(
                      r"^interface\s+(.+?)\s*$",
                      line,
                      re.IGNORECASE
                  )

                  if interface_match:
                      name = interface_match.group(1).strip()

                      physical_match = re.fullmatch(
                          r"(?:TGigaEthernet|TenGigabitEthernet|"
                          r"GigaEthernet|FastEthernet|Ethernet|"
                          r"tg|ge|g|fe|e)\s*\d+\s*/\s*\d+",
                          name,
                          re.IGNORECASE
                      )

                      if physical_match:
                          current = {
                              "interface": name,
                              "normalized": normalize_interface(name),
                              "trunk": False
                          }
                          interfaces.append(current)
                      else:
                          current = None

                      continue

                  if current is None:
                      continue

                  if re.search(
                      r"switchport\s+mode\s+trunk",
                      line,
                      re.IGNORECASE
                  ):
                      current["trunk"] = True

              return interfaces

          def main():
              client = None
              errors = []
              status = "failed"

              try:
                  if MODE not in ("accept", "reject", "disable"):
                      raise ValueError(
                          "Mode must be accept, reject or disable."
                      )

                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(
                      paramiko.AutoAddPolicy()
                  )

                  client.connect(
                      hostname=HOST,
                      port=SSH_PORT,
                      username=USERNAME,
                      password=PASSWORD,
                      look_for_keys=False,
                      allow_agent=False,
                      timeout=15,
                      banner_timeout=15,
                      auth_timeout=15
                  )

                  channel = client.invoke_shell()
                  initial_output = read_initial_prompt(channel, 10)
                  prompt_lines = initial_output.strip().splitlines()
                  prompt = prompt_lines[-1].strip() if prompt_lines else ""

                  if not prompt:
                      raise RuntimeError(
                          "Could not read the switch prompt."
                      )

                  if prompt.endswith(">"):
                      output = run_command(channel, "enable", 5)
                      prompt_lines = output.strip().splitlines()
                      prompt = prompt_lines[-1].strip() if prompt_lines else ""

                      if has_cli_error(output) or not prompt.endswith("#"):
                          raise RuntimeError(
                              "Could not enter privileged EXEC mode."
                          )

                  config_output = run_command(
                      channel, "show running-config", 60
                  )

                  if has_cli_error(config_output):
                      raise RuntimeError(
                          "Switch rejected show running-config."
                      )

                  interfaces = discover_interfaces(config_output)

                  if not interfaces:
                      raise RuntimeError(
                          "No supported physical interfaces were found "
                          "in show running-config."
                      )

                  requested_port = TARGET_INTERFACE.strip().lower()

                  if requested_port != "all":
                      requested_normalized = normalize_interface(
                          requested_port
                      ).lower()

                      interfaces = [
                          item for item in interfaces
                          if item["normalized"].lower() == requested_normalized
                      ]

                      if not interfaces:
                          raise RuntimeError(
                              "Requested interface was not found: "
                              + TARGET_INTERFACE
                          )

                  output = run_command(channel, "config", 5)
                  prompt_lines = output.strip().splitlines()
                  prompt = prompt_lines[-1].strip() if prompt_lines else ""

                  if (
                      has_cli_error(output)
                      or "config#" not in prompt.lower()
                  ):
                      raise RuntimeError(
                          "Could not enter configuration mode."
                      )

                  processed = 0

                  for item in interfaces:
                      interface = item["interface"]
                      normalized = item["normalized"]

                      if item["trunk"]:
                          continue

                      output = run_command(
                          channel, "interface " + interface, 5
                      )

                      if has_cli_error(output):
                          errors.append(
                              "Could not select interface " + interface
                          )
                          continue

                      if MODE == "disable":
                          # Disable using the exact command requested.
                          command = "no switchport port-security mode"
                      else:
                          command = (
                              "switchport port-security mode static "
                              + MODE
                          )

                      output = run_command(channel, command, 5)

                      if has_cli_error(output):
                          errors.append(
                              "Switch rejected command on " + normalized
                          )
                      else:
                          processed += 1

                      run_command(channel, "exit", 2)

                  if errors:
                      status = "failed"
                  elif processed > 0:
                      status = "success"
                  else:
                      errors.append(
                          "No interfaces were configured. "
                          "Check whether the selected port is a trunk."
                      )
                      status = "failed"

              except Exception as exc:
                  errors.append(str(exc))
                  status = "failed"

              finally:
                  if client:
                      client.close()

              if status == "success":
                  report = {
                      "ip": HOST,
                      "message": "Static MAC Filtration Mode configured successfully."
                  }
              else:
                  report = {
                      "ip": HOST,
                      "message": "Static MAC Filtration Mode configuration failed.",
                      "errors": errors
                  }

              with open(OUTPUT_FILE, "w") as report_file:
                  json.dump(report, report_file, indent=2)
                  report_file.write("\n")

              print(json.dumps(report, indent=2))
              sys.exit(0 if status == "success" else 1)

          if __name__ == "__main__":
              main()

    - name: Execute Static MAC Filtration Mode configuration
      ansible.builtin.command:
        argv:
          - python3
          - "{{ tmp_dir }}/set_staticmacfiltrationmode.py"
      register: static_mac_result
      changed_when: static_mac_result.rc == 0
      failed_when: static_mac_result.rc != 0

    - name: Display Static MAC Filtration Mode result
      ansible.builtin.debug:
        var: static_mac_result.stdout
