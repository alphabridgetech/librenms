---
# ============================================================
# Get IP-MAC Binding
#
# Retrieves IP address and MAC address bindings from the
# switch running configuration.
# Saves only the fields required for the IP-MAC Binding table
# in the output directory.
#
# Ansible command:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/portsecurity/ipmac/getipmacbinding.yml
#
# ============================================================

- name: Get IP-MAC Binding
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Generate IP-MAC Binding retrieval script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/get_ipmacbinding.py"
        mode: "0755"
        content: |
          import sys
          import time
          import json
          import re
          import paramiko

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          PORT = int("{{ ansible_port | default(22) }}")
          USERNAME = "{{ ansible_user | default(ansible_ssh_user | default('admin')) }}"
          PASSWORD = "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
          COMMAND = "show running-config"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_ipmacbinding.yml"

          def read_initial_prompt(channel, timeout=10):
              output = ""
              end_time = time.time() + timeout

              while time.time() < end_time:
                  if channel.recv_ready():
                      output += channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )

                      if re.search(r"(?m)^.*[>#]\s*$", output):
                          time.sleep(0.3)

                          while channel.recv_ready():
                              output += channel.recv(65535).decode(
                                  "utf-8", errors="ignore"
                              )

                          return output
                  else:
                      time.sleep(0.2)

              return output

          def run_command(channel, command, timeout=60):
              channel.send(command + "\n")
              output = ""
              end_time = time.time() + timeout
              last_data_time = time.time()

              while time.time() < end_time:
                  if channel.recv_ready():
                      chunk = channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )
                      output += chunk
                      last_data_time = time.time()

                      if "--More--" in output or "Press any key" in output:
                          channel.send(" ")
                          output = output.replace("--More--", "")
                  else:
                      time.sleep(0.2)

                      if output and time.time() - last_data_time > 1.5:
                          break

              return output

          def has_cli_error(output):
              patterns = [
                  r"Unknown command",
                  r"Invalid command",
                  r"invalid input",
                  r"Incomplete command",
                  r"% Error",
                  r"% Invalid",
                  r"command failed"
              ]

              return any(
                  re.search(pattern, output, re.IGNORECASE)
                  for pattern in patterns
              )

          def normalize_interface(name):
              name = name.strip()

              match = re.fullmatch(
                  r"GigaEthernet\s*(\d+\s*/\s*\d+)",
                  name,
                  re.IGNORECASE
              )

              if match:
                  return "g" + re.sub(r"\s+", "", match.group(1))

              match = re.fullmatch(
                  r"g\s*(\d+\s*/\s*\d+)",
                  name,
                  re.IGNORECASE
              )

              if match:
                  return "g" + re.sub(r"\s+", "", match.group(1))

              return name

          def parse_bindings(config_text):
              bindings = []
              current_interface = None

              for raw_line in config_text.splitlines():
                  line = raw_line.strip()

                  interface_match = re.match(
                      r"^interface\s+(\S+)",
                      line,
                      re.IGNORECASE
                  )

                  if interface_match:
                      current_interface = normalize_interface(
                          interface_match.group(1)
                      )
                      continue

                  binding_match = re.match(
                      r"^switchport\s+port-security\s+bind\s+ip\s+"
                      r"(\d{1,3}(?:\.\d{1,3}){3})\s+mac\s+"
                      r"([0-9a-fA-F]{4}\.[0-9a-fA-F]{4}\.[0-9a-fA-F]{4}|"
                      r"[0-9a-fA-F]{12})\s*$",
                      line,
                      re.IGNORECASE
                  )

                  if binding_match and current_interface:
                      bindings.append({
                          "interface": current_interface,
                          "ip_address": binding_match.group(1),
                          "mac_address": binding_match.group(2).lower()
                      })

              return bindings

          def main():
              client = None
              status = "failed"
              errors = []
              bindings = []

              try:
                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(
                      paramiko.AutoAddPolicy()
                  )

                  client.connect(
                      hostname=HOST,
                      port=PORT,
                      username=USERNAME,
                      password=PASSWORD,
                      look_for_keys=False,
                      allow_agent=False,
                      timeout=15,
                      banner_timeout=15,
                      auth_timeout=15
                  )

                  channel = client.invoke_shell()
                  initial_output = read_initial_prompt(channel, 10)
                  prompt_lines = initial_output.strip().splitlines()
                  prompt = prompt_lines[-1].strip() if prompt_lines else ""

                  if not prompt:
                      raise RuntimeError(
                          "Could not read the switch prompt."
                      )

                  if prompt.endswith(">"):
                      output = run_command(channel, "enable", 5)

                      if has_cli_error(output):
                          raise RuntimeError(
                              "Switch rejected the enable command."
                          )

                      prompt_lines = output.strip().splitlines()
                      prompt = (
                          prompt_lines[-1].strip()
                          if prompt_lines else ""
                      )

                      if not prompt.endswith("#"):
                          raise RuntimeError(
                              "Could not enter privileged EXEC mode. "
                              "Current prompt: " + prompt
                          )

                  output = run_command(channel, COMMAND, 60)

                  if has_cli_error(output):
                      raise RuntimeError(
                          "Switch rejected the show running-config command."
                      )

                  # Remove ANSI codes, pager prompts the switch erased with
                  # backspaces, and leftover backspaces - otherwise the line
                  # after a page break isn't recognised.
                  output = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", output)
                  output = re.sub(r" ?(?:--More--)? ?\x08+ *\x08*", "", output)
                  output = output.replace("\x08", "").replace("\r", "")

                  bindings = parse_bindings(output)

                  bindings = [
                      {
                          "serial_number": index,
                          "interface": binding["interface"],
                          "ip_address": binding["ip_address"],
                          "mac_address": binding["mac_address"],
                          "operate": "Edit"
                      }
                      for index, binding in enumerate(bindings, start=1)
                  ]

                  status = "success"

              except Exception as exc:
                  errors.append(str(exc))
                  status = "failed"

              finally:
                  if client:
                      client.close()

              if status == "success":
                  report = {
                      "bindings": bindings
                  }
              else:
                  report = {
                      "bindings": [],
                      "error": errors
                  }

              with open(OUTPUT_FILE, "w") as report_file:
                  json.dump(report, report_file, indent=2)
                  report_file.write("\n")

              print(json.dumps(report, indent=2))
              sys.exit(0 if status == "success" else 1)

          if __name__ == "__main__":
              main()

    - name: Execute IP-MAC Binding retrieval script
      ansible.builtin.command:
        argv:
          - python3
          - "{{ tmp_dir }}/get_ipmacbinding.py"
      register: ipmacbinding_result
      changed_when: false
      failed_when: ipmacbinding_result.rc != 0

    - name: Display IP-MAC Binding retrieval result
      ansible.builtin.debug:
        var: ipmacbinding_result.stdout
