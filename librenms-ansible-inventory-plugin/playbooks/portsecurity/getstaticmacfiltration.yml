---
# ============================================================
# Get Static MAC Filtration
#
# Retrieves static MAC address entries from show running-config.
# Dynamically associates each MAC address with its interface.
# Reports serial number, interface, MAC address and Edit action.
# Does not save the complete running configuration.
#
# Ansible command:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/portsecurity/staticmacmode/getstaticmacfiltration.yml
# ============================================================

- name: Get Static MAC Filtration
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:
    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Generate Static MAC Filtration retrieval script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/get_staticmacfiltration.py"
        mode: "0755"
        content: |
          import sys
          import time
          import json
          import re
          import paramiko

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          SSH_PORT = int("{{ ansible_port | default(22) }}")
          USERNAME = "{{ ansible_user | default(ansible_ssh_user | default('admin')) }}"
          PASSWORD = "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_staticmacfiltration.yml"

          def clean_output(text):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              # Drop pager prompts the switch has already erased with
              # backspaces - otherwise the next config line ends up glued
              # to "--More--" and is missed (e.g. "interface g0/2").
              text = re.sub(r" ?--More-- ?\x08+ *\x08*", "", text)
              return text.replace("\x08", "").replace("\r", "")

          def run_command(channel, command, timeout=60):
              channel.send(command + "\n")
              output = ""
              deadline = time.time() + timeout
              last_data = time.time()
              while time.time() < deadline:
                  if channel.recv_ready():
                      output += channel.recv(65535).decode("utf-8", errors="ignore")
                      last_data = time.time()
                      if re.search(r"--More--|Press any key|Press <SPACE>", clean_output(output), re.I):
                          channel.send(" ")
                      lines = [line.strip() for line in clean_output(output).splitlines() if line.strip()]
                      if lines and re.search(r"[>#]\s*$", lines[-1]):
                          time.sleep(0.2)
                          while channel.recv_ready():
                              output += channel.recv(65535).decode("utf-8", errors="ignore")
                          return clean_output(output)
                  else:
                      time.sleep(0.15)
                      if output and time.time() - last_data > 2:
                          break
              return clean_output(output)

          def normalize_interface(name):
              name = name.strip()
              patterns = [
                  (r"TGigaEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"TenGigabitEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"GigaEthernet\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"FastEthernet\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"Ethernet\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"tg\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"ge\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"g\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"fe\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"e\s*(\d+)\s*/\s*(\d+)", "e")
              ]
              for pattern, prefix in patterns:
                  match = re.fullmatch(pattern, name, re.I)
                  if match:
                      return prefix + match.group(1) + "/" + match.group(2)
              return name

          def normalize_mac(mac):
              mac = str(mac).strip().lower()
              if re.fullmatch(r"[0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}", mac):
                  return mac
              if re.fullmatch(r"[0-9a-f]{12}", mac):
                  return mac[0:4] + "." + mac[4:8] + "." + mac[8:12]
              return mac

          def parse_bindings(config):
              entries = []
              current_interface = None
              for raw_line in config.splitlines():
                  line = raw_line.strip()
                  interface_match = re.match(r"^interface\s+(.+?)\s*$", line, re.I)
                  if interface_match:
                      current_interface = interface_match.group(1).strip()
                      continue

                  mac_match = re.match(
                      r"^switchport\s+port-security\s+static\s+mac-address\s+"
                      r"([0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}|[0-9a-f]{12})\s*$",
                      line, re.I
                  )
                  if mac_match and current_interface:
                      entries.append({
                          "interface": current_interface,
                          "normalized_interface": normalize_interface(current_interface),
                          "mac_address": normalize_mac(mac_match.group(1)),
                          "operate": "Edit"
                      })
              for index, entry in enumerate(entries, start=1):
                  entry["serial_number"] = index
              return entries

          def main():
              client = None
              try:
                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  client.connect(
                      hostname=HOST, port=SSH_PORT, username=USERNAME, password=PASSWORD,
                      look_for_keys=False, allow_agent=False, timeout=15,
                      banner_timeout=15, auth_timeout=15
                  )
                  channel = client.invoke_shell()
                  time.sleep(1)
                  initial = clean_output(channel.recv(65535).decode("utf-8", errors="ignore")) if channel.recv_ready() else ""
                  lines = [line.strip() for line in initial.splitlines() if line.strip()]
                  prompt = lines[-1] if lines else ""
                  if prompt.endswith(">"):
                      output = run_command(channel, "enable", 10)
                      lines = [line.strip() for line in output.splitlines() if line.strip()]
                      prompt = lines[-1] if lines else ""
                      if not prompt.endswith("#"):
                          raise RuntimeError("Could not enter privileged EXEC mode.")

                  config = run_command(channel, "show running-config", 60)
                  if re.search(r"Unknown command|Invalid command|Incomplete command|% Error|% Invalid", config, re.I):
                      raise RuntimeError("Switch rejected show running-config.")

                  entries = parse_bindings(config)
                  report = {"ip": HOST, "bindings": entries}
                  status = "success"
              except Exception:
                  report = {"ip": HOST, "bindings": []}
                  status = "failed"
              finally:
                  if client:
                      client.close()

              with open(OUTPUT_FILE, "w") as report_file:
                  json.dump(report, report_file, indent=2)
                  report_file.write("\n")
              print(json.dumps(report, indent=2))
              sys.exit(0 if status == "success" else 1)

          if __name__ == "__main__":
              main()

    - name: Execute Static MAC Filtration retrieval
      ansible.builtin.command:
        argv:
          - python3
          - "{{ tmp_dir }}/get_staticmacfiltration.py"
      register: static_mac_get_result
      changed_when: false
      failed_when: static_mac_get_result.rc != 0

    - name: Display Static MAC Filtration result
      ansible.builtin.debug:
        var: static_mac_get_result.stdout

