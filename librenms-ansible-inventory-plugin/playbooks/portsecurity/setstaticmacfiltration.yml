---
# ============================================================
# Set Static MAC Filtration
#
# Adds or deletes a static MAC address on a selected switch
# interface. The interface name is resolved dynamically from
# show running-config.
# Saves only the switch IP and operation result.
#
# Required Parameters:
# - target_interface: Interface (e.g. g0/4)
# - mac_address: MAC address (aabb.ccdd.eeff or aabbccddeeff)
# - operation: set or delete (defaults to set)
#
# Set:
# ansible-playbook -i inventory/10.10.10.1.yml   playbooks/portconfiguration/portsecurity/staticmacentry/setstaticmacfiltration.yml   -e '{"operation":"set","target_interface":"g0/4","mac_address":"aabb.ccdd.eeff"}'
# Delete:
# ansible-playbook -i inventory/10.10.10.1.yml playbooks/portconfiguration/portsecurity/staticmacentry/setstaticmacfiltration.yml -e '{"operation":"delete","target_interface":"g0/4","mac_address":"aabb.ccdd.eeff"}'
# ============================================================

- name: Set or Delete Static MAC Filtration Entry
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"

  tasks:
    - name: Validate Static MAC Filtration parameters
      ansible.builtin.assert:
        that:
          - target_interface is defined
          - (target_interface | string | length) > 0
          - mac_address is defined
          - (mac_address | string | length) > 0
          - (operation | default('set') | lower) in ['set', 'delete']
        fail_msg: "Provide target_interface, mac_address and operation set or delete."
        success_msg: "Static MAC Filtration parameters validated."

    - name: Create output directory
      ansible.builtin.file:
        path: "{{ output_dir }}"
        state: directory
        mode: "0755"

    - name: Create temporary directory
      ansible.builtin.file:
        path: "{{ tmp_dir }}"
        state: directory
        mode: "0755"

    - name: Generate Static MAC Filtration configuration script
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/set_staticmacfiltration.py"
        mode: "0755"
        content: |
          import sys
          import time
          import json
          import re
          import paramiko

          HOST = "{{ ansible_host | default(inventory_hostname) }}"
          SSH_PORT = int("{{ ansible_port | default(22) }}")
          USERNAME = "{{ ansible_user | default(ansible_ssh_user | default('admin')) }}"
          PASSWORD = "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
          TARGET_INTERFACE = "{{ target_interface }}"
          MAC_ADDRESS = "{{ mac_address }}"
          OPERATION = "{{ operation | default('set') | lower }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_staticmacfiltration_set.yml"

          def clean_output(text):
              text = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", text)
              # Drop pager prompts the switch has already erased with
              # backspaces - otherwise the next config line ends up glued
              # to "--More--" and is missed (e.g. "interface g0/2").
              text = re.sub(r" ?--More-- ?\x08+ *\x08*", "", text)
              return text.replace("\x08", "").replace("\r", "")

          def read_output(channel, wait=0.5):
              time.sleep(wait)
              output = ""
              while channel.recv_ready():
                  output += channel.recv(65535).decode("utf-8", errors="ignore")
                  time.sleep(0.1)
              return clean_output(output)

          def run_command(channel, command, timeout=30):
              channel.send(command + "\n")
              output = ""
              deadline = time.time() + timeout
              last_data = time.time()
              while time.time() < deadline:
                  if channel.recv_ready():
                      chunk = channel.recv(65535).decode("utf-8", errors="ignore")
                      output += chunk
                      last_data = time.time()
                      cleaned = clean_output(output)
                      if re.search(r"--More--|Press any key|Press <SPACE>", cleaned, re.I):
                          channel.send(" ")
                      lines = [line.strip() for line in cleaned.splitlines() if line.strip()]
                      if lines and re.search(r"[>#]\s*$", lines[-1]):
                          time.sleep(0.2)
                          while channel.recv_ready():
                              output += channel.recv(65535).decode("utf-8", errors="ignore")
                          return clean_output(output)
                  else:
                      time.sleep(0.15)
                      if output and time.time() - last_data > 2:
                          break
              return clean_output(output)

          def has_cli_error(output):
              patterns = [
                  r"Unknown command", r"Invalid command", r"invalid input",
                  r"Incomplete command", r"% Error", r"% Invalid",
                  r"command failed", r"configuration failed",
                  r"Port security control cannot be configured on the VLAN Trunk port"
              ]
              return any(re.search(pattern, output, re.I) for pattern in patterns)

          def normalize_interface(name):
              name = name.strip()
              patterns = [
                  (r"TGigaEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"TenGigabitEthernet\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"GigaEthernet\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"FastEthernet\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"Ethernet\s*(\d+)\s*/\s*(\d+)", "e"),
                  (r"tg\s*(\d+)\s*/\s*(\d+)", "tg"),
                  (r"ge\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"g\s*(\d+)\s*/\s*(\d+)", "g"),
                  (r"fe\s*(\d+)\s*/\s*(\d+)", "fe"),
                  (r"e\s*(\d+)\s*/\s*(\d+)", "e")
              ]
              for pattern, prefix in patterns:
                  match = re.fullmatch(pattern, name, re.I)
                  if match:
                      return prefix + match.group(1) + "/" + match.group(2)
              return name

          def normalize_mac(mac):
              mac = str(mac).strip().lower()
              if re.fullmatch(r"[0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}", mac):
                  return mac
              if re.fullmatch(r"[0-9a-f]{12}", mac):
                  return mac[0:4] + "." + mac[4:8] + "." + mac[8:12]
              raise ValueError("Invalid MAC address. Use aabb.ccdd.eeff or aabbccddeeff.")

          def discover_interfaces(config):
              found = []
              current = None
              for raw_line in config.splitlines():
                  line = raw_line.strip()
                  match = re.match(r"^interface\s+(.+?)\s*$", line, re.I)
                  if match:
                      name = match.group(1).strip()
                      normalized = normalize_interface(name)
                      if re.fullmatch(r"(?:tg|g|ge|fe|e)\d+\s*/\s*\d+", normalized, re.I):
                          current = {"interface": name, "normalized": normalized, "trunk": False}
                          found.append(current)
                      else:
                          current = None
                      continue
                  if current is not None and re.search(r"switchport\s+mode\s+trunk", line, re.I):
                      current["trunk"] = True
              return found

          def parse_bindings(config, target_name=None):
              entries = []
              current = None

              for raw_line in config.splitlines():
                  line = raw_line.strip()
                  match = re.match(r"^interface\s+(.+?)\s*$", line, re.I)

                  if match:
                      name = match.group(1).strip()
                      current = {
                          "interface": name,
                          "normalized": normalize_interface(name)
                      }
                      continue

                  match = re.match(
                      r"^switchport\s+port-security\s+static\s+mac-address\s+"
                      r"([0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4}|[0-9a-f]{12})\s*$",
                      line,
                      re.I
                  )

                  if match and current:
                      if (
                          target_name is None
                          or current["normalized"].lower() == target_name.lower()
                      ):
                          entries.append({
                              "interface": current["interface"],
                              "normalized_interface": current["normalized"],
                              "mac_address": normalize_mac(match.group(1))
                          })

              return entries

          def interface_config_lines(config, target_name):
              lines = []
              in_target = False

              for raw_line in config.splitlines():
                  line = raw_line.strip()
                  match = re.match(r"^interface\s+(.+?)\s*$", line, re.I)

                  if match:
                      name = normalize_interface(match.group(1).strip())
                      if in_target:
                          break
                      in_target = name.lower() == target_name.lower()

                  if in_target and line:
                      if line.lower().startswith("switchport port-security") or line.lower().startswith("interface "):
                          lines.append(line)

              return lines

          def main():
              client = None
              errors = []
              try:
                  if OPERATION not in ("set", "delete"):
                      raise ValueError("operation must be set or delete.")
                  wanted_interface = normalize_interface(TARGET_INTERFACE)
                  wanted_mac = normalize_mac(MAC_ADDRESS)

                  client = paramiko.SSHClient()
                  client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
                  client.connect(
                      hostname=HOST, port=SSH_PORT, username=USERNAME, password=PASSWORD,
                      look_for_keys=False, allow_agent=False, timeout=15,
                      banner_timeout=15, auth_timeout=15
                  )
                  channel = client.invoke_shell()
                  initial = read_output(channel, 2)
                  lines = [line.strip() for line in initial.splitlines() if line.strip()]
                  prompt = lines[-1] if lines else ""
                  if not prompt:
                      raise RuntimeError("Could not read the switch prompt.")
                  if prompt.endswith(">"):
                      output = run_command(channel, "enable")
                      lines = [line.strip() for line in output.splitlines() if line.strip()]
                      prompt = lines[-1] if lines else ""
                      if has_cli_error(output) or not prompt.endswith("#"):
                          raise RuntimeError("Could not enter privileged EXEC mode.")

                  config = run_command(channel, "show running-config", 60)
                  if has_cli_error(config):
                      raise RuntimeError("Switch rejected show running-config.")
                  interfaces = discover_interfaces(config)
                  selected = next(
                      (item for item in interfaces if item["normalized"].lower() == wanted_interface.lower()),
                      None
                  )
                  if not selected:
                      raise RuntimeError("Interface not found in running configuration: " + TARGET_INTERFACE)
                  if selected["trunk"]:
                      raise RuntimeError("Static MAC Filtration cannot be configured on a VLAN trunk port.")

                  output = run_command(channel, "config")
                  lines = [line.strip() for line in output.splitlines() if line.strip()]
                  prompt = lines[-1] if lines else ""
                  if has_cli_error(output) or "config#" not in prompt.lower():
                      raise RuntimeError("Could not enter configuration mode.")

                  output = run_command(channel, "interface " + selected["interface"])
                  if has_cli_error(output):
                      raise RuntimeError("Could not select interface " + selected["interface"])

                  command = "switchport port-security static mac-address " + wanted_mac
                  if OPERATION == "delete":
                      command = "no " + command
                  output = run_command(channel, command, 5)
                  if has_cli_error(output):
                      raise RuntimeError("Switch rejected the static MAC command.")

                  # Return to privileged mode and verify the requested state.
                  run_command(channel, "exit")
                  run_command(channel, "exit")
                  time.sleep(1)
                  verify_config = run_command(channel, "show running-config", 60)
                  if has_cli_error(verify_config):
                      raise RuntimeError("Could not verify the change using show running-config.")

                  verify_entries = parse_bindings(verify_config, selected["normalized"])
                  exists = any(entry["mac_address"] == wanted_mac for entry in verify_entries)

                  if OPERATION == "set" and not exists:
                      relevant_lines = interface_config_lines(
                          verify_config, selected["normalized"]
                      )
                      raise RuntimeError(
                          "MAC entry was not found after SET on "
                          + selected["normalized"]
                          + ". Relevant running-config lines: "
                          + (" | ".join(relevant_lines) if relevant_lines else "no interface/security lines captured")
                          + ". Check the command output and interface prompt."
                      )
                  if OPERATION == "delete" and exists:
                      raise RuntimeError(
                          "MAC entry is still present after DELETE on "
                          + selected["normalized"]
                      )

                  report = {
                      "ip": HOST,
                      "message": "Static MAC address configured successfully." if OPERATION == "set" else "Static MAC address deleted successfully."
                  }
                  status = "success"

              except Exception as exc:
                  errors.append(str(exc))
                  print("Static MAC Filtration error: " + str(exc), file=sys.stderr)
                  report = {
                      "ip": HOST,
                      "message": "Static MAC address operation failed."
                  }
                  status = "failed"
              finally:
                  if client:
                      client.close()

              with open(OUTPUT_FILE, "w") as report_file:
                  json.dump(report, report_file, indent=2)
                  report_file.write("\n")
              print(json.dumps(report, indent=2))
              sys.exit(0 if status == "success" else 1)

          if __name__ == "__main__":
              main()

    - name: Execute Static MAC Filtration operation
      ansible.builtin.command:
        argv:
          - python3
          - "{{ tmp_dir }}/set_staticmacfiltration.py"
      register: static_mac_result
      changed_when: static_mac_result.rc == 0
      failed_when: static_mac_result.rc != 0

    - name: Display Static MAC Filtration result
      ansible.builtin.debug:
        var: static_mac_result.stdout


