
---
# ============================================================
# Get Static MAC Filtration Mode
#
# Retrieves Static MAC Filtration Mode for all interfaces
# dynamically discovered from the running configuration.
# Supports Accept, Reject and Disable modes.
# Saves the execution report in the output directory.
# ============================================================

- name: Get Static MAC Filtration Mode
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    tmp_dir: "/opt/librenms/librenms-ansible-inventory-plugin/tmp"
    script_path: "{{ tmp_dir }}/get_staticmacfiltrationmode_{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}.py"

  tasks:
    - name: Create temporary and output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

    - name: Create Static MAC Filtration GET script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import os
          import re
          import json
          import time
          import paramiko

          HOST = os.environ["SWITCH_HOST"]
          USERNAME = os.environ["SWITCH_USERNAME"]
          PASSWORD = os.environ["SWITCH_PASSWORD"]

          ANSI_RE = re.compile(
              r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])'
          )
          PAGER_RE = re.compile(
              r'--\s*More\s*--',
              re.IGNORECASE
          )
          PROMPT_RE = re.compile(
              r'^[^\r\n]*[>#][ \t]*$'
          )

          def clean_output(value):
              value = ANSI_RE.sub("", value)
              value = value.replace("\r", "")
              cleaned = []

              for char in value:
                  if char == "\b":
                      if cleaned:
                          cleaned.pop()
                  else:
                      cleaned.append(char)

              return "".join(cleaned)

          def read_until_prompt(channel, timeout=300):
              output = ""
              pending = ""
              deadline = time.time() + timeout

              while time.time() < deadline:
                  if channel.recv_ready():
                      data = channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )
                      pending += data
                      cleaned_pending = clean_output(pending)

                      pager_match = PAGER_RE.search(cleaned_pending)

                      if pager_match:
                          before_pager = cleaned_pending[:pager_match.start()]
                          after_pager = cleaned_pending[pager_match.end():]
                          output += before_pager
                          pending = after_pager
                          channel.send(" ")
                          time.sleep(0.15)
                          continue

                      lines = cleaned_pending.splitlines()
                      non_empty_lines = [
                          line for line in lines if line.strip()
                      ]

                      if non_empty_lines:
                          last_line = non_empty_lines[-1].strip()

                          if PROMPT_RE.fullmatch(last_line):
                              output += cleaned_pending
                              return clean_output(output)
                  else:
                      time.sleep(0.05)

              raise Exception(
                  "Timeout waiting for switch prompt. Received output:\n"
                  + clean_output(output + pending)[-5000:]
              )

          def run_command(channel, command, timeout=300):
              channel.send(command + "\n")
              return read_until_prompt(channel, timeout=timeout)

          def parse_interfaces(running_config):
              interfaces = []
              current_interface = None
              current_mode = "Disable"

              for line in running_config.splitlines():
                  line = line.strip()

                  interface_match = re.match(
                      r'^interface\s+(\S+)',
                      line,
                      re.IGNORECASE
                  )

                  if interface_match:
                      if current_interface:
                          interfaces.append({
                              "interface": current_interface,
                              "static_mac_filtration_mode": current_mode
                          })

                      current_interface = interface_match.group(1)
                      current_mode = "Disable"

                      if not re.match(
                          r'^(tg|wg|cg)\d+/\d+/\d+$',
                          current_interface,
                          re.IGNORECASE
                      ):
                          current_interface = None

                      continue

                  if line == "!":
                      if current_interface:
                          interfaces.append({
                              "interface": current_interface,
                              "static_mac_filtration_mode": current_mode
                          })
                          current_interface = None
                          current_mode = "Disable"
                      continue

                  mode_match = re.match(
                      r'^switchport\s+port-security\s+mode\s+static\s+'
                      r'(accept|reject)\s*$',
                      line,
                      re.IGNORECASE
                  )

                  if current_interface and mode_match:
                      current_mode = mode_match.group(1).capitalize()

              if current_interface:
                  interfaces.append({
                      "interface": current_interface,
                      "static_mac_filtration_mode": current_mode
                  })

              return interfaces

          client = None
          channel = None

          try:
              client = paramiko.SSHClient()
              client.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              client.connect(
                  hostname=HOST,
                  port=22,
                  username=USERNAME,
                  password=PASSWORD,
                  timeout=15,
                  banner_timeout=20,
                  auth_timeout=15,
                  look_for_keys=False,
                  allow_agent=False
              )

              channel = client.invoke_shell()
              channel.settimeout(2)
              time.sleep(1)

              initial_output = ""
              while channel.recv_ready():
                  initial_output += channel.recv(65535).decode(
                      "utf-8", errors="ignore"
                  )

              run_command(channel, "enable", timeout=20)

              running_config = run_command(
                  channel,
                  "show running-config",
                  timeout=300
              )

              if not re.search(
                  r'^\s*interface\s+\S+',
                  running_config,
                  re.MULTILINE | re.IGNORECASE
              ):
                  raise Exception(
                      "No interface configuration found in running configuration."
                  )

              interfaces = parse_interfaces(running_config)

              if not interfaces:
                  raise Exception(
                      "No physical interfaces could be parsed from running configuration."
                  )

              result = {
                  "status": "SUCCESS",
                  "total_interfaces": len(interfaces),
                  "static_mac_filtration": interfaces
              }

              print(json.dumps(result))

          except Exception as error:
              print(json.dumps({
                  "status": "FAILED",
                  "message": str(error)
              }))
              raise

          finally:
              if channel:
                  channel.close()
              if client:
                  client.close()

    - name: Execute Static MAC Filtration GET
      ansible.builtin.command:
        cmd: python3 "{{ script_path }}"
      environment:
        SWITCH_HOST: "{{ ansible_host | default(inventory_hostname) }}"
        SWITCH_USERNAME: "{{ ansible_user }}"
        SWITCH_PASSWORD: "{{ ansible_password }}"
      register: static_mac_get
      changed_when: false
      no_log: true

    - name: Parse Static MAC Filtration result
      ansible.builtin.set_fact:
        static_mac_result: "{{ static_mac_get.stdout | from_json }}"

    - name: Save Static MAC Filtration report
      ansible.builtin.copy:
        content: "{{ static_mac_result | to_nice_yaml }}"
        dest: "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_staticmacfiltrationmode.yml"
        mode: "0644"

    - name: Display Static MAC Filtration result
      ansible.builtin.debug:
        var: static_mac_result

