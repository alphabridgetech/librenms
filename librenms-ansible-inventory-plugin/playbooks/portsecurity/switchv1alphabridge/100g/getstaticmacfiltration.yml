---
# ============================================================
# Get Static MAC Filtration Item
#
# Retrieves static MAC addresses configured on physical
# switch interfaces using show running-config.
# Dynamically discovers interfaces from running configuration.
# Handles paginated output and different switch prompts.
# Saves the retrieved data in the output directory.
# ============================================================

- name: Get Static MAC Filtration Item
  hosts: alphabridge_devices
  gather_facts: false
  connection: local

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    tmp_dir: "/opt/librenms/librenms-ansible-inventory-plugin/tmp"
    script_path: "{{ tmp_dir }}/get_staticmacfiltration_{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}.py"
    report_file: "{{ output_dir }}/{{ ansible_host | default(inventory_hostname) }}_staticmacfiltration.yml"

  tasks:
    - name: Create temporary and output directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

    - name: Create Static MAC Filtration GET script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: '0755'
        content: |
          import os
          import re
          import json
          import time
          import paramiko

          HOST = os.environ["SWITCH_HOST"]
          USERNAME = os.environ["SWITCH_USERNAME"]
          PASSWORD = os.environ["SWITCH_PASSWORD"]
          REPORT_FILE = os.environ["REPORT_FILE"]

          ANSI_RE = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PAGER_RE = re.compile(r'--\s*More\s*--', re.IGNORECASE)
          PROMPT_RE = re.compile(r'^[^\r\n]*[>#][ \t]*$')
          ERROR_RE = re.compile(
              r'unknown command|command incomplete|invalid input|'
              r'invalid command|ambiguous command|error:',
              re.IGNORECASE
          )

          PHYSICAL_INTERFACE_RE = re.compile(
              r'^(tg|wg|cg)\d+/\d+/\d+$',
              re.IGNORECASE
          )

          def clean_output(value):
              value = ANSI_RE.sub("", value)
              value = value.replace("\r", "")
              cleaned = []

              for char in value:
                  if char == "\b":
                      if cleaned:
                          cleaned.pop()
                  else:
                      cleaned.append(char)

              return "".join(cleaned)

          def read_until_prompt(channel, timeout=300):
              output = ""
              pending = ""
              deadline = time.time() + timeout

              while time.time() < deadline:
                  if channel.recv_ready():
                      data = channel.recv(65535).decode(
                          "utf-8", errors="ignore"
                      )
                      pending += data
                      cleaned_pending = clean_output(pending)

                      pager_match = PAGER_RE.search(cleaned_pending)

                      if pager_match:
                          output += cleaned_pending[:pager_match.start()]
                          pending = cleaned_pending[pager_match.end():]
                          channel.send(" ")
                          time.sleep(0.15)
                          continue

                      lines = cleaned_pending.splitlines()
                      non_empty_lines = [
                          line for line in lines if line.strip()
                      ]

                      if non_empty_lines:
                          last_line = non_empty_lines[-1].strip()

                          if PROMPT_RE.fullmatch(last_line):
                              output += cleaned_pending
                              return clean_output(output)

                  else:
                      time.sleep(0.05)

              raise Exception(
                  "Timeout waiting for switch prompt. Received output:\n"
                  + clean_output(output + pending)[-5000:]
              )

          def get_prompt(output):
              lines = [
                  line.strip()
                  for line in clean_output(output).splitlines()
                  if line.strip()
              ]

              if not lines:
                  raise Exception("Unable to identify switch prompt.")

              prompt = lines[-1]

              if not PROMPT_RE.fullmatch(prompt):
                  raise Exception("Invalid switch prompt: " + prompt)

              return prompt

          def run_command(channel, command, timeout=300):
              channel.send(command + "\n")
              output = read_until_prompt(channel, timeout)
              return output, get_prompt(output)

          def check_cli_error(output):
              cleaned = clean_output(output)

              if ERROR_RE.search(cleaned):
                  raise Exception(
                      "Switch rejected the command. CLI output:\n" + cleaned
                  )

          def parse_interfaces(config):
              interfaces = {}
              current_interface = None

              for line in config.splitlines():
                  match = re.match(
                      r'^\s*interface\s+(\S+)',
                      line,
                      re.I
                  )

                  if match:
                      interface_name = match.group(1).lower()

                      if PHYSICAL_INTERFACE_RE.match(interface_name):
                          current_interface = interface_name
                          interfaces.setdefault(
                              current_interface,
                              []
                          )
                      else:
                          current_interface = None

                      continue

                  if line.strip() == "!":
                      current_interface = None
                      continue

                  if current_interface:
                      mac_match = re.search(
                          r'^\s*switchport\s+port-security\s+static\s+'
                          r'mac-address\s+([0-9a-f:.-]+)',
                          line,
                          re.I
                      )

                      if mac_match:
                          mac_address = mac_match.group(1).lower()

                          if mac_address not in interfaces[current_interface]:
                              interfaces[current_interface].append(
                                  mac_address
                              )

              return interfaces

          def main():
              client = paramiko.SSHClient()
              client.set_missing_host_key_policy(
                  paramiko.AutoAddPolicy()
              )

              result = {
                  "status": "FAILED",
                  "total_interfaces": 0,
                  "static_mac_filtration": []
              }

              try:
                  client.connect(
                      hostname=HOST,
                      port=22,
                      username=USERNAME,
                      password=PASSWORD,
                      timeout=15,
                      banner_timeout=20,
                      auth_timeout=15,
                      look_for_keys=False,
                      allow_agent=False
                  )

                  channel = client.invoke_shell()
                  channel.settimeout(2)
                  time.sleep(1)

                  initial_output = read_until_prompt(channel, 30)
                  prompt = get_prompt(initial_output)

                  # Enter privileged mode only when required.
                  if prompt.endswith(">"):
                      output, prompt = run_command(
                          channel, "enable", timeout=30
                      )
                      check_cli_error(output)

                  # Retrieve the complete running configuration.
                  output, prompt = run_command(
                      channel, "show running-config", timeout=300
                  )
                  check_cli_error(output)

                  config = clean_output(output)

                  interfaces = parse_interfaces(config)

                  static_mac_filtration = []

                  for interface_name in sorted(interfaces):
                      if interfaces[interface_name]:
                          static_mac_filtration.append({
                              "interface": interface_name,
                              "static_mac_addresses": interfaces[
                                  interface_name
                              ]
                          })

                  result = {
                      "status": "SUCCESS",
                      "total_interfaces": len(static_mac_filtration),
                      "static_mac_filtration": static_mac_filtration
                  }

              except Exception as exc:
                  result["status"] = "FAILED"
                  result["message"] = str(exc)

              finally:
                  try:
                      client.close()
                  except Exception:
                      pass

                  os.makedirs(
                      os.path.dirname(REPORT_FILE),
                      exist_ok=True
                  )

                  with open(REPORT_FILE, "w") as report:
                      json.dump(result, report, indent=4)

                  print(json.dumps(result, indent=4))

                  if result["status"] != "SUCCESS":
                      raise SystemExit(1)

          if __name__ == "__main__":
              main()

    - name: Execute Static MAC Filtration GET
      ansible.builtin.command:
        argv:
          - python3
          - "{{ script_path }}"
      environment:
        SWITCH_HOST: "{{ ansible_host }}"
        SWITCH_USERNAME: "{{ ansible_user }}"
        SWITCH_PASSWORD: "{{ ansible_password | default(ansible_ssh_pass | default('')) }}"
        REPORT_FILE: "{{ report_file }}"
      register: get_result
      changed_when: false
      failed_when: get_result.rc != 0

    - name: Display Static MAC Filtration GET result
      ansible.builtin.debug:
        msg: "{{ get_result.stdout }}"
