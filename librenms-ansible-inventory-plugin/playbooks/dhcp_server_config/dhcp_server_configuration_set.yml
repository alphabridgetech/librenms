# =============================================================================
# Playbook Name : DHCP Server Configuration Set
# =============================================================================
#
# Description:
# Applies one or more global DHCP server settings over SSH and saves the
# configuration with `write`.
#
# Pass one or more GUI-named variables with `-e "name=value ..."`.
# Omitted fields are not changed. DHCP_Server accepts Enable or Disable.
#
# Example (set DHCP server and two parameters):
# ansible-playbook -i inventory/192.168.200.241.yml \
#   playbooks/l3/dhcp_server_config/dhcp_server_config_set.yml \
#   -e "DHCP_Server=Enable Number_of_ICMP_packets=9 ICMP_timeout=4"
#
# Example (change only timeout):
# ansible-playbook -i inventory/192.168.200.241.yml \
#   playbooks/l3/dhcp_server_config/dhcp_server_config_set.yml \
#   -e "ICMP_timeout=5"
# =============================================================================

- name: Set DHCP server configuration
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    # These files live in playbooks/<feature>/, so the plugin root is two
    # levels up.
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"
    dhcp_server_settings:
      enabled: "{{ DHCP_Server | default('') }}"
      ping_packets: "{{ Number_of_ICMP_packets | default('') }}"
      ping_timeout: "{{ ICMP_timeout | default('') }}"

  pre_tasks:
    - name: Ensure helper and output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

  tasks:
    - name: Create DHCP server configuration SSH helper
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/dhcp_server_config_set_exec_{{ ansible_host }}.py"
        mode: '0700'
        content: |
          #!/usr/bin/env python3

          import json
          import re
          import time
          import paramiko

          HOST = {{ ansible_host | to_json }}
          PORT = int({{ ansible_port | default(22) | to_json }})
          USER = {{ ansible_user | to_json }}
          PASSWORD = {{ ansible_password | to_json }}
          SETTINGS = json.loads({{ dhcp_server_settings | to_json | to_json }})

          ANSI_RE = re.compile(r'\x1b(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*\Z')
          CLI_ERROR_RE = re.compile(
              r'(?im)^\s*%\s*(?:invalid|error|incomplete|ambiguous|'
              r'unknown|unrecognized)\b|'
              r'\b(?:invalid input|unknown command|incomplete command|'
              r'command rejected|bad parameter|too many parameters|fail with ret\s*-?\d+)\b'
          )

          def build_commands(settings):
              commands = []

              enabled = settings.get("enabled", "").strip().lower()
              if enabled:
                  if enabled in ("enable", "true"):
                      commands.append("ip dhcpd enable")
                  elif enabled in ("disable", "false"):
                      commands.append("no ip dhcpd enable")
                  else:
                      raise ValueError("DHCP_Server must be Enable or Disable")

              for key, cli_key, maximum in (
                  ("ping_packets", "packets", 10),
                  ("ping_timeout", "timeout", 20),
              ):
                  raw_value = settings.get(key, "")
                  if raw_value in (None, "", "none"):
                      continue
                  try:
                      value = int(raw_value)
                  except (TypeError, ValueError) as exc:
                      raise ValueError(f"{key} must be an integer") from exc
                  if not 0 <= value <= maximum:
                      raise ValueError(f"{key} must be between 0 and {maximum}")
                  commands.append(f"ip dhcpd ping {cli_key} {value}")

              if not commands:
                  raise ValueError("Pass at least one DHCP server setting")
              return commands

          def read_until_prompt(shell, stage, timeout=30):
              buffer = ""
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  if shell.recv_ready():
                      buffer += shell.recv(65535).decode(errors="replace")
                      clean = ANSI_RE.sub("", buffer).replace("\r", "")
                      if PROMPT_RE.search(clean.rstrip()):
                          return clean
                  else:
                      time.sleep(0.1)
              raise TimeoutError(f"Timed out waiting for switch prompt during {stage}")

          def run_command(shell, command, timeout=30, check_errors=True):
              shell.send(command + "\n")
              output = read_until_prompt(shell, command, timeout)
              if check_errors and CLI_ERROR_RE.search(output):
                  raise RuntimeError(f"Switch rejected {command!r}: {output.strip()}")
              return output

          ssh = None
          shell = None
          stage = "input validation"
          commands = []
          applied = []
          try:
              commands = build_commands(SETTINGS)

              stage = "SSH connection"
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST, port=PORT, username=USER, password=PASSWORD,
                  look_for_keys=False, allow_agent=False,
                  timeout=20, auth_timeout=20, banner_timeout=20,
              )
              shell = ssh.invoke_shell()
              read_until_prompt(shell, "initial prompt", timeout=10)

              stage = "enable mode"
              run_command(shell, "enable", timeout=10, check_errors=False)
              stage = "disable paging"
              run_command(shell, "terminal length 0", timeout=10, check_errors=False)
              stage = "configuration mode"
              run_command(shell, "config", timeout=10)

              for command in commands:
                  stage = command
                  run_command(shell, command, timeout=15)
                  applied.append(command)

              stage = "exit configuration mode"
              run_command(shell, "exit", timeout=10, check_errors=False)

              stage = "save configuration"
              write_output = run_command(
                  shell, "write", timeout=20, check_errors=False
              )
              write_output = ANSI_RE.sub("", write_output)
              if re.search(r"%err|invalid|error|fail", write_output, re.IGNORECASE):
                  raise RuntimeError(
                      f"Switch rejected 'write': {write_output.strip()}"
                  )
              if "OK!" not in write_output:
                  raise RuntimeError(
                      "Switch did not confirm the configuration save: "
                      + write_output.strip()
                  )

              stage = "verify running configuration"
              running_config = run_command(
                  shell, "show run non-interface", timeout=60
              )
              clean_config = ANSI_RE.sub("", running_config).replace("\r", "")
              if not any(
                  line.strip().lower().startswith("!version ")
                  or line.strip().lower() == "current configuration:"
                  for line in clean_config.splitlines()
              ):
                  raise RuntimeError("SHOW output does not contain a running-config header")

              print(json.dumps({
                  "ip": HOST,
                  "status": "success"
              }))
          except Exception as exc:
              print(json.dumps({
                  "ip": HOST,
                  "status": "failed",
                  "stage": stage,
                  "applied_commands": applied,
                  "error": str(exc),
              }))
          finally:
              if shell is not None:
                  shell.close()
              if ssh is not None:
                  ssh.close()
      no_log: true

    - name: Execute DHCP server configuration helper
      ansible.builtin.command:
        argv:
          - "{{ project_root }}/bin/python3"   # plugin venv (has paramiko)
          - "{{ tmp_dir }}/dhcp_server_config_set_exec_{{ ansible_host }}.py"
      register: dhcp_server_raw
      changed_when: >-
        dhcp_server_raw.rc == 0 and
        '"status": "success"' in dhcp_server_raw.stdout
      failed_when: false

    - name: Fail if helper returned no JSON
      ansible.builtin.fail:
        msg: >-
          DHCP server SET helper returned no JSON.
          rc={{ dhcp_server_raw.rc }}; stderr={{ dhcp_server_raw.stderr }}
      when: dhcp_server_raw.stdout | trim | length == 0

    - name: Parse DHCP server configuration result
      ansible.builtin.set_fact:
        dhcp_server_result: "{{ dhcp_server_raw.stdout | from_json }}"

    - name: Fail if DHCP server configuration failed
      ansible.builtin.fail:
        msg: >-
          DHCP server SET failed during
          {{ dhcp_server_result.stage | default('execution') }}:
          {{ dhcp_server_result.error | default(dhcp_server_raw.stderr) }}
          Applied before failure: {{ dhcp_server_result.applied_commands | default([]) }}
      when: dhcp_server_result.status != 'success' or dhcp_server_raw.rc != 0

    - name: Display DHCP server configuration result
      ansible.builtin.debug:
        msg: "{{ dhcp_server_result | to_nice_yaml(indent=2, sort_keys=False) }}"

    - name: Save DHCP server configuration result
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_dhcp_server_config_set.yml"
        content: "{{ dhcp_server_result | to_nice_yaml(indent=2, sort_keys=False) }}"

    - name: Display result path
      ansible.builtin.debug:
        msg: >-
          DHCP server configuration applied and saved successfully.
          Saved to output/{{ ansible_host }}_dhcp_server_config_set.yml
