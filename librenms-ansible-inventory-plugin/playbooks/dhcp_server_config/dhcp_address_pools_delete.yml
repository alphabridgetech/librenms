# ==========================================
# dhcp_address_pools_delete.yml
#
# Description:
# Deletes a DHCP address pool by its profile name and saves the configuration.
#
# Usage:
# ansible-playbook -i inventory/192.168.200.241.yml \
#   playbooks/l3/dhcp_server_config/dhcp_address_pools_delete.yml \
#   -e "Pool_Name=testing"
#
# The switch command for this example is: no ip dhcpd pool testing
# ==========================================

- name: Delete DHCP address pool
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    # These files live in playbooks/<feature>/, so the plugin root is two
    # levels up.
    project_root: "{{ playbook_dir }}/../.."
    output_dir: "{{ project_root }}/output"
    tmp_dir: "{{ project_root }}/tmp"
    dhcp_pool_name: "{{ Pool_Name | default('') }}"

  pre_tasks:
    - name: Ensure helper and output directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ tmp_dir }}"
        - "{{ output_dir }}"

  tasks:
    - name: Create DHCP address pool delete SSH helper
      ansible.builtin.copy:
        dest: "{{ tmp_dir }}/dhcp_address_pools_delete_exec_{{ ansible_host }}.py"
        mode: '0700'
        content: |
          #!/usr/bin/env python3

          import json
          import re
          import time
          import paramiko

          HOST = {{ ansible_host | to_json }}
          PORT = int({{ ansible_port | default(22) | to_json }})
          USER = {{ ansible_user | to_json }}
          PASSWORD = {{ ansible_password | to_json }}
          POOL_NAME = {{ dhcp_pool_name | to_json }}

          ANSI_RE = re.compile(r'\x1b(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*\Z')
          CLI_ERROR_RE = re.compile(
              r'(?im)^\s*%\s*(?:invalid|error|incomplete|ambiguous|'
              r'unknown|unrecognized)\b|'
              r'\b(?:invalid input|unknown command|incomplete command|'
              r'command rejected|bad parameter|too many parameters|fail with ret\s*-?\d+)\b'
          )

          def read_until_prompt(shell, stage, timeout=30):
              buffer = ""
              deadline = time.monotonic() + timeout
              while time.monotonic() < deadline:
                  if shell.recv_ready():
                      buffer += shell.recv(65535).decode(errors="replace")
                      clean = ANSI_RE.sub("", buffer).replace("\r", "")
                      if PROMPT_RE.search(clean.rstrip()):
                          return clean
                  else:
                      time.sleep(0.1)
              raise TimeoutError(f"Timed out waiting for switch prompt during {stage}")

          def run_command(shell, command, timeout=30, check_errors=True):
              shell.send(command + "\n")
              output = read_until_prompt(shell, command, timeout)
              if check_errors and CLI_ERROR_RE.search(output):
                  raise RuntimeError(f"Switch rejected {command!r}: {output.strip()}")
              return output

          ssh = None
          shell = None
          stage = "input validation"
          try:
              if not POOL_NAME or not re.fullmatch(r"[A-Za-z0-9_.-]+", POOL_NAME):
                  raise ValueError(
                      "Pool_Name is required and may contain only letters, numbers, "
                      "underscores, periods, and hyphens"
                  )
              command = f"no ip dhcpd pool {POOL_NAME}"

              stage = "SSH connection"
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  HOST, port=PORT, username=USER, password=PASSWORD,
                  look_for_keys=False, allow_agent=False,
                  timeout=20, auth_timeout=20, banner_timeout=20,
              )
              shell = ssh.invoke_shell()
              read_until_prompt(shell, "initial prompt", timeout=10)
              stage = "enable mode"
              run_command(shell, "enable", timeout=10, check_errors=False)
              stage = "disable paging"
              run_command(shell, "terminal length 0", timeout=10, check_errors=False)
              stage = "configuration mode"
              run_command(shell, "config", timeout=10)
              stage = command
              run_command(shell, command, timeout=15)
              stage = "exit configuration mode"
              run_command(shell, "exit", timeout=10, check_errors=False)
              stage = "save configuration"
              write_output = ANSI_RE.sub(
                  "", run_command(shell, "write", timeout=20, check_errors=False)
              )
              if re.search(r"%err|invalid|error|fail", write_output, re.IGNORECASE):
                  raise RuntimeError(f"Switch rejected 'write': {write_output.strip()}")
              if "OK!" not in write_output:
                  raise RuntimeError(
                      "Switch did not confirm the configuration save: "
                      + write_output.strip()
                  )

              stage = "verify deleted pool"
              config = run_command(shell, "show run non-interface", timeout=60)
              clean_config = ANSI_RE.sub("", config).replace("\r", "")
              if not any(
                  line.strip().lower().startswith("!version ")
                  or line.strip().lower() == "current configuration:"
                  for line in clean_config.splitlines()
              ):
                  raise RuntimeError("SHOW output does not contain a running-config header")
              pool_prefix = f"ip dhcpd pool {POOL_NAME}".lower()
              if any(line.strip().lower() == pool_prefix for line in clean_config.splitlines()):
                  raise RuntimeError(f"Pool {POOL_NAME!r} remains in running configuration")

              print(json.dumps({"ip": HOST, "pool_name": POOL_NAME, "status": "success"}))
          except Exception as exc:
              print(json.dumps({
                  "ip": HOST,
                  "pool_name": POOL_NAME,
                  "status": "failed",
                  "stage": stage,
                  "error": str(exc),
              }))
          finally:
              if shell is not None:
                  shell.close()
              if ssh is not None:
                  ssh.close()
      no_log: true

    - name: Execute DHCP address pool delete helper
      ansible.builtin.command:
        argv:
          - "{{ project_root }}/bin/python3"   # plugin venv (has paramiko)
          - "{{ tmp_dir }}/dhcp_address_pools_delete_exec_{{ ansible_host }}.py"
      register: dhcp_pool_delete_raw
      changed_when: >-
        dhcp_pool_delete_raw.rc == 0 and
        '"status": "success"' in dhcp_pool_delete_raw.stdout
      failed_when: false

    - name: Fail if helper returned no JSON
      ansible.builtin.fail:
        msg: >-
          DHCP address pool DELETE helper returned no JSON.
          rc={{ dhcp_pool_delete_raw.rc }}; stderr={{ dhcp_pool_delete_raw.stderr }}
      when: dhcp_pool_delete_raw.stdout | trim | length == 0

    - name: Parse DHCP address pool delete result
      ansible.builtin.set_fact:
        dhcp_pool_delete_result: "{{ dhcp_pool_delete_raw.stdout | from_json }}"

    - name: Fail if DHCP address pool deletion failed
      ansible.builtin.fail:
        msg: >-
          DHCP address pool DELETE failed during
          {{ dhcp_pool_delete_result.stage | default('execution') }}:
          {{ dhcp_pool_delete_result.error | default(dhcp_pool_delete_raw.stderr) }}
      when: dhcp_pool_delete_result.status != 'success' or dhcp_pool_delete_raw.rc != 0

    - name: Display DHCP address pool delete result
      ansible.builtin.debug:
        msg: "{{ dhcp_pool_delete_result | to_nice_yaml(indent=2, sort_keys=False) }}"

    - name: Save DHCP address pool delete result
      ansible.builtin.copy:
        dest: "{{ output_dir }}/{{ ansible_host }}_dhcp_address_pools_delete.yml"
        content: "{{ dhcp_pool_delete_result | to_nice_yaml(indent=2, sort_keys=False) }}"

    - name: Display result path
      ansible.builtin.debug:
        msg: >-
          DHCP address pool {{ dhcp_pool_delete_result.pool_name }} deleted and saved.
          Saved to output/{{ ansible_host }}_dhcp_address_pools_delete.yml
