# =============================================================================
# File        : switchv1alphabridge/100g/delete_basic_arp.yml
# Feature     : Delete static ARP entry (100G switches, e.g. AS300/56/XC)
#
# CLI (100G syntax differs from 10G "no arp <ip> vlan <id>"):
#   config
#   no arp static <ip> <vlan>
#   exit
#   write
#
# Extra vars: ip_address, interface_vlan
#
# Output (same as playbooks/arp/delete_basic_arp.yml):
#   output/<switch_ip>_delete_basic_arp.yml   -> status: success | failed, error
# =============================================================================

- name: Delete static ARP entry on 100G switch
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    plugin_dir: "/opt/librenms/librenms-ansible-inventory-plugin"
    script_path: "{{ plugin_dir }}/tmp/delete_basic_arp_100g_{{ ansible_host }}.py"
    output_file: "{{ plugin_dir }}/output/{{ ansible_host }}_delete_basic_arp.yml"

  tasks:

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - ip_address is defined
          - ip_address is match('^(\d{1,3}\.){3}\d{1,3}$')
          - interface_vlan is defined
          - (interface_vlan | int) >= 1 and (interface_vlan | int) <= 4094
        fail_msg: "ip_address and interface_vlan (1-4094) are required"

    - name: Create Python SSH script for deleting static ARP
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import re
          import sys
          import time

          import paramiko
          import yaml

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_file }}"

          IP_ADDRESS = "{{ ip_address }}"
          VLAN = "{{ interface_vlan | int }}"

          ANSI_RE = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*$')
          CLI_ERROR_RE = re.compile(r'Bad parameter|Unknown command|Incomplete|not exist|%\s*err|error|fail', re.IGNORECASE)


          def read_until_prompt(shell, timeout=10):
              buf = ""
              end = time.time() + timeout
              while time.time() < end:
                  if shell.recv_ready():
                      buf += shell.recv(65535).decode(errors="ignore")
                      if PROMPT_RE.search(buf):
                          return buf
                  else:
                      time.sleep(0.1)
              return buf


          def run(shell, command, timeout=10):
              shell.send(command + "\n")
              return ANSI_RE.sub("", read_until_prompt(shell, timeout)).replace("\r", "")


          def save(data):
              with open(OUTPUT_FILE, "w") as f:
                  yaml.safe_dump(data, f, default_flow_style=False, sort_keys=False)


          ssh = None
          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(HOST, username=USER, password=PASSWORD,
                          look_for_keys=False, allow_agent=False, timeout=15)

              shell = ssh.invoke_shell()
              read_until_prompt(shell, 5)
              run(shell, "enable", 5)

              config_out = run(shell, "config", 5)
              if "(config)#" not in config_out:
                  raise Exception("Could not enter config mode: " + config_out.strip())

              command = f"no arp static {IP_ADDRESS} {VLAN}"
              del_out = run(shell, command)
              result = del_out.replace(command, "")
              if CLI_ERROR_RE.search(result):
                  raise Exception(f"Switch rejected '{command}': {result.strip()}")

              run(shell, "exit", 5)
              run(shell, "write", 30)

              # Confirm the static entry is gone (poll: the switch applies the
              # delete a moment after the command returns)
              still_there = None
              for _ in range(10):
                  show_out = run(shell, "show arp", 15)
                  still_there = re.search(
                      rf'^\s*{re.escape(IP_ADDRESS)}\s+\S+\s+v{VLAN}\(null\)',
                      show_out, re.IGNORECASE | re.MULTILINE)
                  if not still_there:
                      break
                  time.sleep(1)
              ssh.close()

              if still_there:
                  raise Exception(f"Static entry {IP_ADDRESS} vlan {VLAN} is still in 'show arp' after deleting")

              save({"ip": HOST, "ip_address": IP_ADDRESS, "interface_vlan": int(VLAN),
                    "command": command, "status": "success"})
              print("SUCCESS:", command)

          except Exception as e:
              try:
                  if ssh:
                      ssh.close()
              except Exception:
                  pass
              save({"ip": HOST, "ip_address": IP_ADDRESS, "status": "failed", "error": str(e)})
              print("ERROR:", e)
              sys.exit(1)
      delegate_to: localhost

    - name: Run delete ARP script
      ansible.builtin.command:
        cmd: "{{ plugin_dir }}/bin/python3 {{ script_path }}"
      register: arp_run
      changed_when: arp_run.rc == 0
      failed_when: false
      delegate_to: localhost

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ arp_run.stdout_lines + arp_run.stderr_lines }}"

    - name: Fail if delete failed
      ansible.builtin.fail:
        msg: "{{ arp_run.stdout }}"
      when: arp_run.rc != 0
