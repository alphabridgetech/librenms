# =============================================================================
# File        : switchv1alphabridge/100g/edit_basic_arp.yml
# Feature     : Edit static ARP entry (100G switches, e.g. AS300/56/XC)
#
# Finds the existing static entry for ip_address in "show arp", removes it and
# adds it again with the new MAC / VLAN.
#
# CLI:
#   config
#   no arp static <ip> <old_vlan>
#   arp static <ip> <new_mac> <new_vlan>
#   exit
#   write
#
# Extra vars: ip_address, mac_address, interface_vlan (new values)
#
# Output (same as playbooks/arp/edit_basic_arp.yml):
#   output/<switch_ip>_edit_basic_arp.yml   -> status: success | failed, error
# =============================================================================

- name: Edit static ARP entry on 100G switch
  hosts: alphabridge_devices
  gather_facts: false

  vars:
    plugin_dir: "/opt/librenms/librenms-ansible-inventory-plugin"
    script_path: "{{ plugin_dir }}/tmp/edit_basic_arp_100g_{{ ansible_host }}.py"
    output_file: "{{ plugin_dir }}/output/{{ ansible_host }}_edit_basic_arp.yml"

  tasks:

    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - ip_address is defined
          - ip_address is match('^(\d{1,3}\.){3}\d{1,3}$')
          - mac_address is defined
          - mac_address is match('^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$')
          - interface_vlan is defined
          - (interface_vlan | int) >= 1 and (interface_vlan | int) <= 4094
        fail_msg: "ip_address, mac_address (AA:BB:CC:DD:EE:FF) and interface_vlan (1-4094) are required"

    - name: Create Python SSH script for editing static ARP
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import re
          import sys
          import time

          import paramiko
          import yaml

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_file }}"

          IP_ADDRESS = "{{ ip_address }}"
          MAC_ADDRESS = "{{ mac_address | lower }}"
          VLAN = "{{ interface_vlan | int }}"

          ANSI_RE = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          PROMPT_RE = re.compile(r'[>#]\s*$')
          CLI_ERROR_RE = re.compile(r'Bad parameter|Unknown command|Incomplete|not exist|%\s*err|error|fail', re.IGNORECASE)


          def read_until_prompt(shell, timeout=10):
              buf = ""
              end = time.time() + timeout
              while time.time() < end:
                  if shell.recv_ready():
                      buf += shell.recv(65535).decode(errors="ignore")
                      if PROMPT_RE.search(buf):
                          return buf
                  else:
                      time.sleep(0.1)
              return buf


          def run(shell, command, timeout=10):
              shell.send(command + "\n")
              return ANSI_RE.sub("", read_until_prompt(shell, timeout)).replace("\r", "")


          def check(command, output):
              result = output.replace(command, "")
              if CLI_ERROR_RE.search(result):
                  raise Exception(f"Switch rejected '{command}': {result.strip()}")


          def save(data):
              with open(OUTPUT_FILE, "w") as f:
                  yaml.safe_dump(data, f, default_flow_style=False, sort_keys=False)


          ssh = None
          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(HOST, username=USER, password=PASSWORD,
                          look_for_keys=False, allow_agent=False, timeout=15)

              shell = ssh.invoke_shell()
              read_until_prompt(shell, 5)
              run(shell, "enable", 5)

              # Find the current static entry: "<ip>  <mac>  v<vlan>(null)"
              show_out = run(shell, "show arp", 15)
              current = re.search(
                  rf'^\s*{re.escape(IP_ADDRESS)}\s+(\S+)\s+v(\d+)\(null\)',
                  show_out, re.IGNORECASE | re.MULTILINE)
              if not current:
                  raise Exception(f"No static ARP entry found for {IP_ADDRESS}")
              old_mac, old_vlan = current.group(1).lower(), current.group(2)

              def config_mode():
                  out = run(shell, "config", 5)
                  if "(config)#" not in out:
                      raise Exception("Could not enter config mode: " + out.strip())

              def wait_for(pattern, present, tries=10):
                  # The switch applies ARP changes a moment after the command
                  # returns, so poll "show arp" until the entry is (not) there.
                  out = ""
                  for _ in range(tries):
                      out = run(shell, "show arp", 15)
                      if bool(re.search(pattern, out, re.IGNORECASE | re.MULTILINE)) == present:
                          return True, out
                      time.sleep(1)
                  return False, out

              old_re = rf'^\s*{re.escape(IP_ADDRESS)}\s+\S+\s+v{old_vlan}\(null\)'
              new_re = rf'^\s*{re.escape(IP_ADDRESS)}\s+{re.escape(MAC_ADDRESS)}\s+v{VLAN}\('

              # 1. Remove the old entry and wait until it has really gone.
              #    Adding straight away gets undone by the pending delete.
              config_mode()
              del_cmd = f"no arp static {IP_ADDRESS} {old_vlan}"
              check(del_cmd, run(shell, del_cmd))
              run(shell, "exit", 5)

              gone, show_out = wait_for(old_re, present=False)
              if not gone:
                  raise Exception(f"Old entry {IP_ADDRESS} vlan {old_vlan} was not removed. Output: {show_out.strip()}")

              # 2. Add the new entry and wait until it shows up.
              config_mode()
              add_cmd = f"arp static {IP_ADDRESS} {MAC_ADDRESS} {VLAN}"
              add_out = run(shell, add_cmd)
              try:
                  check(add_cmd, add_out)
              except Exception:
                  # Put the old entry back so the edit does not lose it
                  run(shell, f"arp static {IP_ADDRESS} {old_mac} {old_vlan}")
                  run(shell, "exit", 5)
                  run(shell, "write", 30)
                  raise
              run(shell, "exit", 5)

              found, show_out = wait_for(new_re, present=True)
              if not found:
                  raise Exception(f"Entry {IP_ADDRESS} {MAC_ADDRESS} vlan {VLAN} not found in 'show arp' after editing. Output: {show_out.strip()}")

              run(shell, "write", 30)
              ssh.close()

              save({"ip": HOST, "ip_address": IP_ADDRESS,
                    "old_mac_address": old_mac, "old_interface_vlan": int(old_vlan),
                    "mac_address": MAC_ADDRESS, "interface_vlan": int(VLAN),
                    "status": "success"})
              print("SUCCESS:", del_cmd, "->", add_cmd)

          except Exception as e:
              try:
                  if ssh:
                      ssh.close()
              except Exception:
                  pass
              save({"ip": HOST, "ip_address": IP_ADDRESS, "status": "failed", "error": str(e)})
              print("ERROR:", e)
              sys.exit(1)
      delegate_to: localhost

    - name: Run edit ARP script
      ansible.builtin.command:
        cmd: "{{ plugin_dir }}/bin/python3 {{ script_path }}"
      register: arp_run
      changed_when: arp_run.rc == 0
      failed_when: false
      delegate_to: localhost

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ arp_run.stdout_lines + arp_run.stderr_lines }}"

    - name: Fail if edit failed
      ansible.builtin.fail:
        msg: "{{ arp_run.stdout }}"
      when: arp_run.rc != 0
