---
- name: Show VLAN configuration via SSH
  hosts: all
  gather_facts: no

  vars:
    output_dir: "/opt/librenms/librenms-ansible-inventory-plugin/output"
    script_path: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/show_vlan_exec.py"
    python_bin: "/opt/librenms/librenms-ansible-inventory-plugin/bin/python3"

  tasks:

    - name: Copy Python VLAN SHOW script
      ansible.builtin.copy:
        dest: "{{ script_path }}"
        mode: "0755"
        content: |
          import paramiko
          import time
          import os
          import sys
          import re

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          OUTPUT_FILE = "{{ output_dir }}/{{ ansible_host }}_vlan.yml"

          def read_all(chan, timeout=5):
              end = time.time() + timeout
              output = ""
              while time.time() < end:
                  if chan.recv_ready():
                      data = chan.recv(65535).decode(errors="ignore")
                      output += data

                      # Handle pagination
                      if "--More--" in data:
                          chan.send(" ")
                  else:
                      time.sleep(0.2)
              return output

          try:
              ssh = paramiko.SSHClient()
              ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
              ssh.connect(
                  hostname=HOST,
                  username=USER,
                  password=PASSWORD,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=10
              )

              shell = ssh.invoke_shell()
              time.sleep(1)
              shell.recv(65535)

              shell.send("enable\n")
              time.sleep(0.5)
              shell.send(PASSWORD + "\n")
              time.sleep(0.5)

              # Disable paging (vendor-safe)
              shell.send("terminal length 0\n")
              time.sleep(0.5)

              shell.send("show running-config\n")
              output = read_all(shell, 6)

              ssh.close()

              vlan_line = ""
              for line in output.splitlines():
                  line = line.strip()
                  if line.startswith("vlan "):
                      vlan_line = line.replace("vlan", "").strip()
                      break

              if not vlan_line:
                  vlan_list = []
              else:
                  vlan_list = vlan_line

              os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)

              with open(OUTPUT_FILE, "w") as f:
                  f.write(f"ip: {HOST}\n")
                  f.write("vlans:\n")
                  f.write(f"  configured: \"{vlan_list}\"\n")

              print("SUCCESS")

          except Exception as e:
              print("ERROR")
              print(str(e))
              sys.exit(1)

    - name: Run VLAN SHOW script
      ansible.builtin.command:
        cmd: "{{ python_bin }} {{ script_path }}"
      register: vlan_output
      changed_when: false
      failed_when: "'ERROR' in vlan_output.stdout"

    - name: Display VLAN output
      ansible.builtin.debug:
        msg: "{{ vlan_output.stdout }}"
