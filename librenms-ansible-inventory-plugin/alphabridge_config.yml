---
- name: Retrieve CPU Usage from AlphaBridge Device via Telnet
  hosts: alphabridge_devices
  gather_facts: no
  become: yes
  become_method: sudo
  tasks:
    - name: Ensure /opt/librenms/librenms-ansible-inventory-plugin/tmp/ exists
      ansible.builtin.file:
        path: /opt/librenms/librenms-ansible-inventory-plugin/tmp
        state: directory
        mode: '0755'

    - name: Create Telnet script
      ansible.builtin.copy:
        dest: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/telnet_script.py"
        mode: '0755'
        content: |
          import telnetlib
          import time

          HOST = "{{ ansible_host }}"
          USER = "{{ ansible_user }}"
          PASSWORD = "{{ ansible_password }}"
          COMMAND = "{{cmd}}"

          try:
              tn = telnetlib.Telnet(HOST, timeout=10)

              tn.read_until(b"Username:")
              tn.write(USER.encode('ascii') + b"\n")

              tn.read_until(b"Password:")
              tn.write(PASSWORD.encode('ascii') + b"\n")

              tn.read_until(b">")
              tn.write(b"enable\n")

              tn.read_until(b"#")
              tn.write(COMMAND.encode('ascii') + b"\n")
              time.sleep(2)  # Give time for output to complete

              output = tn.read_very_eager().decode('ascii')
              tn.write(b"exit\n")
              tn.close()

              with open("/opt/librenms/librenms-ansible-inventory-plugin/tmp/alphabridge_cpu_data.txt", "w") as f:
                  f.write(output)

          except Exception as e:
              with open("/opt/librenms/librenms-ansible-inventory-plugin/tmp/alphabridge_cpu_data.txt", "w") as f:
                  f.write("Error: " + str(e))

    - name: Execute Telnet script
      ansible.builtin.command: python3 /opt/librenms/librenms-ansible-inventory-plugin/tmp/telnet_script.py
      register: output
      changed_when: false

    - name: Fetch CPU data file
      ansible.builtin.fetch:
        src: "/opt/librenms/librenms-ansible-inventory-plugin/tmp/alphabridge_cpu_data.txt"
        dest: "./alphabridge_cpu_data.txt"
        flat: yes
